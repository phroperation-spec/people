const RECRUIT_FIELDS = [
  ['avgSalary','Recruitment Ave. Salary'],
  ['interviewerTime','Hiring Manager/Interviewer Time'],
  ['loadAllocation','Load Allocation'],
  ['adPosting','Recruitment Ad Posting'],
  ['travelExpense','Travel Expense (Recruitment Activity)'],
  ['collaterals','Recruitment Collaterals']
];
function recruitKey(company, ms){ return company+'|'+ms; }
function getRecruitRecord(company, ms){
  const v = RECRUIT[recruitKey(company,ms)];
  if(typeof v === 'number') return {avgSalary:v}; // backward-compat with the old single-amount format
  return v || {};
}
function getRecruitCost(company, ms){
  const rec = getRecruitRecord(company, ms);
  return RECRUIT_FIELDS.reduce((sum,[k])=> sum + (Number(rec[k])||0), 0);
}
async function setRecruitField(company, ms, field, val){
  const key = recruitKey(company, ms);
  const rec = getRecruitRecord(company, ms);
  rec[field] = Number(val)||0;
  RECRUIT[key] = rec;
  await saveRecruit();
}
function orgRecruitCost(ms){ return allCompanies().reduce((sum,c)=> sum+getRecruitCost(c.company, ms), 0); }
function costPerHire(company, ms){
  const cost = getRecruitCost(company, ms);
  const hires = EMP.filter(e=>{ const {start,end}=monthBounds(ms); return e.company===company && isHiredIn(e,start,end); }).length;
  return hires ? cost/hires : null;
}
function recruitRatio(company, ms){
  const total = orgRecruitCost(ms);
  return total ? (getRecruitCost(company,ms)/total*100) : null;
}
/* Annual (12-month) aggregates */
function yearMonths(year){ return Array.from({length:12}, (_,i)=> `${year}-${String(i+1).padStart(2,'0')}`); }
function getRecruitRecordAnnual(company, year){
  const rec = {};
  RECRUIT_FIELDS.forEach(([k])=> rec[k]=0);
  yearMonths(year).forEach(ms=>{
    const m = getRecruitRecord(company, ms);
    RECRUIT_FIELDS.forEach(([k])=> rec[k]+= Number(m[k])||0);
  });
  return rec;
}
function getRecruitCostAnnual(company, year){
  const rec = getRecruitRecordAnnual(company, year);
  return RECRUIT_FIELDS.reduce((sum,[k])=> sum+(rec[k]||0), 0);
}
function orgRecruitCostAnnual(year){ return allCompanies().reduce((sum,c)=> sum+getRecruitCostAnnual(c.company, year), 0); }
function hiresInYear(company, year){
  return EMP.filter(e=>{ const d = hireTagDate(e); return e.company===company && !e.excludeFromHireCount && STATUS_KEY(e.employmentStatus)!=='intern' && d && d.getFullYear()===year; }).length;
}
function costPerHireAnnual(company, year){
  const cost = getRecruitCostAnnual(company, year);
  const hires = hiresInYear(company, year);
  return hires ? cost/hires : null;
}
function recruitRatioAnnual(company, year){
  const total = orgRecruitCostAnnual(year);
  return total ? (getRecruitCostAnnual(company,year)/total*100) : null;
}

function toast(msg){
  let t = document.createElement('div');
  t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

/* ============ DERIVED HELPERS ============ */
function allCompanies(){
  let out=[];
  // Defensive: an industry entry missing/malformed `companies` (e.g. from a corrupted or
  // partially-synced Control Panel edit) used to crash the whole app on load — every render
  // path routes through here, so one bad industry entry took down the entire page before it
  // could even render the login screen. Treat a missing/non-array companies list as empty
  // instead of throwing.
  (CONFIG.industries||[]).forEach(ind=> (Array.isArray(ind.companies)?ind.companies:[]).forEach(c=> out.push({industry:ind.name, company:c})));
  return out;
}
function ccdKey(company, costCenter){ return company+'|'+(costCenter||'').trim(); }
function costCentersForCompany(company){
  const fromEmp = EMP.filter(e=> e.company===company).map(e=> (e.costCenter||'').trim()).filter(Boolean);
  const manual = (CONFIG.manualCostCenters && CONFIG.manualCostCenters[company]) || [];
  return Array.from(new Set([...fromEmp, ...manual])).sort();
}
function departmentOf(company, costCenter){
  return CONFIG.costCenterDepartment[ccdKey(company, costCenter)] || 'Unassigned';
}
// Departments, like cost centers, are segregated per company — a department added for one
// company never shows up as an option for another.
function departmentsForCompany(company){
  CONFIG.departments = CONFIG.departments || {};
  return ((CONFIG.departments[company] || []).slice()).sort();
}
// Resolves an employee's department. Precedence: a per-employee override set directly from the
// roster (departmentOverride) wins, then the cost-center → department mapping (per company),
// then whatever department string is on the record, then '' / 'Unassigned'.
function deptOfEmployee(e, fallbackUnassigned){
  if(e.departmentOverride) return e.departmentOverride;
  const mapped = CONFIG.costCenterDepartment[ccdKey(e.company, e.costCenter)];
  return mapped || e.department || (fallbackUnassigned ? 'Unassigned' : '');
}
function unmappedCostCentersForCompany(company){
  return costCentersForCompany(company).filter(cc=> !CONFIG.costCenterDepartment[ccdKey(company, cc)]);
}
function unmappedCostCenters(){
  // Aggregate count across all companies — used for the sidebar badge.
  return allCompanies().reduce((sum,c)=> sum + unmappedCostCentersForCompany(c.company).length, 0);
}
async function addManualCostCenter(company, code){
  code = (code||'').trim();
  if(!code || !company) return;
  CONFIG.manualCostCenters = CONFIG.manualCostCenters || {};
  CONFIG.manualCostCenters[company] = CONFIG.manualCostCenters[company] || [];
  if(!CONFIG.manualCostCenters[company].includes(code)) CONFIG.manualCostCenters[company].push(code);
  await saveConfig();
}
// Task: cost centers can be renamed in place — updates the manual list (if it's a manually-added
// code), moves its department mapping over to the new key, and re-labels every employee record
// currently sitting on the old code so nothing silently falls back to "Unassigned".
async function renameCostCenter(company, oldCC, newCC){
  newCC = (newCC||'').trim();
  if(!company || !oldCC || !newCC) { toast('Enter a new cost center code first.'); return; }
  if(newCC === oldCC) return;
  if(costCentersForCompany(company).includes(newCC)){
    toast(`${newCC} already exists for ${company} — to merge employees into it, transfer them individually instead.`);
    return;
  }
  CONFIG.manualCostCenters = CONFIG.manualCostCenters || {};
  const manualList = CONFIG.manualCostCenters[company];
  if(manualList){
    const idx = manualList.indexOf(oldCC);
    if(idx>-1) manualList[idx] = newCC; else manualList.push(newCC);
  }
  const oldKey = ccdKey(company, oldCC), newKey = ccdKey(company, newCC);
  if(CONFIG.costCenterDepartment[oldKey]!==undefined){
    CONFIG.costCenterDepartment[newKey] = CONFIG.costCenterDepartment[oldKey];
    delete CONFIG.costCenterDepartment[oldKey];
  }
  let touched = 0;
  EMP.forEach(e=>{ if(e.company===company && (e.costCenter||'').trim()===oldCC){ e.costCenter = newCC; touched++; } });
  await saveConfig();
  if(touched) await saveEmp();
  closeModal();
  toast(`${oldCC} renamed to ${newCC}${touched?` — ${touched} employee record(s) updated`:''}.`);
  render();
}
function handleRenameCC(company, oldCC){
  const val = document.getElementById('m_renameCC').value;
  renameCostCenter(company, oldCC, val);
}
// Task: cost centers can be deleted — blocked while any active employee still sits on it, so
// deleting never silently strips an employee's cost center out from under them.
async function deleteCostCenter(company, cc){
  const inUse = EMP.filter(e=> e.company===company && (e.costCenter||'').trim()===cc && !e.dateSeparated).length;
  if(inUse){
    toast(`${inUse} active employee(s) are still on ${cc} — transfer them to a different cost center first.`);
    return;
  }
  CONFIG.manualCostCenters = CONFIG.manualCostCenters || {};
  if(CONFIG.manualCostCenters[company]) CONFIG.manualCostCenters[company] = CONFIG.manualCostCenters[company].filter(c=> c!==cc);
  delete CONFIG.costCenterDepartment[ccdKey(company, cc)];
  await saveConfig();
  toast(`${cc} deleted.`);
  render();
}
async function setPromotionBenchmark(v){
  const n = Number(v);
  CONFIG.promotionBenchmarkYears = (!isNaN(n) && n>0) ? n : DEFAULT_CONFIG.promotionBenchmarkYears;
  await saveConfig();
  render();
}

/* Job Grade grouping — ranges can differ per company & employment status (task H) */
function jobGradeGroupsFor(company, status){
  CONFIG.jobGradeGroups[company] = CONFIG.jobGradeGroups[company] || {};
  CONFIG.jobGradeGroups[company][status] = CONFIG.jobGradeGroups[company][status] || [];
  return CONFIG.jobGradeGroups[company][status];
}
function jobGradeNumeric(raw){
  if(raw===undefined || raw===null) return null;
  const m = String(raw).match(/(\d+(\.\d+)?)/);
  return m ? Number(m[1]) : null;
}
function jobGradeGroupOf(company, status, raw){
  const n = jobGradeNumeric(raw);
  if(n===null) return 'Unclassified';
  const groups = (CONFIG.jobGradeGroups[company] && CONFIG.jobGradeGroups[company][status]) || [];
  const m = bestRangeMatch(groups, n);
  return m ? m.label : 'Unclassified';
}
// The Max Tenure Stay configured on a specific Job Grade Group (Staff only — see the Job Grade
// Groups panel in the Control Panel). Returns null if unset/0, meaning that grade isn't flagged
// at all — distinct from a stored 0, which is treated the same way since a real max-stay of zero
// years isn't a meaningful policy value.
function jobGradeGroupMaxTenure(company, status, groupLabel){
  const groups = (CONFIG.jobGradeGroups[company] && CONFIG.jobGradeGroups[company][status]) || [];
  const g = groups.find(g=> g.label===groupLabel);
  return (g && g.maxTenureYears) ? Number(g.maxTenureYears) : null;
}
// This app otherwise only keeps an employee's CURRENT Job Grade — each Master List upload or
// manual edit simply overwrites it, the same way Position/Cost Center etc. do. That's fine for
// point-in-time reporting, but it means there's normally no way to tell what someone's grade WAS
// last month versus what it is now. This is a small, dedicated history log (separate from
// rosterSpans, which only tracks presence/absence, not attribute values) so month-to-month
// promotions can be detected later — see jobGradeAsOf and execPromotionRows in the Executive
// Report. Keyed by as-of month so a re-upload/correction for the same month updates its own entry
// instead of creating a duplicate.
function recordJobGradeSnapshot(emp, ms, grade){
  if(!ms || grade===undefined || grade===null || String(grade).trim()==='') return;
  emp.jobGradeHistory = Array.isArray(emp.jobGradeHistory) ? emp.jobGradeHistory : [];
  const idx = emp.jobGradeHistory.findIndex(h=> h.ms===ms);
  if(idx>=0) emp.jobGradeHistory[idx].jobGrade = grade;
  else {
    emp.jobGradeHistory.push({ms, jobGrade:grade});
    emp.jobGradeHistory.sort((a,b)=> a.ms<b.ms?-1:(a.ms>b.ms?1:0));
  }
}
// The Job Grade on file for an employee as of a given month: the latest recorded snapshot at or
// before that month, if this employee has any history logged yet. Records that predate this
// feature (no history at all) fall back to whatever Job Grade is currently on file, same as every
// other "older record" fallback elsewhere in this app — so nothing already on file goes blank.
function jobGradeAsOf(emp, ms){
  const hist = emp.jobGradeHistory;
  if(Array.isArray(hist) && hist.length){
    const eligible = hist.filter(h=> h.ms<=ms);
    return eligible.length ? eligible[eligible.length-1].jobGrade : null;
  }
  return emp.jobGrade;
}
// The most senior Job Grade Group configured for a company & status, by highest Min — used to
// tell whether a long-tenured employee has actually reached the top of their ladder or is still
// short of it (see execTenureGradeGaps in the Executive Report).
function topJobGradeGroupLabel(company, status){
  const groups = jobGradeGroupsFor(company, status);
  if(!groups.length) return null;
  return [...groups].sort((a,b)=> b.min-a.min)[0].label;
}
// The highest numeric Job Grade actually configured (across every Job Grade Group's Max) for a
// company & status. A Job Grade Group is a bucket that can span several individual grade numbers
// (e.g. a "Senior" group covering Grades 8–15) — being IN the top-labeled bucket doesn't mean an
// employee is at the numeric ceiling of it. The Promotion Benchmark flag is meant to catch
// someone overdue to move up by even a single grade (Grade N -> N+1), not just someone who hasn't
// exited their current bucket entirely, so flagging is gated on this numeric ceiling instead of
// on the bucket label — see controlPanelTenureGradeGaps/execTenureGradeGaps.
function topJobGradeNumericCeiling(company, status){
  const groups = jobGradeGroupsFor(company, status);
  if(!groups.length) return null;
  const max = Math.max(...groups.map(g=> Number(g.max)||0));
  return max || null;
}
async function updateJobGradeRange(company,status,i,field,val){
  const list = jobGradeGroupsFor(company,status);
  list[i][field] = (field==='label') ? val : Number(val);
  await saveConfig();
}
async function addJobGradeRange(company,status){
  const group = {label:'New Group', min:0, max:0};
  if(status==='Staff') group.maxTenureYears = CONFIG.promotionBenchmarkYears || DEFAULT_CONFIG.promotionBenchmarkYears;
  jobGradeGroupsFor(company,status).push(group);
  await saveConfig(); render();
}
async function removeJobGradeRange(company,status,i){
  jobGradeGroupsFor(company,status).splice(i,1);
  await saveConfig(); render();
}

/* Job Position → Job Grade Group categorization (task: Control Panel lets HR assign each observed
   Job Position to one of that company & status's configured Job Grade Groups; once set, this shows
   alongside the Position in Company Detail → Position, split by Staff / Rank & File like the rest
   of that view). */
function positionJobGradesFor(company, status){
  CONFIG.positionJobGrades[company] = CONFIG.positionJobGrades[company] || {};
  CONFIG.positionJobGrades[company][status] = CONFIG.positionJobGrades[company][status] || {};
  return CONFIG.positionJobGrades[company][status];
}
function distinctPositions(company, status){
  const set = new Set();
  EMP.filter(e=> e.company===company && e.employmentStatus===status && (e.position||'').trim())
    .forEach(e=> set.add(e.position.trim()));
  return Array.from(set).sort();
}
function positionJobGradeOf(company, status, position){
  const map = (CONFIG.positionJobGrades[company] && CONFIG.positionJobGrades[company][status]) || {};
  return map[(position||'').trim()] || '';
}
async function setPositionJobGrade(company, status, position, label){
  const map = positionJobGradesFor(company, status);
  if(label) map[position] = label; else delete map[position];
  await saveConfig();
}
// Returns the distinct Job Grade Groups currently observed among employees on file for a given
// Position within a company & employment status — derived live from each employee's own Job
// Grade via jobGradeGroupOf, not from the (possibly stale) manual positionJobGrades assignment.
function positionJobGradeGroupsObserved(company, status, position){
  const set = new Set();
  EMP.filter(e=> e.company===company && e.employmentStatus===status && (e.position||'').trim()===position)
     .forEach(e=> set.add(jobGradeGroupOf(company, status, e.jobGrade)));
  return Array.from(set);
}
// Auto-populate: for every Position on file, if every employee currently holding it lands in
// exactly one Job Grade Group (per the ranges configured above), assign that group automatically.
// If a Position's employees disagree — different Job Grades resolving to different groups — it's
// left as a discrepancy for HR to resolve manually in the table below, rather than guessed at.
async function autoAssignPositionJobGrades(company, status){
  const map = positionJobGradesFor(company, status);
  distinctPositions(company, status).forEach(p=>{
    const observed = positionJobGradeGroupsObserved(company, status, p).filter(g=> g!=='Unclassified');
    if(observed.length===1) map[p] = observed[0];
    // observed.length===0 (no gradable data yet) or >1 (conflict) — leave whatever is currently
    // set untouched; the Control Panel table flags these for manual review instead.
  });
  await saveConfig();
}
function industryOf(company){
  const f = CONFIG.industries.find(i=>i.companies.includes(company));
  return f ? f.name : '';
}
function isActiveAsOf(emp, refDate){
  const hired = parseDate(emp.dateHired);
  if(!hired || hired > refDate) return false;
  const sep = parseDate(emp.dateSeparated);
  if(sep && sep <= refDate) return false;
  return true;
}

/* ============ ROSTER MONTH SPANS — historical headcount is frozen ============ */
// Reported headcount for a month is decided by which REPORTING MONTHS a person was carried on
// the roster — never by their raw Date Hired / Date Separated. Each record keeps one or more
// spans: {start:'YYYY-MM', end:'YYYY-MM'|''}. They count toward every month from `start`
// onward, up to but NOT including `end` (the month their separation was reported) — matching
// the existing rule that a hire counts in the month it lands and a separation is already out of
// that same month's headcount.
//
// This is what makes a Master List upload non-destructive to history: an upload for month M can
// only ever open a span at M (a person joining the reported roster) or close a span at M (a
// confirmed separation). It cannot reach back and add or remove anyone from a month that was
// already reported, no matter what Date Hired / Date Separated values the file carries or how
// far back they're dated. A back-dated hire still shows up as an increase in M; a separation
// dated months ago but only reported now still shows up as the decrease in M.
//
// Multiple spans exist so a rehire opens a NEW span instead of erasing the gap they were away.
function rosterSpansOf(emp){
  if(Array.isArray(emp.rosterSpans) && emp.rosterSpans.length) return emp.rosterSpans;
  // Records that predate this field: derive a single span from the reporting months already on
  // file (hire tag month, separation tag month), falling back to the real dates — so nothing
  // already reported shifts when this rolls out.
  const hd = parseDate(emp.dateHired);
  const start = emp.hireTagMonth || (hd ? monthStr(hd) : '');
  if(!start) return [];
  return [{start, end: separationTagMonthOf(emp) || ''}];
}
function isOnRosterInMonth(emp, ms){
  return rosterSpansOf(emp).some(sp=> sp.start && sp.start<=ms && (!sp.end || ms < sp.end));
}
// Drop-in replacement for isActiveAsOf wherever a *reported headcount* is being counted. (The
// retention/attrition denominators deliberately keep using isActiveAsOf — they have to line up
// with isSeparatedInReal, which is real-date based.)
function isOnRosterAsOf(emp, refDate){ return isOnRosterInMonth(emp, monthStr(refDate)); }
// Puts someone on the reported roster starting at month `ms` — used when a Master List (or a
// manual add/import) first brings them in, and when a separated person is rehired.
function openRosterSpan(emp, ms){
  if(!ms) return;
  const spans = rosterSpansOf(emp).map(sp=>({...sp}));
  const last = spans[spans.length-1];
  if(last && !last.end){
    // Already on the roster — leave their original entry month alone, never push it later.
    if(ms < last.start) last.start = ms;
  } else if(last && last.end && ms <= last.end){
    last.end = ''; // reversing a separation that hasn't been reported past this month yet
  } else {
    spans.push({start:ms, end:''});
  }
  emp.rosterSpans = spans;
}
// Takes someone off the reported roster from month `ms` onward. Every earlier month keeps them.
function closeRosterSpan(emp, ms){
  if(!ms) return;
  const spans = rosterSpansOf(emp).map(sp=>({...sp}));
  const last = spans[spans.length-1];
  if(!last){ spans.push({start:ms, end:ms}); }
  else last.end = (ms < last.start) ? last.start : ms;
  emp.rosterSpans = spans;
}
// Used by the manual edit modal and the New Hire & Separated import, where HR can change the
// hire/separation reporting months on a record directly: rebuild the latest span from those.
function syncRosterSpanFromRecord(emp){
  const spans = rosterSpansOf(emp).map(sp=>({...sp}));
  const start = hireTagMonthOf(emp) || '';
  const end = emp.dateSeparated ? (separationTagMonthOf(emp) || '') : '';
  if(!spans.length){ if(start) emp.rosterSpans = [{start, end}]; return; }
  const last = spans[spans.length-1];
  if(start && spans.length===1) last.start = start;
  last.end = end && end >= last.start ? end : (end ? last.start : '');
  emp.rosterSpans = spans;
}
// Mirrors separationTagMonth: the employee's actual Date Hired is kept exactly as recorded, but
// which MONTH a hire counts toward in reports (Overview, Company Detail, Archive, trends, cost
// per hire) is driven by hireTagMonth — the month the hire was tagged/uploaded into the system
// (Master List as-of-month, the moment of a New Hire & Separated Import, or a Quick Add) — not
// necessarily whatever month the Date Hired value itself falls in. Older records that predate
// this field fall back to deriving a month from the recorded date, so nothing already on file
// disappears from historical reports.
function hireTagMonthOf(emp){
  if(emp.hireTagMonth) return emp.hireTagMonth;
  const d = parseDate(emp.dateHired);
  return d ? monthStr(d) : null;
}
function hireTagDate(emp){
  const ms = hireTagMonthOf(emp);
  if(!ms) return null;
  const [y,m] = ms.split('-').map(Number);
  return new Date(y, m-1, 15);
}
function isHiredIn(emp, start, end){
  if(emp.excludeFromHireCount) return false;
  // Intern/OJT is a fixed-term arrangement tracked separately from directly-employed hires — it
  // never populates the standard "New Hire" counts/lists (Overview, Company Detail, Recruitment
  // Cost, trends). It's still viewable in the Archive by filtering Employment Status to
  // Intern/OJT specifically.
  if(STATUS_KEY(emp.employmentStatus)==='intern') return false;
  const h = hireTagDate(emp);
  return h && h>=start && h<=end;
}
// The employee's actual Date Separated is never changed by any of this — it's kept exactly as
// recorded. But which MONTH a separation counts toward in reports (Overview, Company Detail,
// Archive, trends) is driven by separationTagMonth: the month the separation was tagged/uploaded
// into the system, not necessarily the month the separation date itself falls in. Older records
// that predate this field fall back to deriving a month from the recorded date, so nothing
// already on file disappears from historical reports.
function separationTagMonthOf(emp){
  if(emp.separationTagMonth) return emp.separationTagMonth;
  const d = parseDate(emp.dateSeparated);
  return d ? monthStr(d) : null;
}
function separationTagDate(emp){
  const ms = separationTagMonthOf(emp);
  if(!ms) return null;
  const [y,m] = ms.split('-').map(Number);
  return new Date(y, m-1, 15); // mid-month marker — only used for month/year range comparisons
}
function isSeparatedIn(emp, start, end){
  // Same rule as isHiredIn: Intern/OJT separations are tracked separately from the directly-
  // employed "Separated" counts/lists by default.
  if(STATUS_KEY(emp.employmentStatus)==='intern') return false;
  const s = separationTagDate(emp);
  return s && s>=start && s<=end;
}
// Retention/Attrition math needs to line up with the (real-date-based) active baseline it's
// dividing against — using the tag-month version there could count someone as a departure in a
// period whose baseline never included them (e.g. they really left earlier, but the separation
// was only tagged/uploaded later), producing a nonsensical rate. So rates always use the actual
// Date Separated; only movement lists/counts (Overview cards, Archive, Company Detail's
// "Separated" tab) use the tag month.
function isSeparatedInReal(emp, start, end){
  const s = parseDate(emp.dateSeparated);
  return s && s>=start && s<=end;
}
// Mirrors isSeparatedInReal, but for Date Hired — used to build the New Hire cohort for the
// New Hire Retention & Attrition metric (task C), which needs the actual hire date rather than
// the hire tag month so the cohort itself is stable regardless of when it was uploaded/tagged.
function isHiredInReal(emp, start, end){
  if(emp.excludeFromHireCount) return false;
  if(STATUS_KEY(emp.employmentStatus)==='intern') return false;
  const h = parseDate(emp.dateHired);
  return h && h>=start && h<=end;
}
function tenureYears(emp, refDate){
  const h = parseDate(emp.dateHired);
  if(!h) return null;
  return (refDate - h) / (365.25*24*3600*1000);
}
// How long someone had been employed by the time they actually left — uses the real Date Hired
// and Date Separated (not tag months), since this is a factual duration, grouped with the same
// Tenure Groups configured in Control Panel (task A).
function tenureAtSeparation(emp){
  const h = parseDate(emp.dateHired);
  const s = parseDate(emp.dateSeparated);
  if(!h || !s) return null;
  return (s - h) / (365.25*24*3600*1000);
}
// Matches a value against a set of {label,min,max} range groups. Uses each group's Min as a
// threshold rather than also requiring the value to fall under its Max: if there's ever a small
// gap between one group's Max and the next group's Min — easy to end up with in Control Panel,
// since the Min/Max pickers there snap to rounded, data-driven values rather than allowing exact
// arbitrary boundaries — a real value that lands in that gap would otherwise show as
// "Unclassified" even though it's perfectly valid. Ranking by Min guarantees every value at or
// above the lowest configured Min lands in the group with the highest Min it still clears, so
// nothing falls through the cracks as long as the underlying value itself exists.
function bestRangeMatch(groups, value){
  if(value===null || value===undefined || value==='' || isNaN(value)) return null;
  if(!groups || !groups.length) return null;
  const sorted = [...groups].sort((a,b)=> a.min-b.min);
  let match = null;
  for(const g of sorted){ if(value>=g.min) match = g; else break; }
  return match;
}
// Age is now derived from Date of Birth rather than uploaded as a static number, so it's always
// accurate as of whatever reference date is asked for (e.g. "now" for the live roster, or a
// period's end date for a historical Company Detail view) instead of drifting out of date the
// moment it's uploaded. Returns whole completed years, like a normal stated age.
function ageYears(emp, refDate){
  const b = parseDate(emp.birthdate);
  if(!b) return null;
  let years = refDate.getFullYear() - b.getFullYear();
  const beforeBirthdayThisYear = (refDate.getMonth() < b.getMonth()) || (refDate.getMonth()===b.getMonth() && refDate.getDate() < b.getDate());
  if(beforeBirthdayThisYear) years--;
  return years>=0 ? years : null;
}
function ageGroupOf(age){
  const m = bestRangeMatch(CONFIG.ageGroups, age);
  return m ? m.label : 'Unclassified';
}
function tenureGroupOf(yrs){
  const m = bestRangeMatch(CONFIG.tenureGroups, yrs);
  return m ? m.label : 'Unclassified';
}
function statusLabel(s){ return s || 'Unclassified'; }

function companyStatsCore(company, start, end, opts){
  opts = opts || {};
  // Reported headcount for this month = who was carried on the roster in this month (see
  // rosterSpansOf). Uploading a later Master List can never change what this returns for an
  // earlier month.
  const active = EMP.filter(e=> e.company===company && isOnRosterAsOf(e,end));
  const hired = EMP.filter(e=> e.company===company && isHiredIn(e,start,end));
  const separated = EMP.filter(e=> e.company===company && isSeparatedIn(e,start,end));
  // Used only for retention/attrition math (task D) — see isSeparatedInReal for why this has to
  // be date-based rather than tag-month-based.
  const separatedForRates = EMP.filter(e=> e.company===company && isSeparatedInReal(e,start,end));
  const byStatus = {staff:0, rankfile:0, intern:0};
  active.forEach(e=> byStatus[STATUS_KEY(e.employmentStatus)]++ );

  // Baseline used as the denominator for retention/attrition:
  // - period views (monthly/annual): who was already active right before the period started
  // - all-time view: everyone the company has ever recorded (active or separated)
  const baseSet = opts.allTime
    ? EMP.filter(e=> e.company===company)
    : EMP.filter(e=> e.company===company && isActiveAsOf(e, opts.baselineDate));

  // Task E: retention/attrition is only a meaningful concept for Staff and Rank & File —
  // Intern/OJT (and any other custom category) is excluded from these calculations entirely,
  // not just hidden from the breakdown table.
  const RATE_STATUSES = ['staff','rankfile'];
  const baseSetForRates = baseSet.filter(e=> RATE_STATUSES.includes(STATUS_KEY(e.employmentStatus)));
  const separatedForRatesEligible = separatedForRates.filter(e=> RATE_STATUSES.includes(STATUS_KEY(e.employmentStatus)));

  const base = baseSetForRates.length || 1;
  const attrition = separatedForRatesEligible.length / base * 100;
  const byStatusStart = {staff:0, rankfile:0};
  baseSetForRates.forEach(e=> byStatusStart[STATUS_KEY(e.employmentStatus)]++ );
  const separatedByStatus = {staff:0, rankfile:0};
  separatedForRatesEligible.forEach(e=> separatedByStatus[STATUS_KEY(e.employmentStatus)]++ );
  const statusRates = {};
  RATE_STATUSES.forEach(k=>{
    const statusBase = byStatusStart[k];
    const statusAttr = statusBase ? (separatedByStatus[k]/statusBase*100) : 0;
    statusRates[k] = {
      attritionRate: statusBase ? statusAttr : 0,
      retentionRate: statusBase ? (100-statusAttr) : 100,
      baseCount: statusBase,
      separatedCount: separatedByStatus[k],
      activeCount: byStatus[k]
    };
  });
  return {
    active, hired, separated, byStatus,
    total: active.length,
    attritionRate: baseSetForRates.length ? attrition : 0,
    retentionRate: baseSetForRates.length ? (100-attrition) : 100,
    baseCount: baseSetForRates.length,
    statusRates
  };
}
function companyStats(company, ms){
  const {start,end} = monthBounds(ms);
  return companyStatsCore(company, start, end, {baselineDate: new Date(start.getTime()-1)});
}
// Per-EXACT-employment-status stats for a company & month — used by Trend & Insight's Headcount
// Demographic table to break Headcount/Hired/Separated/Attrition/Retention out per real status
// name as configured in Control Panel, rather than folding every non-Staff/non-Intern status into
// one blended "Rank & File" bucket. Attrition/Retention keeps the same rule as everywhere else in
// this app (Task E): not tracked for Intern/OJT.
function companyStatusStats(company, statusName, ms){
  const {start,end} = monthBounds(ms);
  const prevEnd = new Date(start.getTime()-1);
  const inScope = e=> e.company===company && e.employmentStatus===statusName;
  const active = EMP.filter(e=> inScope(e) && isOnRosterAsOf(e,end));
  const hired = EMP.filter(e=> inScope(e) && isHiredIn(e,start,end));
  const separated = EMP.filter(e=> inScope(e) && isSeparatedIn(e,start,end));
  const separatedForRates = EMP.filter(e=> inScope(e) && isSeparatedInReal(e,start,end));
  const baseSet = EMP.filter(e=> inScope(e) && isActiveAsOf(e, prevEnd));
  const rateEligible = STATUS_KEY(statusName) !== 'intern';
  const base = baseSet.length || 1;
  const attrition = rateEligible ? (separatedForRates.length/base*100) : 0;
  return {
    active: active.length, hired: hired.length, separated: separated.length,
    baseCount: baseSet.length, rateEligible,
    attritionRate: (rateEligible && baseSet.length) ? attrition : 0,
    retentionRate: (rateEligible && baseSet.length) ? (100-attrition) : 100
  };
}
function companyStatsAnnual(company, year){
  const start = new Date(year,0,1);
  const end = new Date(year,11,31,23,59,59);
  return companyStatsCore(company, start, end, {baselineDate: new Date(start.getTime()-1)});
}
function companyStatsToDate(company){
  const start = new Date(2000,0,1);
  const end = new Date();
  return companyStatsCore(company, start, end, {allTime:true});
}

// Task A (Company Detail): a dedicated month-by-month + annual breakdown of Retention/Attrition
// for the selected year, shown alongside (not instead of) the period-selector-driven Overall
// figures above — so HR can see each month's own rate side by side with the full-year rate,
// rather than having to flip the Monthly/Annual tabs one at a time. Staff & Rank &
// File only, same eligibility rule as companyStatsCore.
function monthlyRetentionAttritionTable(company, year, showHint){
  const rows = MONTH_NAMES.map((name,i)=>{
    const ms = `${year}-${String(i+1).padStart(2,'0')}`;
    const s = companyStats(company, ms);
    return {label: name.slice(0,3), s};
  });
  const annual = companyStatsAnnual(company, year);
  // Each period's rate is shown three ways: Staff alone, Rank & File alone, and the two blended.
  // statusRates already carries a per-status base/separated/rate computed off the same baseline,
  // so the split needs no separate pass — Staff and Rank & File simply use their own denominators.
  const cells = s=>{
    const sr = s.statusRates || {};
    const seg = k=>{
      const r = sr[k];
      return r && r.baseCount
        ? `<td>${r.retentionRate.toFixed(1)}%</td><td>${r.attritionRate.toFixed(1)}%</td>`
        : `<td class="n">—</td><td class="n">—</td>`;
    };
    return `${seg('staff')}${seg('rankfile')}<td>${s.baseCount? s.retentionRate.toFixed(1):'100.0'}%</td><td>${s.baseCount? s.attritionRate.toFixed(1):'0.0'}%</td>`;
  };
  const rowsHtml = rows.map(r=>`<tr><td class="rowlabel">${r.label}</td>${cells(r.s)}</tr>`).join('');
  return `
  <table class="demo">
    <thead>
      <tr><th class="rowlabel" rowspan="2">Month</th><th colspan="2">Staff</th><th colspan="2">Rank &amp; File</th><th colspan="2">Combined</th></tr>
      <tr><th>Ret.</th><th>Attr.</th><th>Ret.</th><th>Attr.</th><th>Ret.</th><th>Attr.</th></tr>
    </thead>
    <tbody>
      ${rowsHtml}
      <tr class="total"><td class="rowlabel">Annual (${year})</td>${cells(annual)}</tr>
    </tbody>
  </table>
  ${showHint===false ? '' : `<p class="hint">Each month's Retention/Attrition Rate uses that month alone as its own period (baseline = who was already active right before that month began). The <b>Annual</b> row is the blended full-year figure — the two won't simply average together since each month has its own base headcount.</p>`}`;
}

// Task C: New Hire Retention & Attrition — a separate metric from the overall company-wide
// Retention/Attrition above. Overall attrition asks "of everyone already on the roster, what
// share left this period?" New Hire attrition instead asks "of the people hired IN a given year
// (the cohort), what share of THAT cohort has since separated?" — a first-year/cohort survival
// read rather than a whole-roster rate, so it's tracked with its own base, count and rate and
// never blended into companyStatsCore's numbers. Always computed annually (by calendar year),
// Staff & Rank and File only — same eligibility rule as the overall rates — using real Date
// Hired/Date Separated (not tag months), since this is a factual cohort-survival calculation.
function newHireStatsAnnual(company, year, statusFilter, exact){
  const yearStart = new Date(year,0,1);
  const yearEnd = new Date(year,11,31,23,59,59);
  // statusFilter narrows the cohort to a single employment status so the same cohort logic can
  // be reported split as well as combined; omitted = both (Staff & Rank & File), as before.
  // When `exact` is true, statusFilter is matched against the real configured status name
  // (e.g. a custom status) instead of the reduced staff/rankfile bucket.
  const matchStatus = e=>{
    if(exact) return e.employmentStatus === statusFilter;
    const RATE_STATUSES = statusFilter ? [statusFilter] : ['staff','rankfile'];
    return RATE_STATUSES.includes(STATUS_KEY(e.employmentStatus));
  };
  const cohort = EMP.filter(e=> e.company===company && matchStatus(e) && isHiredInReal(e, yearStart, yearEnd));
  const now = new Date();
  const separatedFromCohort = cohort.filter(e=>{
    const s = parseDate(e.dateSeparated);
    return s && s<=now; // left at any point since being hired, up to today
  });
  const base = cohort.length || 1;
  const attritionRate = separatedFromCohort.length / base * 100;
  return {
    year,
    cohortCount: cohort.length,
    separatedCount: separatedFromCohort.length,
    retainedCount: cohort.length - separatedFromCohort.length,
    attritionRate: cohort.length ? attritionRate : 0,
    retentionRate: cohort.length ? (100-attritionRate) : 100
  };
}

// Org-wide mirror of companyStatsCore — identical logic, minus the per-company filter — so the
// Forecast page can show an "All Companies" scope using the exact same
// baseline/eligibility rules (Staff &amp; Rank &amp; File only) as every per-company figure elsewhere.
function orgStatsCore(start, end, opts){
  opts = opts || {};
  const active = EMP.filter(e=> isOnRosterAsOf(e,end));
  const hired = EMP.filter(e=> isHiredIn(e,start,end));
  const separated = EMP.filter(e=> isSeparatedIn(e,start,end));
  const separatedForRates = EMP.filter(e=> isSeparatedInReal(e,start,end));
  const baseSet = opts.allTime ? EMP.slice() : EMP.filter(e=> isActiveAsOf(e, opts.baselineDate));
  const RATE_STATUSES = ['staff','rankfile'];
  const baseSetForRates = baseSet.filter(e=> RATE_STATUSES.includes(STATUS_KEY(e.employmentStatus)));
  const separatedForRatesEligible = separatedForRates.filter(e=> RATE_STATUSES.includes(STATUS_KEY(e.employmentStatus)));
  const base = baseSetForRates.length || 1;
  const attrition = separatedForRatesEligible.length / base * 100;
  return {
    active, hired, separated,
    total: active.length,
    attritionRate: baseSetForRates.length ? attrition : 0,
    retentionRate: baseSetForRates.length ? (100-attrition) : 100,
    baseCount: baseSetForRates.length
  };
}
function orgStats(ms){
  const {start,end} = monthBounds(ms);
  return orgStatsCore(start, end, {baselineDate: new Date(start.getTime()-1)});
}

// Companion to newHireStatsAnnual — the OTHER half of the same annual split. New Hire tracks
// the cohort hired IN the year; this tracks everyone who was already ON THE ROSTER before the
// year began (i.e. NOT part of that year's new-hire cohort) and asks what share of THAT
// pre-existing population separated during the year. Together the two cohorts partition the
// year's movement into "people who left shortly after joining" vs "people who left after
// already being established" — a distinction the single blended Overall Attrition/Retention
// figure doesn't surface. Kept as its own base/count/rate, Staff & Rank & File only, using real
// dates (not tag months), same as New Hire.
function existingEmployeeStatsAnnual(company, year, statusFilter, exact){
  const yearStart = new Date(year,0,1);
  const yearEnd = new Date(year,11,31,23,59,59);
  const matchStatus = e=>{
    if(exact) return e.employmentStatus === statusFilter;
    const RATE_STATUSES = statusFilter ? [statusFilter] : ['staff','rankfile'];
    return RATE_STATUSES.includes(STATUS_KEY(e.employmentStatus));
  };
  const existing = EMP.filter(e=> e.company===company && matchStatus(e) && isActiveAsOf(e, new Date(yearStart.getTime()-1)));
  const separatedFromExisting = existing.filter(e=> isSeparatedInReal(e, yearStart, yearEnd));
  const base = existing.length || 1;
  const attritionRate = separatedFromExisting.length / base * 100;
  return {
    year,
    baseCount: existing.length,
    separatedCount: separatedFromExisting.length,
    retainedCount: existing.length - separatedFromExisting.length,
    attritionRate: existing.length ? attritionRate : 0,
    retentionRate: existing.length ? (100-attritionRate) : 100
  };
}


/* ============ CHART HELPERS (Trend & Insight) ============ */
// Task A: the Headcount Trend chart used to always show a fixed last-6-months window, even for
// a company that only just had its first Master List upload — padding the chart with meaningless
// months before any data existed. These resolve the real starting point per company (or the
// earliest across all companies, for the org-wide view) so the trend only ever shows months from
// real data onward.
function companyBaselineMonth(company){
  return (CONFIG.companyBaselineMonth && CONFIG.companyBaselineMonth[company]) || null;
}
function orgBaselineMonth(){
  const vals = Object.values(CONFIG.companyBaselineMonth || {});
  return vals.length ? vals.sort()[0] : null;
}
// Annual view: the trend runs across the selected year — January through the reporting month
// currently selected — instead of a rolling six-month window. Months before a scope's first
// Master List baseline are still trimmed off, so a company that started mid-year begins at its
// real first month rather than at an empty January.
// Always spans the full calendar year — January through December of the selected year — so the
// line chart and both movement bar graphs share one fixed 12-month frame. Months with no
// reported data yet (before a scope's first Master List baseline, or later than the reporting
// month currently selected) are emitted as placeholders: they keep their slot and label on every
// graph but carry no value, so nothing is invented for a month that hasn't been reported.
function orgTrend(company){
  const [y,m] = ui.month.split('-').map(Number);
  const inScope = e=> !company || e.company===company;
  // A scope only has a baseline recorded if its first Master List went through this app. When
  // it's missing, fall back to the earliest reporting month actually on file for that scope —
  // otherwise every month before real data existed reads as a legitimate headcount of 0.
  let baseline = company ? companyBaselineMonth(company) : orgBaselineMonth();
  if(!baseline){
    let earliest = '';
    EMP.forEach(e=>{
      if(!inScope(e)) return;
      const cands = [];
      if(Array.isArray(e.rosterSpans)) e.rosterSpans.forEach(sp=>{ if(sp.start) cands.push(sp.start); });
      if(e.hireTagMonth) cands.push(e.hireTagMonth);
      cands.forEach(ms=>{ if(!earliest || ms < earliest) earliest = ms; });
    });
    baseline = earliest || null;
  }
  let startMonth = 1; // January of the selected year
  let hasYear = true;
  if(baseline){
    const [by,bm] = baseline.split('-').map(Number);
    if(by > y) hasYear = false;         // scope has no data at all in this year yet
    else if(by === y) startMonth = Math.max(1, bm);
  }
  let out=[];
  for(let mm=1; mm<=12; mm++){
    const d = new Date(y, mm-1, 1);
    const ms = monthStr(d);
    const label = d.toLocaleString('en-US',{month:'short'});
    const reported = hasYear && mm>=startMonth && mm<=m;
    if(!reported){ out.push({ms, label, reported:false, headcount:null, hired:null, separated:null}); continue; }
    const {start,end} = monthBounds(ms);
    out.push({
      ms, label, reported:true,
      headcount: EMP.filter(e=> inScope(e) && isOnRosterAsOf(e,end)).length,
      hired: EMP.filter(e=> inScope(e) && isHiredIn(e,start,end)).length,
      separated: EMP.filter(e=> inScope(e) && isSeparatedIn(e,start,end)).length
    });
  }
  return out;
}

function compositionDonut(byStatus, total){

    ? `conic-gradient(var(--blue) 0% ${p1}%, var(--teal) ${p1}% ${p2}%, var(--violet) ${p2}% 100%)`

      <div><span class="sw" style="background:var(--teal);"></span>Rank &amp; File — <b>${byStatus.rankfile}</b> <span style="color:var(--dim);">(${rankPct.toFixed(0)}%)</span></div>
      <div><span class="sw" style="background:var(--violet);"></span>Intern/OJT — <b>${byStatus.intern}</b> <span style="color:var(--dim);">(${internPct.toFixed(0)}%)</span></div>
    </div>

function trendLineChart(data){
  const pts = data.filter(d=> d.reported!==false && d.headcount!==null);
  if(!pts.length) return '<div class="empty">No reported months yet for this year — upload a Master List to start the trend.</div>';
  const w=620, h=170, padL=34, padR=16, padT=22, padB=26;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const vals = pts.map(d=>d.headcount);
  const maxV = Math.max(...vals), minV = Math.min(...vals);
  const range = Math.max(1, maxV-minV);
  // The x axis is always the 12 months of the year, so a partial year keeps its true shape
  // instead of stretching a few months across the full width.
  const stepX = data.length>1 ? plotW/(data.length-1) : 0;
  const xFor = i => padL + i*stepX;
  const yFor = v => padT + plotH - ((v-minV)/range)*plotH;
  const idx = data.map((d,i)=>({d,i})).filter(o=> o.d.reported!==false && o.d.headcount!==null);
  const linePts = idx.map(o=>`${xFor(o.i)},${yFor(o.d.headcount)}`).join(' ');
  const areaPts = linePts + ` ${xFor(idx[idx.length-1].i)},${padT+plotH} ${xFor(idx[0].i)},${padT+plotH}`;
  const dots = idx.map(o=>`<circle cx="${xFor(o.i)}" cy="${yFor(o.d.headcount)}" r="3.6" style="fill:var(--gold);"/>`).join('');
  const values = idx.map(o=>`<text x="${xFor(o.i)}" y="${yFor(o.d.headcount)-11}" text-anchor="middle" style="font-size:11px;fill:var(--text);font-family:var(--mono);">${o.d.headcount}</text>`).join('');
  const labels = data.map((d,i)=>`<text x="${xFor(i)}" y="${h-8}" text-anchor="middle" style="font-size:10px;fill:var(--${d.reported===false?'dim2':'dim'});font-family:var(--mono);">${d.label}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
    <line x1="${padL}" y1="${padT+plotH}" x2="${w-padR}" y2="${padT+plotH}" style="stroke:var(--border);stroke-width:1;"/>
    <polygon points="${areaPts}" style="fill:var(--gold);fill-opacity:0.08;stroke:none;"/>
    <polyline points="${linePts}" style="fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;"/>
    ${dots}${values}${labels}
  </svg>`;
}

function movementBars(data, key, color){
  if(!data.length) return '<div class="empty">No months reported yet.</div>';
  const max = Math.max(1, ...data.map(d=> d[key] || 0));
  return `
  <div class="bar-mini">${data.map(d=>`<div class="b" style="height:46px;"><div class="fill" style="height:${d.reported===false?0:(d[key]/max*100)}%;background:${color};"></div></div>`).join('')}</div>
  <div class="bar-mini" style="height:auto;">${data.map(d=>`<div class="lbl" style="${d.reported===false?'opacity:0.45;':''}">${d.label}<br>${d.reported===false?'–':d[key]}</div>`).join('')}</div>`;
}

/* Generic breakdown chart (task G) — a colored horizontal bar per category showing count and %.
   Used for Gender/Age/Tenure on Trend & Insight so those read as graphs, not tables. */
const BREAKDOWN_PALETTE = ['var(--blue)','var(--teal)','var(--violet)','var(--gold)','var(--green)','var(--red)','var(--gold-dim)','var(--dim2)'];
function breakdownBarChart(list, keyFn, order){
  const groups = {};
  list.forEach(e=>{
    const k = keyFn(e) || 'Unassigned';
    groups[k] = (groups[k]||0) + 1;
  });
  let keys = order ? order.filter(k=>groups[k]) : Object.keys(groups).sort();
  Object.keys(groups).forEach(k=>{ if(!keys.includes(k)) keys.push(k); });
  const total = list.length;
  if(!keys.length) return '<div class="empty">No active employees in this scope.</div>';
  return keys.map((k,i)=>{
    const n = groups[k]||0;
    const pct = total ? (n/total*100) : 0;
    const color = BREAKDOWN_PALETTE[i % BREAKDOWN_PALETTE.length];
    return `
    <div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>${k}</span><span style="font-family:var(--mono);color:var(--dim);">${n} · ${pct.toFixed(0)}%</span></div>
      <div style="height:11px;border-radius:4px;background:var(--surface2);overflow:hidden;"><div style="height:100%;width:${pct}%;background:${color};border-radius:4px;"></div></div>
    </div>`;
  }).join('');
}

/* ============ FORECAST & TRENDS ============
   Task B: a dedicated analysis + projection page, separate from Trend & Insight (which is a
   point-in-time snapshot) and Company Detail (which is a drill-down). This pulls a trailing
   window of real monthly history — org-wide or for one company — and projects it forward with
   a simple linear (least-squares) trend per metric. It's intentionally a straightforward trend
   line, not a predictive model with seasonality/external factors — the UI says so — but it gives
   HR a fast, defensible "where is this headed if nothing changes" read. */

// How many trailing months of real history are available for a given scope, capped at 12, so
// the page never pads a chart with pre-data months (same guard rail as orgTrend on Trend & Insight).
function forecastHistoryMonths(company){
  const [y,m] = ui.month.split('-').map(Number);
  const baseline = company ? companyBaselineMonth(company) : orgBaselineMonth();
  let maxBack = 11;
  if(baseline){
    const [by,bm] = baseline.split('-').map(Number);
    const monthsSinceBaseline = (y-by)*12 + (m-bm);
    maxBack = Math.max(0, Math.min(11, monthsSinceBaseline));
  }
  return maxBack+1;
}

function forecastHistory(company, monthsBack){
  const [y,m] = ui.month.split('-').map(Number);
  let out=[];
  for(let i=monthsBack-1;i>=0;i--){
    const d = new Date(y, m-1-i, 1);
    const ms = monthStr(d);
    const s = company ? companyStats(company, ms) : orgStats(ms);
    out.push({
      ms, label: d.toLocaleString('en-US',{month:'short'})+" '"+String(d.getFullYear()).slice(2),
      headcount: s.total, hired: s.hired.length, separated: s.separated.length,
      retention: s.retentionRate, attrition: s.attritionRate
    });
  }
  return out;
}

function futureMonthLabels(count){
  const [y,m] = ui.month.split('-').map(Number);
  let out=[];
  for(let i=1;i<=count;i++){
    const d = new Date(y, m-1+i, 1);
    out.push(d.toLocaleString('en-US',{month:'short'})+" '"+String(d.getFullYear()).slice(2));
  }
  return out;
}

// Simple least-squares linear regression over evenly-spaced points, projected `stepsForward`
// points beyond the given series. Returns the slope (for trend direction) plus the projected values.
function linearForecast(values, stepsForward){
  const n = values.length;
  if(n===0) return {slope:0, intercept:0, values: Array(stepsForward).fill(0)};
  if(n===1) return {slope:0, intercept:values[0], values: Array(stepsForward).fill(values[0])};
  const xs = values.map((_,i)=>i);
  const meanX = xs.reduce((a,b)=>a+b,0)/n;
  const meanY = values.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-meanX)*(values[i]-meanY); den += (xs[i]-meanX)**2; }
  const slope = den ? num/den : 0;
  const intercept = meanY - slope*meanX;
  let out=[];
  for(let i=0;i<stepsForward;i++){ out.push(slope*(n+i)+intercept); }
  return {slope, intercept, values: out};
}

function trendDirectionLabel(slope, threshold){
  threshold = threshold==null ? 0.15 : threshold;
  if(slope>threshold) return {word:'rising', color:'var(--red)'};
  if(slope<-threshold) return {word:'declining', color:'var(--green)'};
  return {word:'stable', color:'var(--dim)'};
}

// Renders one metric as a historical (solid) + forecast (dashed) line chart in a single SVG,
// sharing one y-axis scale across both segments so the transition reads as one continuous line.
// Evenly-spaced label indices (always including the first and last point) so a 24-, 36-, or
// 60-month chart never renders overlapping text — used for both the history and forecast
// segments of forecastLineChart.
function thinnedLabelIndices(len, maxLabels){
  maxLabels = maxLabels || 6;
  if(len<=0) return [];
  if(len<=maxLabels) return Array.from({length:len},(_,i)=>i);
  const step = (len-1)/(maxLabels-1);
  const idxs = new Set();
  for(let i=0;i<maxLabels;i++) idxs.add(Math.round(i*step));
  return Array.from(idxs).sort((a,b)=>a-b);
}

function forecastLineChart(historyVals, historyLabels, forecastVals, forecastLabels, opts){
  opts = opts || {};
  const w=640, h=190, padL=40, padR=16, padT=22, padB=26;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const allVals = historyVals.concat(forecastVals);
  const maxV = Math.max(...allVals);
  const minV = opts.allowNegative ? Math.min(...allVals) : Math.min(0, ...allVals);
  const range = Math.max(1, maxV-minV);
  const n = historyVals.length, total = n+forecastVals.length;
  const stepX = total>1 ? plotW/(total-1) : 0;
  const xFor = i => padL + i*stepX;
  const yFor = v => padT + plotH - ((v-minV)/range)*plotH;
  const fmt = v => opts.suffix ? v.toFixed(1)+opts.suffix : Math.round(v);
  const histPts = historyVals.map((v,i)=>`${xFor(i)},${yFor(v)}`).join(' ');
  const forePts = [`${xFor(n-1)},${yFor(historyVals[n-1])}`].concat(forecastVals.map((v,i)=>`${xFor(n+i)},${yFor(v)}`)).join(' ');
  const histDots = historyVals.map((v,i)=>`<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3.2" style="fill:var(--gold);"/>`).join('');
  const foreDots = forecastVals.map((v,i)=>`<circle cx="${xFor(n+i)}" cy="${yFor(v)}" r="3.2" style="fill:var(--blue);"/>`).join('');
  const histLabelsSvg = thinnedLabelIndices(historyLabels.length,6).map(i=>`<text x="${xFor(i)}" y="${h-8}" text-anchor="middle" style="font-size:9.5px;fill:var(--dim);font-family:var(--mono);">${historyLabels[i]}</text>`).join('');
  const foreLabelsSvg = thinnedLabelIndices(forecastLabels.length,6).map(i=>`<text x="${xFor(n+i)}" y="${h-8}" text-anchor="middle" style="font-size:9.5px;fill:var(--blue);font-family:var(--mono);">${forecastLabels[i]}</text>`).join('');
  const lastHistVal = `<text x="${xFor(n-1)}" y="${yFor(historyVals[n-1])-10}" text-anchor="middle" style="font-size:10.5px;fill:var(--text);font-family:var(--mono);">${fmt(historyVals[n-1])}</text>`;
  const lastForeVal = forecastVals.length ? `<text x="${xFor(total-1)}" y="${yFor(forecastVals[forecastVals.length-1])-10}" text-anchor="middle" style="font-size:10.5px;fill:var(--blue);font-family:var(--mono);">${fmt(forecastVals[forecastVals.length-1])}</text>` : '';
  const dividerX = xFor(n-1);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
    <line x1="${padL}" y1="${padT+plotH}" x2="${w-padR}" y2="${padT+plotH}" style="stroke:var(--border);stroke-width:1;"/>
    ${forecastVals.length ? `<line x1="${dividerX}" y1="${padT}" x2="${dividerX}" y2="${padT+plotH}" style="stroke:var(--border);stroke-width:1;stroke-dasharray:2,3;"/>` : ''}
    <polyline points="${histPts}" style="fill:none;stroke:var(--gold);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;"/>
    ${forecastVals.length ? `<polyline points="${forePts}" style="fill:none;stroke:var(--blue);stroke-width:2.4;stroke-dasharray:5,4;stroke-linejoin:round;stroke-linecap:round;"/>` : ''}
    ${histDots}${foreDots}${lastHistVal}${lastForeVal}${histLabelsSvg}${foreLabelsSvg}
  </svg>`;
}

function horizonLabelText(h){
  if(h%12===0) return (h/12)+' Year'+(h>12?'s':'');
  return h+' Months';
}

// "Next following years" outlook — pulls out the projected value at each 12-month mark within
// the selected horizon (Year 1, Year 2, Year 3…) so a multi-year horizon reads as a clear
// year-by-year table rather than forcing someone to parse a 24-, 36-, or 60-point line chart.
// For a sub-year horizon (6 months), it falls back to a single row at the end of the horizon.
function yearMarksWithin(horizon){
  let marks = [];
  for(let m=12; m<=horizon; m+=12) marks.push(m);
  if(!marks.length) marks.push(horizon);
  return marks;
}

/* ============ DRIVER ANALYSIS & SUGGESTIONS (Forecast) ============
   The projection itself is a straight line and deliberately says nothing about *why* it points
   where it does. This reads the same records the projection is built from and pulls out the
   factors actually moving the number — which reasons people leave for, how early they leave,
   where in the org the losses concentrate, whether hiring is keeping pace, and how much of the
   roster is close to retirement — then turns each into something actionable.

   Every figure below is measured from the data on file for the same scope and window as the
   chart. Nothing is inferred from outside the system, and no suggestion fires unless its
   underlying measure crosses a stated threshold, so an empty list means the data didn't show
   anything worth flagging — not that the analysis failed to run. */
function forecastDrivers(company, history, fcs){
  if(!history.length) return [];
  const RATE_STATUSES = ['staff','rankfile'];
  const firstMs = history[0].ms, lastMs = history[history.length-1].ms;
  const inScope = e=> (!company || e.company===company) && RATE_STATUSES.includes(STATUS_KEY(e.employmentStatus));
  // Separations counted the same way the trend counts them: by reporting month, within the
  // exact window the projection was fitted on.
  const seps = EMP.filter(e=>{
    if(!inScope(e) || !e.dateSeparated) return false;
    const ms = separationTagMonthOf(e);
    return ms && ms>=firstMs && ms<=lastMs;
  });
  const activeNow = EMP.filter(e=> inScope(e) && !e.dateSeparated);
  const months = history.length;
  const out = [];
  const pct = (n,d)=> d ? (n/d*100) : 0;

  /* 1 — Where the projection is heading, and what holding it flat would cost. */
  const projSep = fcs.separatedFcVals.reduce((a,b)=>a+b,0);
  const projHired = fcs.hiredFcVals.reduce((a,b)=>a+b,0);
  const gap = projSep - projHired;
  if(fcs.horizon && projSep>0){
    out.push({
      sev: gap>0 ? 'watch' : 'ok',
      factor: 'Replacement pace',
      measure: `${Math.round(projHired)} projected hires vs ${Math.round(projSep)} projected separations over the next ${horizonLabelText(fcs.horizon).toLowerCase()}`,
      suggestion: gap>0
        ? `At the current pace, hiring falls about <b>${Math.round(gap)}</b> short of replacing projected losses. To hold headcount flat you'd need roughly <b>${(projSep/fcs.horizon).toFixed(1)} hires per month</b> — worth checking that against recruitment capacity and budget now rather than at the point the gap shows up in the roster.`
        : `Projected hiring covers projected losses with about <b>${Math.round(-gap)}</b> to spare. If that surplus isn't intentional growth, it's worth confirming the requisitions behind it are still needed.`
    });
  }

  /* 2 — Why people are leaving. A single dominant reason is the most directly addressable
     factor available, since it points at a specific process rather than a general trend. */
  if(seps.length>=3){
    const byReason = {};
    seps.forEach(e=>{ const r = e.separationReason || 'Unspecified'; byReason[r] = (byReason[r]||0)+1; });
    const ranked = Object.entries(byReason).sort((a,b)=>b[1]-a[1]);
    const [topReason, topCount] = ranked[0];
    const topPct = pct(topCount, seps.length);
    if(topPct>=40 && topReason!=='Unspecified'){
      out.push({
        sev: 'act',
        factor: 'Dominant exit reason',
        measure: `${topReason} accounts for ${topCount} of ${seps.length} separations (${topPct.toFixed(0)}%) over the last ${months} month(s)`,
        suggestion: /resign/i.test(topReason)
          ? `Voluntary resignation is the single largest driver, which means most of this attrition is addressable. Exit-interview themes, pay benchmarking against the market band for the affected grades, and manager-level breakdowns are where this usually resolves — the projection assumes this rate simply continues, so any movement here changes the line directly.`
          : (/contract|end of/i.test(topReason)
            ? `Most exits are contract endings rather than people choosing to leave. That's structural, not a retention problem — but it does mean headcount losses are predictable in advance. Aligning contract end dates with a planned renewal or backfill decision converts this from attrition into scheduled turnover.`
            : `${topReason} drives most exits in this window. Because it's concentrated in one reason, a single targeted intervention has more leverage here than a broad retention program.`)
      });
    }
    const unspecified = byReason['Unspecified'] || 0;
    if(pct(unspecified, seps.length)>=25){
      out.push({
        sev: 'watch',
        factor: 'Missing exit reasons',
        measure: `${unspecified} of ${seps.length} separations (${pct(unspecified,seps.length).toFixed(0)}%) have no reason recorded`,
        suggestion: `The largest single "reason" for leaving is currently a blank field, which caps how far any driver analysis can go. Making Reason mandatory at separation review would make the next few months of this analysis substantially more useful.`
      });
    }
  }

  /* 3 — How early people leave. Early-tenure exits point at hiring fit and onboarding rather
     than at long-run retention, and they're the most expensive kind of turnover per head. */
  if(seps.length>=3){
    const withTenure = seps.map(e=> tenureAtSeparation(e)).filter(t=> t!==null && t!==undefined);
    if(withTenure.length>=3){
      const early = withTenure.filter(t=> t<1).length;
      const earlyPct = pct(early, withTenure.length);
      if(earlyPct>=30){
        out.push({
          sev: 'act',
          factor: 'Early-tenure exits',
          measure: `${early} of ${withTenure.length} leavers (${earlyPct.toFixed(0)}%) left within their first year`,
          suggestion: `A third or more of exits happening inside the first year points upstream of retention — to selection, role expectation-setting, or the first 90 days — rather than to long-term engagement. This is also the most expensive attrition per head, since recruitment cost is spent without a full year of return. A 30/60/90-day check-in and a look at which sources and positions these hires came from usually isolates it quickly.`
        });
      }
    }
  }

  /* 4 — Where losses concentrate. A department losing well above its share of headcount is a
     local problem wearing an org-wide number as a disguise. */
  if(seps.length>=4 && activeNow.length){
    const sepByDept = {}, actByDept = {};
    seps.forEach(e=>{ const d = deptOfEmployee(e, true); sepByDept[d] = (sepByDept[d]||0)+1; });
    activeNow.forEach(e=>{ const d = deptOfEmployee(e, true); actByDept[d] = (actByDept[d]||0)+1; });
    const ranked = Object.entries(sepByDept).sort((a,b)=>b[1]-a[1]);
    const [topDept, topCount] = ranked[0];
    const sepShare = pct(topCount, seps.length);
    const headShare = pct(actByDept[topDept]||0, activeNow.length);
    if(sepShare >= headShare*1.5 && sepShare>=25){
      out.push({
        sev: 'act',
        factor: 'Concentrated loss',
        measure: `${topDept} is ${headShare.toFixed(0)}% of headcount but ${sepShare.toFixed(0)}% of separations (${topCount} of ${seps.length})`,
        suggestion: `Attrition here is disproportionate to size, so the org-wide rate understates how sharp it is inside ${topDept}. Local causes — workload, a specific manager, pay compression against market, or a physically harder role — are worth ruling out before treating this as a company-wide retention issue, since org-wide programs would be aimed mostly at people who aren't leaving.`
      });
    }
  }

  /* 5 — Retirement exposure. Unlike attrition, this is knowable years ahead and doesn't need a
     regression to see coming. */
  if(activeNow.length>=10){
    const near = activeNow.filter(e=>{ const a = ageYears(e, new Date()); return a!==null && a>=55; }).length;
    const nearPct = pct(near, activeNow.length);
    if(nearPct>=10){
      out.push({
        sev: 'watch',
        factor: 'Retirement exposure',
        measure: `${near} active employees (${nearPct.toFixed(0)}%) are 55 or older`,
        suggestion: `The linear projection can't see this coming — it only extrapolates past separations, and these exits haven't happened yet. Over a 3–5 year horizon that's <b>${near}</b> departures arriving on a schedule you can already read. Succession cover and knowledge transfer for the affected positions are cheaper to arrange now than to backfill under pressure later.`
      });
    }
  }

  /* 6 — Volatility. A regression through a jumpy series projects a confident line that the
     underlying data doesn't support, and that's worth saying out loud. */
  if(months>=4){
    const sepVals = history.map(d=>d.separated);
    const mean = sepVals.reduce((a,b)=>a+b,0)/sepVals.length;
    if(mean>0){
      const sd = Math.sqrt(sepVals.reduce((a,v)=>a+(v-mean)**2,0)/sepVals.length);
      if(sd/mean > 0.75){
        out.push({
          sev: 'watch',
          factor: 'Volatile history',
          measure: `Monthly separations swing widely (${sepVals.join(', ')}) around an average of ${mean.toFixed(1)}`,
          suggestion: `The month-to-month variation is large relative to the average, so the straight line through it is a rough centre of gravity rather than a reliable path — treat the projected figures as a range, not a target. If the spikes line up with contract end dates or a seasonal pattern, planning against that calendar will beat planning against the trend line.`
        });
      }
    }
  }

  /* 7 — Data sufficiency, stated plainly rather than left for the reader to infer. */
  if(months < 6){
    out.push({
      sev: 'info',
      factor: 'Thin history',
      measure: `Only ${months} month(s) of reported history for this scope`,
      suggestion: `A line fitted to ${months} points will move noticeably with each new upload, and anything beyond a 12-month horizon is extrapolating well past the evidence. The projection is worth reading as a direction rather than a forecast until roughly 12 months are on file.`
    });
  }
  return out;
}

const DRIVER_SEV = {
  act:   {label:'Act on this', color:'var(--red)'},
  watch: {label:'Watch',       color:'var(--gold)'},
  ok:    {label:'On track',    color:'var(--green)'},
  info:  {label:'Context',     color:'var(--dim)'}
};

function driverPanel(drivers, scopeLabel, months){
  if(!drivers.length){
    return `<div class="card" style="padding:14px 16px;"><p class="hint">Nothing crossed a reporting threshold for ${scopeLabel} in this window — no single exit reason, department, or tenure band stands out enough in the last ${months} month(s) to call out. This checks separation reasons, early-tenure exits, loss concentration by department, hiring pace against projected losses, retirement exposure, and month-to-month volatility.</p></div>`;
  }
  return drivers.map(d=>{
    const sev = DRIVER_SEV[d.sev] || DRIVER_SEV.info;
    return `
    <div class="card" style="padding:13px 15px;margin-bottom:10px;border-left:3px solid ${sev.color};">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span class="label" style="margin:0;">${d.factor}</span>
        <span style="font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:10px;background:var(--surface2);color:${sev.color};">${sev.label}</span>
      </div>
      <p class="hint" style="margin:6px 0 0;color:var(--text);">${d.measure}</p>
      <p class="hint" style="margin:6px 0 0;">${d.suggestion}</p>
    </div>`;
  }).join('');
}

// Merged nav item: Forecast and Executive Report share one sidebar slot, switched via a subnav
// (same pattern as Company Detail's Monthly/Annual tabs) rather than two separate entries.

}

function renderForecast(){
  const companies = allCompanies().map(c=>c.company);
  const company = ui.forecastScope || null;
  const horizon = Number(ui.forecastHorizon) || 12;
  const histCount = forecastHistoryMonths(company);
  const history = forecastHistory(company, histCount);
  const forecastLabels = futureMonthLabels(horizon);
  const scopeTabs = [['all','All Companies (Org-Wide)']].concat(companies.map(c=>[c,c]));
  const horizonTabs = [[6,'6 Months'],[12,'1 Year'],[24,'2 Years'],[36,'3 Years'],[60,'5 Years']];

  const enoughData = history.length>=3;
  const headcountVals = history.map(d=>d.headcount);
  const hiredVals = history.map(d=>d.hired);
  const separatedVals = history.map(d=>d.separated);
  const attritionVals = history.map(d=>d.attrition);
  const retentionVals = history.map(d=>d.retention);

  const headcountFc = linearForecast(headcountVals, horizon);
  const headcountFcVals = headcountFc.values.map(v=>Math.max(0,Math.round(v)));
  const hiredFc = linearForecast(hiredVals, horizon);
  const hiredFcVals = hiredFc.values.map(v=>Math.max(0,v));
  const separatedFc = linearForecast(separatedVals, horizon);
  const separatedFcVals = separatedFc.values.map(v=>Math.max(0,v));
  const attritionFc = linearForecast(attritionVals, horizon);
  const attritionFcVals = attritionFc.values.map(v=>Math.min(100,Math.max(0,v)));
  const retentionFcVals = attritionFcVals.map(v=>100-v);

  const lastHeadcount = headcountVals[headcountVals.length-1];
  const projHeadcount = headcountFcVals[headcountFcVals.length-1];
  const lastAttrition = attritionVals[attritionVals.length-1];
  const projAttrition = attritionFcVals[attritionFcVals.length-1];
  const headcountDir = trendDirectionLabel(headcountFc.slope, 0.3);
  const attritionDir = trendDirectionLabel(attritionFc.slope, 0.1);
  // For attrition, "rising" is the concerning direction — flip the color semantics vs headcount.
  const attritionDirColor = attritionDir.word==='rising' ? 'var(--red)' : (attritionDir.word==='declining' ? 'var(--green)' : 'var(--dim)');

  const drivers = forecastDrivers(company, history, {horizon, hiredFcVals, separatedFcVals});

  const yearMarks = yearMarksWithin(horizon);
  const outlookRows = yearMarks.map(mo=>{
    const idx = mo-1;
    return {
      point: mo%12===0 ? `End of Year ${mo/12}` : `${mo} Months Out`,
      label: forecastLabels[idx],
      headcount: headcountFcVals[idx],
      retention: retentionFcVals[idx],
      attrition: attritionFcVals[idx]
    };
  });

  const scopeLabel = company || 'the organization';
  const narrative = !enoughData
    ? `There's only ${history.length} month${history.length===1?'':'s'} of real history for ${scopeLabel} so far — that's not enough to project a reliable trend yet. The chart below still shows what's on record; check back once a few more months of Master List uploads are in.`
    : `Over the last ${history.length} months, headcount for ${scopeLabel} has been <b style="color:${headcountDir.color}">${headcountDir.word}</b> (currently ${lastHeadcount}, projected to <b>${projHeadcount}</b> by ${forecastLabels[forecastLabels.length-1]}), and the attrition rate has been <b style="color:${attritionDirColor}">${attritionDir.word}</b> (currently ${lastAttrition.toFixed(1)}%, projected to <b>${projAttrition.toFixed(1)}%</b> over the same window). ${attritionDir.word==='rising' ? 'Turnover risk may be building for this scope — worth a closer look at what\'s driving separations before it shows up in the numbers.' : (attritionDir.word==='declining' ? 'Retention looks to be improving for this scope based on the recent trend.' : 'Attrition looks broadly steady over the projection window, assuming no major change in conditions.')}`;

  return `
  <div class="field-row" style="align-items:center;justify-content:space-between;">
    <div class="field"><label>SCOPE</label>
      <select onchange="ui.forecastScope=this.value==='all'?'':this.value; render();">
        ${scopeTabs.map(([k,l])=>`<option value="${k}" ${(company||'all')===k?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    <div class="grid cards3" style="grid-template-columns:repeat(2,160px);gap:12px;">
      <div class="card" style="padding:10px 14px;"><div class="label">Headcount ${forecastLabels[forecastLabels.length-1]}</div><div class="value" style="font-size:20px;color:${headcountDir.color}">${enoughData?projHeadcount:'—'}</div></div>
      <div class="card" style="padding:10px 14px;"><div class="label">Attrition Rate ${forecastLabels[forecastLabels.length-1]}</div><div class="value" style="font-size:20px;color:${attritionDirColor}">${enoughData?projAttrition.toFixed(1)+'%':'—'}</div></div>
    </div>
  </div>
  <div class="subnav" style="margin:14px 0 4px;">
    ${horizonTabs.map(([k,l])=>`<div class="item ${horizon===k?'active':''}" onclick="ui.forecastHorizon=${k}; render();">${l}</div>`).join('')}
  </div>

  <p class="hint" style="margin:-2px 0 16px;">Based on the trailing <b>${history.length}</b> month${history.length===1?'':'s'} of real data for <b>${scopeLabel}</b>, projected forward <b>${horizonLabelText(horizon)}</b> using a simple linear trend line (least-squares regression on the monthly history) — not a predictive model, so treat it as directional planning input rather than a guarantee. The further out the horizon, the less confidence to place in any single number.</p>

  <p class="hint" style="background:var(--surface2);padding:12px 14px;border-radius:8px;">${narrative}</p>

  ${horizon>=12 ? `
  <h2 class="section">Year-by-Year Outlook <span class="n">${scopeLabel} · projected, Staff &amp; Rank &amp; File attrition/retention</span></h2>
  <table class="demo">
    <thead><tr><th class="rowlabel">Point in Time</th><th>Projected Headcount</th><th>Projected Retention Rate</th><th>Projected Attrition Rate</th></tr></thead>
    <tbody>
      ${enoughData ? outlookRows.map(r=>`<tr><td class="rowlabel">${r.point} <span style="color:var(--dim2);font-weight:400;">(${r.label})</span></td><td>${r.headcount}</td><td>${r.retention.toFixed(1)}%</td><td>${r.attrition.toFixed(1)}%</td></tr>`).join('') : `<tr><td class="rowlabel" colspan="4" style="text-align:center;color:var(--dim);">Not enough historical months yet to project a year-by-year outlook.</td></tr>`}
    </tbody>
  </table>
  <p class="hint">Each row is a single linear-trend projection at that point in time, not a cumulative forecast — later years carry more uncertainty since they extrapolate further past the real data on record.</p>
  ` : ''}

  <h2 class="section">What's Driving This <span class="n">${scopeLabel} · factors measured from the last ${history.length} month(s) on file</span></h2>
  ${driverPanel(drivers, scopeLabel, history.length)}

  <h2 class="section">Headcount <span class="n">history (solid) + ${horizonLabelText(horizon)} projection (dashed)</span></h2>
  ${forecastLineChart(headcountVals, history.map(d=>d.label), enoughData?headcountFcVals:[], enoughData?forecastLabels:[])}

  <h2 class="section">Attrition Rate <span class="n">history (solid) + ${horizonLabelText(horizon)} projection (dashed) · Staff &amp; Rank &amp; File only</span></h2>
  ${forecastLineChart(attritionVals, history.map(d=>d.label), enoughData?attritionFcVals:[], enoughData?forecastLabels:[], {suffix:'%'})}

  <h2 class="section">Hires vs. Separations <span class="n">history (solid) + ${horizonLabelText(horizon)} projection (dashed)</span></h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
    <div><p class="hint" style="margin-bottom:6px;"><b>Hired</b></p>${forecastLineChart(hiredVals, history.map(d=>d.label), enoughData?hiredFcVals:[], enoughData?forecastLabels:[])}</div>
    <div><p class="hint" style="margin-bottom:6px;"><b>Separated</b></p>${forecastLineChart(separatedVals, history.map(d=>d.label), enoughData?separatedFcVals:[], enoughData?forecastLabels:[])}</div>
  </div>
  <p class="hint">Retention Rate mirrors Attrition Rate (100% − Attrition) and is omitted above to avoid a duplicate chart — projected Retention Rate at ${forecastLabels[forecastLabels.length-1]||''} is <b>${enoughData?retentionFcVals[retentionFcVals.length-1].toFixed(1)+'%':'—'}</b>.</p>
  `;
}

/* Shared HTML escaper for any user-entered text rendered into a template. */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  <div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;">
    <div class="panel" style="width:100%;max-width:340px;">
      <div style="text-align:center;margin-bottom:20px;">

// Shown instead of a silent blank page whenever a render step throws — includes the actual
// error so it can be diagnosed from a screenshot alone, without needing to open DevTools.
function renderFatalError(err, where){
  const msg = (err && err.message) ? err.message : String(err);
  const stack = (err && err.stack) ? err.stack.split('\n').slice(0,4).join('\n') : '';
  return `
  <div class="empty" style="text-align:left;max-width:640px;margin:60px auto;padding:24px;background:var(--surface);border:1px solid var(--red);border-radius:10px;">
    <div style="color:var(--red);font-weight:600;margin-bottom:8px;">Something went wrong${where?` while loading ${where}`:''}.</div>
    <div style="font-size:12.5px;color:var(--dim);margin-bottom:12px;">This section couldn't render — the rest of the app should still work. Screenshot this box and send it over so it can be fixed; the data itself hasn't been changed or lost.</div>
    <div style="font-family:var(--mono);font-size:11px;color:var(--text);background:var(--surface2);padding:10px 12px;border-radius:6px;white-space:pre-wrap;word-break:break-word;">${escapeHtml(msg)}${stack?'\n\n'+escapeHtml(stack):''}</div>
    <button class="btn" style="margin-top:14px;" onclick="location.reload()">Reload Page</button>
  </div>`;
}
function render(){

  if(!ui.authRole){
    try{ app.innerHTML = renderLogin(); }
    catch(err){ console.error(err); app.innerHTML = renderFatalError(err, 'the login screen'); }
    (document.getElementById('loginPassword') || document.getElementById('recCode'))?.focus();
    return;
  }
  try{
    app.innerHTML = `
      ${sidebar()}
      <div class="main">
        ${topbar()}
        <div id="tabBody"></div>
      </div>
    `;
  }catch(err){
    console.error(err);
    app.innerHTML = renderFatalError(err, 'the page layout');
    return;
  }
  const body = document.getElementById('tabBody');
  const EXEC_ALLOWED_TABS = ['overview','company','forecastreport'];
  try{
    if(ui.tab==='settings' && !isAdmin()){
      body.innerHTML = '<div class="empty">The Control Panel is restricted to Admin users. Switch your role to Admin (bottom-left) if that\'s you, or ask your Admin for this change.</div>';
    }

    }
    else if(ui.tab==='overview') body.innerHTML = renderOverview();
    else if(ui.tab==='company') body.innerHTML = renderCompany();
    else if(ui.tab==='forecastreport') body.innerHTML = renderForecastReportHub();
    else if(ui.tab==='recruitment') body.innerHTML = renderRecruitment();
