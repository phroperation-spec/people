/* ============ EXECUTIVE REPORT ============
   A consolidated, printable board-level report. Reuses the same core stats functions as the
   rest of the app (companyStatsCore/orgStatsCore, breakdownBarChart, crossTabGeneric) so its
   numbers always agree with Trend & Insight / Company Detail — this is a different lens on the
   same data, not a parallel calculation. */

function execReportPeriodBounds(){
  const selectedYear = Number(ui.month.split('-')[0]) || new Date().getFullYear();
  if(ui.reportPeriod==='annual'){
    const start = new Date(selectedYear,0,1), end = new Date(selectedYear,11,31,23,59,59);
    const prevStart = new Date(selectedYear-1,0,1), prevEnd = new Date(selectedYear-1,11,31,23,59,59);
    return {
      start, end, opts:{baselineDate:new Date(start.getTime()-1)},
      prevStart, prevEnd, prevOpts:{baselineDate:new Date(prevStart.getTime()-1)},
      label:`${selectedYear} — Full Year`, prevLabel:`${selectedYear-1} — Full Year`, compareWord:'year-on-year (YoY)'
    };
  }
  const {start,end} = monthBounds(ui.month);
  const prevMs = monthStr(new Date(start.getFullYear(), start.getMonth()-1, 1));
  const {start:prevStart,end:prevEnd} = monthBounds(prevMs);
  return {
    start, end, opts:{baselineDate:new Date(start.getTime()-1)},
    prevStart, prevEnd, prevOpts:{baselineDate:new Date(prevStart.getTime()-1)},
    label: monthLabel(ui.month), prevLabel: monthLabel(prevMs), compareWord:'month-on-month (MoM)'
  };
}
function execReportStats(start,end,opts){
  return ui.reportScope ? companyStatsCore(ui.reportScope, start, end, opts) : orgStatsCore(start, end, opts);
}
function execReportScopeLabel(){ return ui.reportScope || 'All Companies — Org-Wide'; }
function execScopeEmp(){ return ui.reportScope ? EMP.filter(e=> e.company===ui.reportScope) : EMP.slice(); }
function setReportScope(v){ ui.reportScope = v; render(); }
function setReportPeriod(v){ ui.reportPeriod = v; render(); }
function toggleReportCompare(){ ui.reportCompare = !ui.reportCompare; render(); }

function groupCount(list, keyFn){
  const m={}; list.forEach(e=>{ const k=keyFn(e)||'Unassigned'; m[k]=(m[k]||0)+1; }); return m;
}
// Simple Pearson correlation coefficient over two equal-length numeric series.
function pearsonCorr(xs, ys){
  const n = xs.length;
  if(n<2) return null;
  const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
  let num=0, dx2=0, dy2=0;
  for(let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; num+=dx*dy; dy2+=dy*dy; dx2+=dx*dx; }
  const den = Math.sqrt(dx2*dy2);
  return den ? num/den : null;
}
// Trailing month-by-month headcount + % female, for the correlation chart — same trailing-
// window guard rail as Forecast (never pads a chart with pre-baseline months).
function execTrailingSeries(monthsBack){
  const [y,m] = ui.month.split('-').map(Number);
  let out=[];
  for(let i=monthsBack-1;i>=0;i--){
    const d = new Date(y, m-1-i, 1);
    const ms = monthStr(d);
    const s = ui.reportScope ? companyStats(ui.reportScope, ms) : orgStats(ms);
    const female = s.active.filter(e=> (e.gender||'').trim().toLowerCase().startsWith('f')).length;
    out.push({ ms, label: d.toLocaleString('en-US',{month:'short'})+" '"+String(d.getFullYear()).slice(2),
      headcount: s.total, femalePct: s.total ? female/s.total*100 : 0 });
  }
  return out;
}
function execAttritionCohorts(period){
  const RATE_STATUSES = ['staff','rankfile'];
  const scopeEmp = execScopeEmp();
  const baseSet = scopeEmp.filter(e=> isActiveAsOf(e, period.opts.baselineDate) && RATE_STATUSES.includes(STATUS_KEY(e.employmentStatus)));
  const separated = scopeEmp.filter(e=> isSeparatedInReal(e, period.start, period.end) && RATE_STATUSES.includes(STATUS_KEY(e.employmentStatus)));
  return {baseSet, separated};
}
// Tenure band vs. Attrition: for each tenure band, what share of the pre-period base it held
// versus what share of this period's actual departures it accounts for. An index above 1 means
// that band is over-represented among people who left, relative to its share of the workforce.
function tenureAttritionRows(period){
  const {baseSet, separated} = execAttritionCohorts(period);
  const baseByBand = groupCount(baseSet, e=>{ const t=tenureYears(e, period.opts.baselineDate); return t===null?'Unclassified':tenureGroupOf(t); });
  const sepByBand = groupCount(separated, e=>{ const t=tenureAtSeparation(e); return t===null?'Unclassified':tenureGroupOf(t); });
  const bands = CONFIG.tenureGroups.map(g=>g.label).concat(['Unclassified']);
  const totalBase = baseSet.length||1, totalSep = separated.length||1;
  return bands.filter(b=> baseByBand[b]||sepByBand[b]).map(b=>{
    const basePct = (baseByBand[b]||0)/totalBase*100;
    const sepPct = (sepByBand[b]||0)/totalSep*100;
    return {band:b, baseCount:baseByBand[b]||0, basePct, sepCount:sepByBand[b]||0, sepPct, idx: basePct ? sepPct/basePct : null};
  });
}
// Cost centers with the highest attrition rate this period — a base-count floor keeps a single
// departure in a 2-person cost center from reading as a "500% turnover" false alarm.
function costCenterRiskRows(period, minBase){
  minBase = minBase || 5;
  const {baseSet, separated} = execAttritionCohorts(period);
  const baseByCC = groupCount(baseSet, e=> (e.costCenter||'').trim()||'Unassigned');
  const sepByCC = groupCount(separated, e=> (e.costCenter||'').trim()||'Unassigned');
  return Object.keys(baseByCC).filter(cc=> baseByCC[cc]>=minBase).map(cc=>({
    cc, base:baseByCC[cc], sep:sepByCC[cc]||0, rate:(sepByCC[cc]||0)/baseByCC[cc]*100
  })).sort((a,b)=> b.rate-a.rate);
}
// Positions where every current incumbent's Job Grade resolves to the same Job Grade Group vs.
// positions where they disagree — mirrors the Control Panel's discrepancy flag (see
// positionJobGradeGroupsObserved) so this report surfaces the exact same unresolved items HR
// still needs to classify manually.
function execJobGradeConflicts(){
  const companies = ui.reportScope ? [ui.reportScope] : allCompanies().map(c=>c.company);
  const statuses = ['Staff','Rank & File'];
  let out = [];
  companies.forEach(c=> statuses.forEach(s=>{
    distinctPositions(c,s).forEach(p=>{
      const observed = positionJobGradeGroupsObserved(c,s,p);
      if(observed.length>1) out.push({company:c, status:s, position:p, groups:observed});
    });
  }));
  return out;
}
// Positions with exactly one current incumbent, scope-wide — a single point of failure risk
// (Staff & Rank & File only; Intern/OJT turnover is expected and not a "gap").
function execCriticalPositionGaps(st){
  const counts = groupCount(st.active.filter(e=> ['staff','rankfile'].includes(STATUS_KEY(e.employmentStatus))), e=> (e.position||'').trim()||'Unassigned');
  return Object.keys(counts).filter(p=> counts[p]===1 && p!=='Unassigned').sort();
}
// Compares each employee's Job Grade as of the current period's end-month against their Job
// Grade as of the previous period's end-month (using the snapshot history recorded on every
// Master List upload / manual edit — see recordJobGradeSnapshot / jobGradeAsOf). Only counted for
// people on the roster in BOTH periods, so a new hire or rehire never misreads as a "jump" from
// nothing. A higher numeric grade this period than last = promoted; a lower one = flagged
// separately as a decrease, since that's more often a data correction than an actual demotion but
// still worth HR's eyes. Requires "Compare vs. prior period" to be on and at least two dated
// snapshots on file for a given employee — until then this simply returns nothing rather than
// guessing from a single point-in-time value.
function execJobGradeMovement(period){
  if(!period.prevEnd) return {promoted:[], decreased:[]};
  const scopeEmp = execScopeEmp();
  const curMs = monthStr(period.end), prevMs = monthStr(period.prevEnd);
  const promoted = [], decreased = [];
  scopeEmp.forEach(e=>{
    if(e.dateSeparated) return; // don't count promotions for employees who are no longer with the company
    if(!isOnRosterAsOf(e, period.end) || !isOnRosterAsOf(e, period.prevEnd)) return;
    if(!Array.isArray(e.jobGradeHistory) || e.jobGradeHistory.length<2) return; // need at least two dated snapshots to compare
    const prevGrade = jobGradeAsOf(e, prevMs), curGrade = jobGradeAsOf(e, curMs);
    const prevNum = jobGradeNumeric(prevGrade), curNum = jobGradeNumeric(curGrade);
    if(prevNum===null || curNum===null || prevNum===curNum) return;
    const row = {
      emp:e, prevGrade, curGrade, prevNum, curNum,
      prevGroup: jobGradeGroupOf(e.company, e.employmentStatus, prevGrade),
      curGroup: jobGradeGroupOf(e.company, e.employmentStatus, curGrade)
    };
    (curNum>prevNum ? promoted : decreased).push(row);
  });
  promoted.sort((a,b)=> (b.curNum-b.prevNum)-(a.curNum-a.prevNum));
  decreased.sort((a,b)=> (a.curNum-a.prevNum)-(b.curNum-b.prevNum));
  return {promoted, decreased};
}
// Flags Staff employees (Rank & File is out of scope for this ladder-based flag) whose tenure
// already meets or exceeds their CURRENT Job Grade Group's own Max Tenure Stay (an adjustable
// per-grade guideline, not a sourced external benchmark — see Control Panel → Job Grade Groups)
// but who are still short of the most senior configured Job Grade Group for their status. Also
// notes whether any promotion was actually observed in their tracked history (see
// execJobGradeMovement) so a genuinely-stuck long-tenure case reads differently from one where
// history just hasn't built up yet to confirm either way.
function execTenureGradeGaps(st, period){
  const rows = [];
  st.active.filter(e=> STATUS_KEY(e.employmentStatus)==='staff').forEach(e=>{
    const group = jobGradeGroupOf(e.company, e.employmentStatus, e.jobGrade);
    if(group==='Unclassified') return; // no grade data to judge against — not a false negative, just unknown
    const maxTenure = jobGradeGroupMaxTenure(e.company, e.employmentStatus, group);
    if(!maxTenure) return; // this grade has no Max Tenure Stay configured — nothing to flag against
    const t = tenureYears(e, period.end);
    if(t===null || t<maxTenure) return;
    const top = topJobGradeGroupLabel(e.company, e.employmentStatus);
    const ceiling = topJobGradeNumericCeiling(e.company, e.employmentStatus);
    const curNum = jobGradeNumeric(e.jobGrade);
    if(ceiling===null || curNum===null || curNum>=ceiling) return; // already at the highest configured grade number — no +1 to move into
    const hist = Array.isArray(e.jobGradeHistory) ? e.jobGradeHistory : [];
    const nums = hist.map(h=> jobGradeNumeric(h.jobGrade)).filter(n=> n!==null);
    const everPromotedInHistory = nums.some((n,i)=> i>0 && n>nums[i-1]);
    rows.push({ emp:e, tenure:t, group, top, maxTenure, everPromotedInHistory, historyDepth: hist.length });
  });
  return rows.sort((a,b)=> (b.tenure-b.maxTenure)-(a.tenure-a.maxTenure));
}
// Same flagging logic as execTenureGradeGaps, but org-wide (not scoped to a report selection)
// and anchored to today rather than a report period — used to give a live preview right next to
// the Promotion Benchmark setting in the Control Panel, so adjusting the number shows its effect
// immediately without needing to open the Executive Report.
function controlPanelTenureGradeGaps(){
  const now = new Date();
  const rows = [];
  EMP.filter(e=> !e.dateSeparated && STATUS_KEY(e.employmentStatus)==='staff').forEach(e=>{
    const group = jobGradeGroupOf(e.company, e.employmentStatus, e.jobGrade);
    if(group==='Unclassified') return;
    const maxTenure = jobGradeGroupMaxTenure(e.company, e.employmentStatus, group);
    if(!maxTenure) return;
    const t = tenureYears(e, now);
    if(t===null || t<maxTenure) return;
    const top = topJobGradeGroupLabel(e.company, e.employmentStatus);
    const ceiling = topJobGradeNumericCeiling(e.company, e.employmentStatus);
    const curNum = jobGradeNumeric(e.jobGrade);
    if(ceiling===null || curNum===null || curNum>=ceiling) return; // already at the highest configured grade number — no +1 to move into
    rows.push({ emp:e, tenure:t, group, top, maxTenure });
  });
  return rows.sort((a,b)=> (b.tenure-b.maxTenure)-(a.tenure-a.maxTenure));
}
function execDelta(cur, prev, opts){
  opts = opts || {};
  if(prev===null || prev===undefined || !ui.reportCompare) return '';
  const diff = cur-prev;
  const decimals = opts.decimals!=null ? opts.decimals : 0;
  if(Math.abs(diff) < (opts.eps!=null?opts.eps:0.05)) return ` <span style="color:var(--dim2);font-size:11px;font-family:var(--mono);">flat vs ${opts.label||'prior period'}</span>`;
  const up = diff>0;
  const good = opts.higherIsBad ? !up : up;
  const color = good ? 'var(--green)' : 'var(--red)';
  return ` <span style="color:${color};font-size:11px;font-family:var(--mono);">${up?'▲':'▼'} ${Math.abs(diff).toFixed(decimals)}${opts.suffix||''} vs ${opts.label||'prior period'}</span>`;
}

function execExecutiveSummary(st, prevSt, period){
  const scopeLabel = execReportScopeLabel();
  const active = st.active;
  const total = active.length;
  const female = active.filter(e=> (e.gender||'').trim().toLowerCase().startsWith('f')).length;
  const deptCounts = groupCount(active, e=> deptOfEmployee(e,true));
  const topDept = Object.keys(deptCounts).sort((a,b)=> deptCounts[b]-deptCounts[a])[0];
  const agedNow = active.filter(e=>{ const g = ageGroupOf(ageYears(e, period.end)); return g==='45–54' || g==='55 and up'; }).length;
  const agedPctNow = total ? agedNow/total*100 : 0;
  let agedPctPrev = null;
  if(prevSt){
    const agedPrev = prevSt.active.filter(e=>{ const g = ageGroupOf(ageYears(e, period.prevEnd)); return g==='45–54' || g==='55 and up'; }).length;
    agedPctPrev = prevSt.active.length ? agedPrev/prevSt.active.length*100 : 0;
  }
  const ccRisk = costCenterRiskRows(period)[0];
  const gaps = execCriticalPositionGaps(st);
  const conflicts = execJobGradeConflicts();
  const movement = execJobGradeMovement(period);
  const tenureGradeGaps = execTenureGradeGaps(st, period);
  const tenureRows = tenureAttritionRows(period).filter(r=> r.band!=='Unclassified' && r.sepCount>=2 && r.idx!==null).sort((a,b)=> b.idx-a.idx);
  const topTenureRisk = tenureRows[0];

  const bullets = [];
  bullets.push(`<b>${scopeLabel}</b> stood at <b>${total}</b> active employees as of ${period.label}${execDelta(total, prevSt?prevSt.total:null, {label:period.prevLabel})}.`);
  bullets.push(`Overall attrition for the period was <b>${st.attritionRate.toFixed(1)}%</b> (retention <b>${st.retentionRate.toFixed(1)}%</b>)${execDelta(st.attritionRate, prevSt?prevSt.attritionRate:null, {label:period.prevLabel, suffix:'pts', decimals:1, higherIsBad:true})}, against <b>${st.hired.length}</b> new hire(s) and <b>${st.separated.length}</b> separation(s) recorded this period.`);
  if(topDept) bullets.push(`<b>${topDept}</b> is the largest department by headcount (${deptCounts[topDept]} employee(s), ${(deptCounts[topDept]/total*100).toFixed(0)}% of ${scopeLabel==='All Companies — Org-Wide'?'the organization':scopeLabel}).`);
  bullets.push(`Gender mix is <b>${total?(female/total*100).toFixed(0):'0'}% female / ${total?(100-female/total*100).toFixed(0):'0'}% male</b> of the active roster.`);
  if(agedPctPrev!==null){
    bullets.push(`<b>${agedPctNow.toFixed(0)}%</b> of the workforce is age 45 or older${execDelta(agedPctNow, agedPctPrev, {label:period.prevLabel, suffix:'pts', decimals:1, higherIsBad:true})}${agedPctNow>25?' — worth monitoring for succession planning.':'.'}`);
  } else {
    bullets.push(`<b>${agedPctNow.toFixed(0)}%</b> of the workforce is age 45 or older.`);
  }
  if(movement.promoted.length) bullets.push(`<b>${movement.promoted.length}</b> employee(s) moved to a higher Job Grade this period vs. ${period.prevLabel} — see Promotions &amp; Job Grade Movement below.`);
  if(movement.decreased.length) bullets.push(`<b>${movement.decreased.length}</b> employee(s) show a lower Job Grade this period vs. ${period.prevLabel} — worth confirming whether this reflects an actual role change or a data entry correction.`);
  if(tenureGradeGaps.length) bullets.push(`<b>${tenureGradeGaps.length}</b> Staff employee(s) have stayed at their current Job Grade Group longer than that grade's configured Max Tenure Stay without moving up even one Job Grade — a possible promotion-readiness gap (see Correlation Analysis → Tenure vs. Job Grade Level).`);
  if(ccRisk && ccRisk.rate>0) bullets.push(`Cost Center <b>${ccRisk.cc}</b> shows the highest attrition this period at <b>${ccRisk.rate.toFixed(1)}%</b> (${ccRisk.sep} of ${ccRisk.base}) — the top risk area for turnover concentration.`);
  if(topTenureRisk) bullets.push(`Employees with <b>${topTenureRisk.band}</b> tenure are over-represented among this period's departures (${topTenureRisk.sepPct.toFixed(0)}% of exits vs. ${topTenureRisk.basePct.toFixed(0)}% of the base) — an early-tenure or long-tenure flight-risk signal depending on the band.`);
  if(gaps.length) bullets.push(`<b>${gaps.length}</b> position(s) currently have only one incumbent org-wide in scope — a single-point-of-failure risk if any of them separate.`);
  if(conflicts.length) bullets.push(`<b>${conflicts.length}</b> position(s) have Job Grade discrepancies still pending manual resolution in the Control Panel (employees under the same position title fall into different Job Grade Groups).`);

  return `<ul style="margin:0;padding-left:20px;line-height:1.9;font-size:13.5px;">${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
}

/* ============ CERTIFICATE OF EMPLOYMENT ============ */
function coeDefaultBody(){
  const c = ui.coe;
  const pronoun = c.pronoun || 'Their';
  const hired = c.dateHired ? fmtDateLong(c.dateHired) : '____________';
  const endPhrase = c.present ? 'the present' : (c.dateSeparated ? fmtDateLong(c.dateSeparated) : '____________');
  const deptPhrase = c.department ? ` assigned in **${c.department}**` : '';
  const name = (c.name||'').toUpperCase() || '____________';
  const company = c.companyLabel || '____________';
  const position = c.position || '____________';
  const issuedLine = c.issuedDate ? `Issued this ${fmtOrdinalLongDate(c.issuedDate)}, at ${c.address||'____________'}.` : `Issued at ${c.address||'____________'}.`;
  // Key details (name, company, department, position, dates) are wrapped in **double
  // asterisks** — a lightweight bold marker rendered by coePrintHTML — rather than raw HTML, so
  // the text stays fully and safely editable in the plain-text bodyText textarea.
  return `This is to certify that **${name}** has been employed with **${company}**${deptPhrase} as **${position}.** ${pronoun} employment started from **${hired}** until **${endPhrase}**.\n\n${c.purpose||''}\n\n${issuedLine}`;
}
// Rebuilds the certificate body from the structured fields — only called explicitly (company/
// employee change, or the Regenerate button), so it never clobbers a manual edit made directly
// in the textarea.
function regenerateCOEBody(){
  ui.coe.bodyText = coeDefaultBody();
  render();
}
function selectCOECompany(company){
  ui.coe.company = company;
  const defaults = (CONFIG.coeSettings && CONFIG.coeSettings[company]) || {};
  ui.coe.companyLabel = defaults.companyLabel || company || '';
  ui.coe.address = defaults.address || '';
  ui.coe.purpose = defaults.purpose || 'This certification is being issued for whatever legal purpose this may serve.';
  ui.coe.signatoryName = defaults.signatoryName || '';
  ui.coe.signatoryTitle = defaults.signatoryTitle || '';
  ui.coe.employeeId = '';
  ui.coe.name = ''; ui.coe.position = ''; ui.coe.department = '';
  ui.coe.dateHired = ''; ui.coe.present = true; ui.coe.dateSeparated = '';
  ui.coe.pronoun = 'Their';
  if(!ui.coe.issuedDate) ui.coe.issuedDate = fmtDate(new Date());
  regenerateCOEBody();
}
function selectCOEEmployee(id){
  ui.coe.employeeId = id;
  if(id){
    const emp = EMP.find(e=> String(e.employeeId)===String(id));
    if(emp){
      ui.coe.name = `${emp.firstName||''} ${emp.middleName?emp.middleName.trim().charAt(0)+'. ':''}${emp.lastName||''}`.replace(/\s+/g,' ').trim();
      ui.coe.position = emp.position || '';
      ui.coe.department = deptOfEmployee(emp, true);
      ui.coe.dateHired = emp.dateHired || '';
      ui.coe.present = !emp.dateSeparated;
      ui.coe.dateSeparated = emp.dateSeparated || '';
      ui.coe.pronoun = emp.gender==='Male' ? 'His' : (emp.gender==='Female' ? 'Her' : 'Their');
    }
  }
  regenerateCOEBody();
}
// Every structured field (name override, position, dates, address, signatory, etc.) writes
// straight into ui.coe and only refreshes the preview pane — never a full render() — so typing
// in one field never steals focus away from itself.
function updateCOEField(key, value){
  ui.coe[key] = value;
  refreshCOEPreview();
}
function updateCOEPresent(checked){
  ui.coe.present = checked;
  const dsEl = document.getElementById('coeDateSeparated');
  if(dsEl) dsEl.disabled = checked;
  refreshCOEPreview();
}
function updateCOEBodyText(value){
  ui.coe.bodyText = value;
  refreshCOEPreview();
}
function refreshCOEPreview(){
  const el = document.getElementById('coePrintArea');
  if(el) el.innerHTML = coePrintHTML();
}
// Turns the plain-text **bold** markers in bodyText into <strong> tags. Runs on already
// HTML-escaped text (escapeHtml never touches asterisks), so this stays injection-safe.
function coeBoldMarkers(escapedText){
  return escapedText.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
function coePrintHTML(){
  const c = ui.coe;
  const paras = (c.bodyText||'').split(/\n\s*\n/).map(p=> p.trim()).filter(Boolean);
  return `
  <div class="coe-page" id="coePage">
    <div class="coe-letterhead-space"></div>
    <div class="coe-content">
      <div class="coe-title">CERTIFICATION</div>
      <div class="coe-body">${paras.length ? paras.map(p=>`<p>${coeBoldMarkers(escapeHtml(p))}</p>`).join('') : '<p style="color:#999;">Pick or enter an employee\'s details on the left to generate the certification text.</p>'}</div>
      <div class="coe-sign">
        <div class="coe-sign-name">${escapeHtml(c.signatoryName||'')}</div>
        <div class="coe-sign-title">${escapeHtml(c.signatoryTitle||'')}</div>
      </div>
    </div>
  </div>`;
}
async function saveCOECompanyDefaults(){
  if(!ui.coe.company){ toast('Pick a company first.'); return; }
  CONFIG.coeSettings = CONFIG.coeSettings || {};
  CONFIG.coeSettings[ui.coe.company] = {
    companyLabel: ui.coe.companyLabel, address: ui.coe.address, purpose: ui.coe.purpose,
    signatoryName: ui.coe.signatoryName, signatoryTitle: ui.coe.signatoryTitle
  };
  await saveConfig();
  toast(`Defaults saved for ${ui.coe.company} — company name, address, purpose line, and signatory will auto-fill next time.`);
}
function resetCOEForm(){
  const company = ui.coe.company;
  ui.coe = {
    company:null, employeeId:'', companyLabel:'', name:'', position:'', department:'',
    pronoun:'Their', dateHired:'', present:true, dateSeparated:'',
    issuedDate: fmtDate(new Date()), address:'', purpose:'This certification is being issued for whatever legal purpose this may serve.',
    signatoryName:'', signatoryTitle:'', bodyText:''
  };
  if(company) selectCOECompany(company); else render();
}
function printCOE(){
  if(!(ui.coe.bodyText||'').trim()){ toast('Nothing to print yet — pick or enter an employee\'s details first.'); return; }
  window.print();
}

          </select>
        </div>
        <div class="field-row" style="margin-bottom:10px;">
          <div class="field"><label>NAME</label><input type="text" value="${escapeHtml(c.name)}" oninput="updateCOEField('name', this.value)"></div>
          <div class="field"><label>PRONOUN</label>
            <select onchange="updateCOEField('pronoun', this.value)">
              ${['His','Her','Their'].map(p=>`<option ${p===c.pronoun?'selected':''}>${p}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field-row" style="margin-bottom:10px;">
          <div class="field"><label>POSITION</label><input type="text" value="${escapeHtml(c.position)}" oninput="updateCOEField('position', this.value)"></div>

        </div>

        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px;">
          <input type="checkbox" ${c.present?'checked':''} onchange="updateCOEPresent(this.checked)"> Currently employed (Present)

/* ===== Master List upload — staged, all-or-nothing commit =====
   Nothing from a Master List file (not even the plain updates/rehires/baseline additions that
   need no review) is written to the real employee records or storage while any required review
   step below is still outstanding. The whole proposed change-set lives on MASTERLIST_PENDING —
   a private working copy of the employee list — built by runCompanyUpload(). It only becomes
   real via finalizeMasterlistUpload(), which runs once New Hire, Promotion, and Separation review
   (whichever apply) have all been explicitly resolved. If the chain is abandoned instead of
   resolved (e.g. the modal backdrop is clicked — see closeModal()), cancelMasterlistUpload()
   throws the entire staged upload away and nothing is saved. */
let MASTERLIST_PENDING = null;

function openMasterlistNewHireConfirm(rows, thenPromotionRows, thenCandidateIds){
  ui.modal = {type:'confirmMasterlistNewHires', arg:{rows, thenPromotionRows, thenCandidateIds}};
  render();
}
async function confirmMasterlistNewHires(){
  const P = MASTERLIST_PENDING;
  if(!P){ closeModal(); return; }
  const {rows, thenPromotionRows, thenCandidateIds} = ui.modal.arg;
  const {company, status, asOfMonth} = P;
  let newHires=0, addedNotCounted=0;
  rows.forEach(row=>{
    const sel = document.querySelector(`.mlNewHireChoice[data-id="${row.employeeId}"]`);
    const dateEl = document.querySelector(`.mlNewHireDate[data-id="${row.employeeId}"]`);
    const isNewHire = !sel || sel.value==='yes';
    const dateHired = (dateEl && dateEl.value) ? dateEl.value : row.dateHired;
    P.working.push({
      employeeId:row.employeeId, lastName:row.lastName, firstName:row.firstName, middleName:row.middleName,
      company, industry:industryOf(company), department:'', costCenter:row.costCenter,
      gender:row.gender, position:row.position, jobGrade:row.jobGrade, birthdate:row.birthdate,
      employmentStatus:status, dateHired,
      hireTagMonth: isNewHire ? asOfMonth : '', excludeFromHireCount: !isNewHire,
      // Either way — genuine New Hire or someone who simply wasn't on file yet — they join the
      // reported roster in this upload's month, so this shows up as an increase here and
      // leaves every earlier month's headcount untouched.
      rosterSpans:[{start:asOfMonth, end:''}],
      dateSeparated:'', separationReason:'', separationRemarks:''
    });
    recordJobGradeSnapshot(P.working[P.working.length-1], asOfMonth, row.jobGrade);
    if(isNewHire) newHires++; else addedNotCounted++;
  });
  P.meta.newHires = newHires;
  P.meta.addedNotCounted = addedNotCounted;
  // This step was explicitly resolved (not abandoned), so just clear the modal directly —
  // closeModal() would treat this as a backdrop-dismissal and cancel the whole staged upload.
  ui.modal = null;
  afterMasterlistNewHireStep(thenPromotionRows, thenCandidateIds);
}
function skipMasterlistNewHires(){
  const {thenPromotionRows, thenCandidateIds} = ui.modal.arg;
  ui.modal = null;
  afterMasterlistNewHireStep(thenPromotionRows, thenCandidateIds);
}
// After the New Hire review step (if any) is resolved, fall through to the Promotion review
// step (if there is one), then the separation review step (if there is one). Once none remain,
// the entire staged upload is committed in one shot.
function afterMasterlistNewHireStep(promotionRows, candidateIds){
  if(promotionRows && promotionRows.length){
    openMasterlistPromotionConfirm(promotionRows, candidateIds);
  } else if(candidateIds && candidateIds.length){
    openMasterlistSeparateConfirm(candidateIds);
  } else {
    finalizeMasterlistUpload();
  }
}

/* Task: Promotion review — mirrors the New Hire & Separated confirm step. Position/Job Grade on
   these rows has already been staged on the working copy (not the real records yet — see above);
   this step only decides how each change gets CLASSIFIED, so Trend & Insight and the Executive
   Report can tell an actual promotion apart from a lateral move, title cleanup, or data
   correction. See promotionHistory on the employee record. */
function openMasterlistPromotionConfirm(rows, thenCandidateIds){
  ui.modal = {type:'confirmMasterlistPromotions', arg:{rows, thenCandidateIds}};
  render();
}
async function confirmMasterlistPromotions(){
  const P = MASTERLIST_PENDING;
  if(!P){ closeModal(); return; }
  const {rows, thenCandidateIds} = ui.modal.arg;
  const {asOfMonth} = P;
  let promoted=0, changed=0;
  rows.forEach(row=>{
    const emp = P.working.find(e=> String(e.employeeId)===String(row.employeeId));
    if(!emp) return;
    const sel = document.querySelector(`.mlPromoChoice[data-id="${row.employeeId}"]`);
    const type = (sel && sel.value==='change') ? 'change' : 'promotion';
    emp.promotionHistory = Array.isArray(emp.promotionHistory) ? emp.promotionHistory : [];
    emp.promotionHistory.push({
      ms: asOfMonth, type,
      fromPosition: row.prevPosition, fromJobGrade: row.prevJobGrade,
      toPosition: row.newPosition, toJobGrade: row.newJobGrade
    });
    if(type==='promotion') promoted++; else changed++;
  });
  P.meta.promoted = promoted;
  P.meta.changed = changed;
  // Explicitly resolved — clear the modal directly rather than via closeModal(), which would
  // otherwise mistake this for an abandoned upload and cancel the whole staged upload.
  ui.modal = null;
  afterMasterlistPromotionStep(thenCandidateIds);
}
async function skipMasterlistPromotions(){
  const P = MASTERLIST_PENDING;
  const {rows, thenCandidateIds} = ui.modal.arg;
  if(P){
    rows.forEach(row=>{
      const emp = P.working.find(e=> String(e.employeeId)===String(row.employeeId));
      if(!emp) return;
      emp.promotionHistory = Array.isArray(emp.promotionHistory) ? emp.promotionHistory : [];
      emp.promotionHistory.push({
        ms: P.asOfMonth, type:'change',
        fromPosition: row.prevPosition, fromJobGrade: row.prevJobGrade,
        toPosition: row.newPosition, toJobGrade: row.newJobGrade
      });
    });
    P.meta.changed = (P.meta.changed||0) + rows.length;
  }
  ui.modal = null;
  afterMasterlistPromotionStep(thenCandidateIds);
}
// After the Promotion review step (if any) is resolved, fall through to the separation review
// step (if there is one); once none remain, commit the whole staged upload.
function afterMasterlistPromotionStep(candidateIds){
  if(candidateIds && candidateIds.length){
    openMasterlistSeparateConfirm(candidateIds);
  } else {
    finalizeMasterlistUpload();
  }
}

/* Task A fix: Master List uploads no longer auto-mark missing employees as separated.
   Instead they land here for HR to review and explicitly confirm or reject. */
function openMasterlistSeparateConfirm(ids){
  ui.modal = {type:'confirmMasterlistSeparations', arg:{ids}};
  render();
}
function toggleMlSepRow(id){
  const chk = document.querySelector(`.mlSepChk[value="${id}"]`);
  const row = document.querySelector(`.mlSepFields[data-for="${id}"]`);
  if(!chk || !row) return;
  row.style.opacity = chk.checked ? '1' : '0.35';
  row.querySelectorAll('input,select').forEach(el=> el.disabled = !chk.checked);
}
async function confirmMasterlistSeparations(){
  const P = MASTERLIST_PENDING;
  if(!P){ closeModal(); return; }
  const {asOfMonth} = P;
  const checkedBoxes = Array.from(document.querySelectorAll('.mlSepChk:checked'));
  if(!checkedBoxes.length){ toast('Nothing is checked — use "Keep All Active" instead if that\'s what you mean.'); return; }
  const updates = [];
  let missing = 0;
  checkedBoxes.forEach(chk=>{
    const id = chk.value;
    const dateEl = document.querySelector(`.mlSepDate[data-id="${id}"]`);
    const reasonEl = document.querySelector(`.mlSepReason[data-id="${id}"]`);
    const remarksEl = document.querySelector(`.mlSepRemarks[data-id="${id}"]`);
    const date = dateEl ? dateEl.value : '';
    const reason = reasonEl ? reasonEl.value : '';
    const remarks = remarksEl ? remarksEl.value.trim() : '';
    if(!date || !reason){ missing++; return; }
    updates.push({id, date, reason, remarks});
  });
  if(missing){ toast(`Please provide a Date Separated and a Reason for every checked employee (${missing} still need it).`); return; }
  let count=0;
  updates.forEach(u=>{
    const emp = P.working.find(e=> String(e.employeeId)===String(u.id));
    if(emp){
      emp.dateSeparated = u.date;
      // The Date Separated stays exactly as entered above; the month this separation is
      // *counted* under is the Master List's as-of-month (the month it was tagged/uploaded),
      // not whatever month the Date Separated itself falls in.
      emp.separationTagMonth = asOfMonth;
      // The headcount decrease lands in this month and nowhere else: they stay counted in every
      // month up to it, even if the Date Separated entered above falls further back.
      closeRosterSpan(emp, asOfMonth);
      emp.separationReason = u.reason;
      // Remarks are HR's own words — filled in when they have something to add, but never
      // required to confirm a separation (task B).
      emp.separationRemarks = u.remarks || '';
      count++;
    }
  });
  P.meta.separated = count;
  // Explicitly resolved — clear the modal directly rather than via closeModal(), which would
  // otherwise mistake this for an abandoned upload and cancel the whole staged upload.
  ui.modal = null;
  finalizeMasterlistUpload();
}
function skipMasterlistSeparations(){
  ui.modal = null;
  finalizeMasterlistUpload();
}

/* The single commit point for a Master List upload. Only reached once every required review
   step has been explicitly resolved (or there was nothing to review in the first place) — this
   is the ONLY place a Master List upload writes to the real employee records / storage. */
async function finalizeMasterlistUpload(){
  const P = MASTERLIST_PENDING;
  if(!P){ render(); return; }
  const {company, status, asOfMonth, isBaselineUpload, alreadyUploaded, rowCount, meta} = P;
  EMP = P.working;
  await saveEmp();
  await autoAssignPositionJobGrades(company, status);
  if(isBaselineUpload && meta.baselineAdded){
    const existing = CONFIG.companyBaselineMonth[company];
    if(!existing || asOfMonth < existing){
      CONFIG.companyBaselineMonth[company] = asOfMonth;
      await saveConfig();
    }
  }
  await recordUpload(company, status, asOfMonth, rowCount);
  const unmapped = unmappedCostCentersForCompany(company);
  const gradeConflicts = distinctPositions(company, status).filter(p=> positionJobGradeGroupsObserved(company, status, p).length>1);
  let summary = `${monthLabel(asOfMonth)} for ${company} (${status}): ${meta.updated} updated`;
  if(alreadyUploaded) summary = `Re-upload — a Master List for ${monthLabel(asOfMonth)} was already on record. ` + summary;
  if(meta.baselineAdded) summary += `, ${meta.baselineAdded} record(s) added as the starting baseline roster (not counted as New Hires)`;
  if(meta.newHires) summary += `, ${meta.newHires} new hire(s) counted for ${monthLabel(asOfMonth)}`;
  if(meta.addedNotCounted) summary += `, ${meta.addedNotCounted} record(s) added without counting as a New Hire`;
  if(meta.rehired) summary += `, ${meta.rehired} rehire(s)`;
  if(meta.promoted) summary += `, ${meta.promoted} promotion(s) recorded`;
  if(meta.changed) summary += `, ${meta.changed} position/grade change(s) logged (not counted as promotions)`;
  if(meta.separated) summary += `, ${meta.separated} separation(s) recorded`;
  if(meta.skippedOtherCompany) summary += `, ${meta.skippedOtherCompany} row(s) skipped (that ID already belongs to a different company — check for ID collisions)`;
  summary += '.';
  if(unmapped.length) summary += ` ${unmapped.length} cost center(s) for ${company} need a department — assign them in the Control Panel.`;
  if(gradeConflicts.length) summary += ` ${gradeConflicts.length} position(s) have employees on different Job Grades that fall into different Job Grade Groups — resolve these manually in the Control Panel.`;
  const msgEl = document.getElementById('cuMsg');
  if(msgEl) msgEl.textContent = summary;
  toast('Master List upload saved — ' + company + '.');
  MASTERLIST_PENDING = null;
  render();
}
// Called when a Master List review step is abandoned instead of resolved (backdrop click while
// a confirmMasterlistNewHires / confirmMasterlistPromotions / confirmMasterlistSeparations modal
// is open — see closeModal()). The entire staged upload is thrown away; NOTHING from the file is

/* Generic file -> rows (array of arrays), supports .csv and .xlsx/.xls via SheetJS */
function fileToRows(file){
  return new Promise((resolve, reject)=>{
    const name = file.name.toLowerCase();
    if(name.endsWith('.csv')){
      const reader = new FileReader();
      reader.onload = ()=> resolve(parseCSV(reader.result));
      reader.onerror = reject;
      reader.readAsText(file);
    } else {
      if(typeof XLSX === 'undefined'){ reject(new Error('Excel reader did not load — try uploading a .csv instead.')); return; }
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const wb = XLSX.read(new Uint8Array(reader.result), {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
          resolve(rows.filter(r=> r.some(x=> String(x).trim()!=='')));
        }catch(err){ reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    }
  });
}

function normGender(s){
  s = (s||'').trim();
  if(!s) return '';
  const l = s.toLowerCase();
  if(l.startsWith('m')) return 'Male';
  if(l.startsWith('f')) return 'Female';
  return 'Other';
}

/* Stages a Master List upload into MASTERLIST_PENDING — a private working copy of the employee
   list — WITHOUT touching the real EMP array or storage. Nothing from this file is committed
   until every required review step (New Hire, Promotion, Separation — whichever apply) has been
   explicitly resolved; see finalizeMasterlistUpload(). If a review step is abandoned instead
   (e.g. the modal backdrop is clicked), cancelMasterlistUpload() discards this entire staged
   upload, so a file is never partially saved. */
async function runCompanyUpload({file, company, status, asOfMonth}){
  const setMsg = t => { const el = document.getElementById('cuMsg'); if(el) el.textContent = t; };
  const {start:moStart} = monthBounds(asOfMonth);
  let rows;
  try{ rows = await fileToRows(file); }
  catch(err){ setMsg('Could not read that file: ' + err.message); return; }
  if(rows.length<2){ setMsg('File appears empty.'); return; }
  const headers = rows[0].map(h=> String(h).trim().toLowerCase());
  const idx = (...candidates) => headers.findIndex(h=> candidates.some(name=>
    name==='id' ? h.split(/\s+/).some(tok=> tok.startsWith('id')) : h.includes(name)
  ));
  const map = {
    costCenter: idx('cost cent','costcenter'), employeeId: idx('id'), lastName: idx('last'),
    firstName: idx('first'), middleName: idx('middle'), gender: idx('gender'), position: idx('position'),
    jobGrade: idx('grade','level'), birthdate: idx('birth','dob'), dateHired: idx('hire')
  };

  // Task A: a Master List upload should never silently inflate "New Hire" counts. The very
  // first time a given company+status group is uploaded, there's nothing on file yet to compare
  // against — that file is establishing the starting baseline roster, not reporting hires, so
  // everyone in it is added as active but excluded from New Hire stats entirely. On every later
  // upload, any ID that isn't already anywhere in the system gets staged below for HR to confirm,
  // one by one, whether it's a genuine New Hire (counted) or someone who simply wasn't on file
  // yet (added, but not counted).
  const isBaselineUpload = !EMP.some(e=> e.company===company && e.employmentStatus===status);

  // Snapshot of who this group considered active BEFORE this upload.
  const previousActiveIds = new Set(EMP.filter(e=> e.company===company && e.employmentStatus===status && !e.dateSeparated).map(e=> String(e.employeeId)));
  const fileIds = new Set();

  // Everything below is applied to `working` — a deep, private clone of the employee list — and
  // NEVER to the real EMP array or storage. It only becomes real via finalizeMasterlistUpload().
  const working = JSON.parse(JSON.stringify(EMP));

  let updated=0, rehired=0, baselineAdded=0, skippedOtherCompany=0;
  const pendingNewHireRows = [];
  const pendingPromotionRows = [];
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    const get = k => map[k]>=0 ? String(row[map[k]]===undefined?'':row[map[k]]).trim() : '';
    const id = get('employeeId');
    if(!id) continue;
    const exists = working.findIndex(e=> String(e.employeeId)===String(id));
    // Guard: if this ID already belongs to a *different* company on file, don't silently
    // reassign them here — that's almost always an ID collision between companies rather
    // than a genuine transfer, so skip it and flag it instead of overwriting their record.
    if(exists>=0 && working[exists].company && working[exists].company!==company){
      skippedOtherCompany++;
      continue;
    }
    fileIds.add(String(id));
    if(exists>=0){
      const wasSeparated = !!working[exists].dateSeparated;
      const priorSpans = rosterSpansOf(working[exists]).map(sp=>({...sp}));
      // A manually-assigned department (departmentOverride) is meant to survive month-to-month
      // re-uploads — the spread below already carries it forward. It's only dropped when this
      // file actually moves the person to a *different* cost center, since that's a real
      // reorganization and the department should go back to following the cost-center mapping.
      const prevCC = (working[exists].costCenter||'').trim();
      const fileCC = get('costCenter').trim();
      const ccMoved = !!fileCC && !!prevCC && fileCC !== prevCC;
      // Task: Promotion review — same treatment as New Hire & Separated. Capture what was on
      // file (i.e. from the most recently uploaded Master List) BEFORE this file overwrites it,
      // so a change in Position and/or Job Grade for someone who was already active gets staged
      // for HR to classify afterward, rather than silently overwritten with no record of whether
      // it was a promotion or just a correction/reclassification. Rehires are excluded — their
      // pre-separation role isn't a meaningful "previous month" to compare against.
      const prevPosition = (working[exists].position||'').trim();
      const prevJobGrade = (working[exists].jobGrade||'').trim();
      working[exists] = {...working[exists], rosterSpans: priorSpans,
        lastName:get('lastName'), firstName:get('firstName'), middleName:get('middleName'),
        company, industry:industryOf(company), costCenter:get('costCenter'),
        gender: get('gender') ? normGender(get('gender')) : (working[exists].gender || ''),
        position:get('position'), jobGrade:get('jobGrade'), birthdate: normalizeDateInput(get('birthdate')) || working[exists].birthdate || '',
        employmentStatus:status, dateHired: normalizeDateInput(get('dateHired')) || working[exists].dateHired || fmtDate(moStart),
        dateSeparated:'', separationTagMonth:'', separationReason:'', separationRemarks:''
      };
      if(ccMoved) delete working[exists].departmentOverride;
      recordJobGradeSnapshot(working[exists], asOfMonth, get('jobGrade'));
      // A rehire re-enters the reported roster in THIS month only — the months they were away
      // stay exactly as they were reported, and their earlier separation keeps its own closed
      // span. Someone who was already active simply keeps the span they already had, so a
      // refresh of their details can't move them into or out of any month.
      if(wasSeparated) openRosterSpan(working[exists], asOfMonth);
      if(wasSeparated) rehired++; else updated++;
      const newPosition = get('position').trim();
      const newJobGrade = get('jobGrade').trim();
      if(!wasSeparated && prevPosition && prevJobGrade && newPosition && newJobGrade && (newPosition!==prevPosition || newJobGrade!==prevJobGrade)){
        pendingPromotionRows.push({employeeId:id, lastName:get('lastName'), firstName:get('firstName'),
          prevPosition, prevJobGrade, newPosition, newJobGrade});
      }
    } else if(isBaselineUpload){
      // First-ever file for this company+status: this is the starting baseline, so add
      // everyone as active but explicitly exclude them from New Hire counts (Overview,
      // Company Detail "New Hire", Recruitment Cost, trends) via excludeFromHireCount.
      const fileHireDate = normalizeDateInput(get('dateHired'));
      const dateHired = fileHireDate || fmtDate(moStart);
      working.push({
        employeeId:id, lastName:get('lastName'), firstName:get('firstName'), middleName:get('middleName'),
        company, industry:industryOf(company), department:'', costCenter:get('costCenter'),
        gender: normGender(get('gender')),
        position:get('position'), jobGrade:get('jobGrade'), birthdate: normalizeDateInput(get('birthdate')),
        employmentStatus:status, dateHired, hireTagMonth:'', excludeFromHireCount:true, dateSeparated:'',
        // The baseline roster starts counting from the month it was uploaded, however far back
        // the individual Date Hired values go — it never back-fills months that predate it.
        rosterSpans:[{start:asOfMonth, end:''}],
        separationReason:'', separationRemarks:''
      });
      recordJobGradeSnapshot(working[working.length-1], asOfMonth, get('jobGrade'));
      baselineAdded++;
    } else {
      // Not a baseline upload, and this ID isn't anywhere in the system yet — don't assume
      // it's a New Hire. Stage it and ask HR right after this upload finishes.
      const fileHireDate = normalizeDateInput(get('dateHired'));
      pendingNewHireRows.push({
        employeeId:id, lastName:get('lastName'), firstName:get('firstName'), middleName:get('middleName'),
        gender: normGender(get('gender')), position:get('position'), jobGrade:get('jobGrade'), birthdate: normalizeDateInput(get('birthdate')),
        costCenter:get('costCenter'), dateHired: fileHireDate || fmtDate(moStart)
      });
    }
  }

  // Anyone previously active for this company+status but missing from this upload is only a
  // *candidate* for separation now — nothing is auto-applied. The admin reviews and must supply
  // a Date Separated and Reason for each one they confirm (task C), so an incomplete or
  // out-of-order file can never silently wipe people off the Active Roster without a record.
  const candidates = working.filter(e=> e.company===company && e.employmentStatus===status && previousActiveIds.has(String(e.employeeId)) && !fileIds.has(String(e.employeeId)));
  const candidateIds = candidates.map(c=>String(c.employeeId));

  // Nothing has been saved yet — stage the whole proposed change-set. It only reaches storage
  // once every required review step below has been explicitly resolved (finalizeMasterlistUpload).
  MASTERLIST_PENDING = {
    company, status, asOfMonth, isBaselineUpload,
    alreadyUploaded: isMonthUploaded(company, status, asOfMonth),
    rowCount: Math.max(0, rows.length-1),
    working,
    meta: {updated, rehired, baselineAdded, skippedOtherCompany, newHires:0, addedNotCounted:0, promoted:0, changed:0, separated:0}
  };

  let staged = `${monthLabel(asOfMonth)} for ${company} (${status}): ${updated} updated, ${baselineAdded} baseline, ${rehired} rehire(s) staged — `;
  const needsReview = pendingNewHireRows.length || pendingPromotionRows.length || candidateIds.length;
  if(needsReview){
    staged += 'nothing is saved yet. ';
    if(pendingNewHireRows.length) staged += `${pendingNewHireRows.length} unrecognized ID(s) need your New Hire review. `;
    if(pendingPromotionRows.length) staged += `${pendingPromotionRows.length} employee(s) need a Promotion/Change classification. `;
    if(candidateIds.length) staged += `${candidateIds.length} previously-active employee(s) need a Separation review. `;
    staged += 'Nothing from this file is saved until every review below is completed.';
  } else {
    staged += 'no review needed, saving now…';
  }
  setMsg(staged);

  if(pendingNewHireRows.length){
    openMasterlistNewHireConfirm(pendingNewHireRows, pendingPromotionRows, candidateIds);
  } else if(pendingPromotionRows.length){
    openMasterlistPromotionConfirm(pendingPromotionRows, candidateIds);
  } else if(candidateIds.length){
    openMasterlistSeparateConfirm(candidateIds);
  } else {
    await finalizeMasterlistUpload();
  }
}

function downloadCompanyTemplate(){
  // Gender sits between Job Grade (position level) and Birthdate. Column order is cosmetic —
  // the upload matches columns by header name, so an older file in the previous order still works.
  const headers = ['Cost Center','ID #','Last Name','First Name','Middle Name','Position','Job Grade','Gender','Birthdate','Date Hired'];
  const sample = ['CC-101','10023','Dela Cruz','Juan','Santos','Site Engineer','Grade 7','Male','08/22/1996','04/15/2023'];
  if(typeof XLSX !== 'undefined'){
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([headers, sample]);
    XLSX.utils.book_append_sheet(wb, ws, 'Master File');
    XLSX.writeFile(wb, 'company_master_file_template.xlsx');
  } else {
    downloadCSV([headers, sample], 'company_master_file_template.csv');
  }
}

/* CSV parsing */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){}
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=> r.some(x=>x!==''));
}
function normStatus(s){
  s = (s||'').toLowerCase();
  if(s.includes('intern') || s.includes('ojt')) return 'Intern/OJT';
  if(s.includes('rank')) return 'Rank & File';
  if(s.includes('staff')) return 'Staff';
  return s ? s : 'Staff';
}
function handleUpload(){
  const input = document.getElementById('csvFile');
  const msg = document.getElementById('uploadMsg');
  if(!input.files.length){ msg.textContent = 'Choose a CSV file first.'; return; }
  const reader = new FileReader();
  reader.onload = async ()=>{
    const rows = parseCSV(reader.result);
    if(rows.length<2){ msg.textContent = 'File appears empty.'; return; }
    const headers = rows[0].map(h=>h.trim().toLowerCase());
    const idx = (...candidates) => headers.findIndex(h=> candidates.some(name=>
      name==='id' ? h.split(/\s+/).some(tok=> tok.startsWith('id')) : h.includes(name)
    ));
    const map = {
      industry: idx('industry'), company: idx('company'), department: idx('depart'),
      costCenter: idx('cost cent','costcenter'), employeeId: idx('id'), lastName: idx('last'), firstName: idx('first'),
      middleName: idx('middle'), gender: idx('gender'), position: idx('position'), jobGrade: idx('grade','level'), birthdate: idx('birth','dob'),
      dateHired: idx('hire'), employmentStatus: idx('status'), dateSeparated: idx('separat'),
      separationReason: idx('reason'), separationRemarks: idx('remark'), reportingMonth: idx('separation reporting month','sep reporting month'), hireReportingMonth: idx('hire reporting month','hire tag month')
    };
    let newHires=0, updated=0, separated=0;
    const touchedGroups = new Set(); // `${company}|${status}` pairs seen, so grades can be auto-assigned after
    for(let r=1;r<rows.length;r++){
      const row = rows[r];
      const get = k => map[k]>=0 ? (row[map[k]]||'').trim() : '';
      const id = get('employeeId');
      if(!id) continue;
      const exists = EMP.findIndex(e=> String(e.employeeId)===String(id));
      const dateHired = normalizeDateInput(get('dateHired'));
      const dateSeparated = normalizeDateInput(get('dateSeparated'));

      // Reporting month for a HIRE (task B): a brand-new ID gets tagged fresh — to the optional
      // Hire Reporting Month column if given, otherwise to the moment this file is imported —
      // never derived from Date Hired itself. Editing an existing record preserves whatever hire
      // tag it already had, so correcting an unrelated field doesn't silently re-bucket their hire.
      const hireTagMonth = exists>=0 ? (EMP[exists].hireTagMonth || '') : (normalizeMonthInput(get('hireReportingMonth')) || monthStr(new Date()));

      // The Date Separated column stays exactly as provided — the *reporting* month comes from
      // the optional Separation Reporting Month column if given, else the moment of this import,
      // and is only re-tagged when the Date Separated value itself is new or has actually changed.
      let separationTagMonth = '';
      if(dateSeparated){
        const unchanged = exists>=0 && EMP[exists].dateSeparated===dateSeparated && EMP[exists].separationTagMonth;
        separationTagMonth = unchanged ? EMP[exists].separationTagMonth : (normalizeMonthInput(get('reportingMonth')) || monthStr(new Date()));
      }

      const emp = {
        employeeId:id, lastName:get('lastName'), firstName:get('firstName'), middleName:get('middleName'),
        company:get('company'), industry:get('industry')||industryOf(get('company')), department:get('department'),
        costCenter:get('costCenter'), gender:normGender(get('gender')), position:get('position'), jobGrade:get('jobGrade'), birthdate: normalizeDateInput(get('birthdate')),
        employmentStatus:normStatus(get('employmentStatus')), dateHired, hireTagMonth, dateSeparated,
        separationTagMonth,
        separationReason:get('separationReason'), separationRemarks:get('separationRemarks'),
        // Updating an existing record must not rebuild their roster history from scratch — carry
        // whatever months they were already reported under, then apply this file's change.
        rosterSpans: exists>=0 ? rosterSpansOf(EMP[exists]).map(sp=>({...sp})) : [],
        jobGradeHistory: exists>=0 ? (EMP[exists].jobGradeHistory||[]).slice() : []
      };
      syncRosterSpanFromRecord(emp);
      if(exists>=0){ EMP[exists] = emp; updated++; } else { EMP.push(emp); newHires++; }
      recordJobGradeSnapshot(emp, monthStr(new Date()), emp.jobGrade);
      if(emp.dateSeparated) separated++;
      if(emp.company && emp.employmentStatus) touchedGroups.add(emp.company+'|'+emp.employmentStatus);
    }
    await saveEmp();
    for(const key of touchedGroups){
      const [tCompany, tStatus] = key.split('|');
      await autoAssignPositionJobGrades(tCompany, tStatus);
    }
    const unmapped = unmappedCostCenters();
    msg.textContent = `Import complete: ${newHires} new hire(s) added to the Active Roster, ${updated} existing record(s) updated (${separated} of those marked separated).` + (unmapped ? ` ${unmapped} cost center(s) across your companies need a department — assign them in the Control Panel.` : '');
    toast('New Hire & Separated Import complete — Active Roster updated.');
    render();
  };
  reader.readAsText(input.files[0]);
}
function downloadTemplate(){
  const headers = ['Industry','Company','Department','Cost Center','ID #','Last Name','First Name','Middle Name','Gender','Position','Job Grade','Birthdate','Date Hired','Employment Status','Date Separated','Separation Reason','Separation Remarks','Hire Reporting Month','Separation Reporting Month'];
  const newHireExample = ['Industry I','Company A','Operations','CC-101','10023-EXAMPLE-DELETE','Dela Cruz','Juan','Santos','Male','Site Engineer','Grade 7','05/09/1997','07/15/2026','Staff','','','','2026-07',''];

function downloadCSV(rows, filename){
  const csv = rows.map(r=> r.map(v=>{
    v = (v===undefined||v===null) ? '' : String(v);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

/* Task A: Age/Tenure/Job Grade ranges should be pickable from actual values seen in uploaded
   data, not typed blind. These compute the distinct values currently on file. */
function distinctAges(){
  const now = new Date();
  return Array.from(new Set(EMP.map(e=> ageYears(e, now)).filter(n=> n!==null && n>=0))).sort((a,b)=>a-b);
}
function distinctTenureYears(){
  const now = new Date();
  const vals = EMP.map(e=>{
    const t = tenureYears(e, now);
    return (t===null || isNaN(t)) ? null : Math.round(t*10)/10;
  }).filter(v=> v!==null && v>=0);
  return Array.from(new Set(vals)).sort((a,b)=>a-b);
}
function distinctJobGrades(company, status){
  const vals = EMP.filter(e=> e.company===company && e.employmentStatus===status)
    .map(e=> jobGradeNumeric(e.jobGrade)).filter(v=> v!==null);
  return Array.from(new Set(vals)).sort((a,b)=>a-b);
}
// Renders a dropdown of real observed values when available (falling back to the current value
// if it isn't in the list, so nothing already saved gets silently lost), or a plain number input
// when no data has been uploaded yet to populate options from.
function rangeValueInput(val, options, onchangeAttr){
  if(!options || !options.length){
    return `<input type="number" step="0.1" value="${val}" style="width:90px;" onchange="${onchangeAttr}">`;
  }
  const numVal = Number(val);
  const values = options.includes(numVal) ? options : [...options, numVal].sort((a,b)=>a-b);
  return `<select style="min-width:90px;" onchange="${onchangeAttr}">${values.map(v=>`<option value="${v}" ${v===numVal?'selected':''}>${v}</option>`).join('')}</select>`;
}

function positionJobGradeEditor(company, status){
  const groups = jobGradeGroupsFor(company, status);
  const positions = distinctPositions(company, status);
  if(!groups.length) return `<div class="empty">Add at least one Job Grade Group above for ${company} · ${status} first.</div>`;
  if(!positions.length) return `<div class="empty">No ${status} positions on file yet for ${company} — upload a Master List first.</div>`;
  const withConflict = positions.filter(p=> positionJobGradeGroupsObserved(company, status, p).length>1);
  return `
  ${withConflict.length ? `<p class="hint" style="color:var(--red);">⚠ ${withConflict.length} position(s) below have employees on the current Master List whose Job Grades fall into <b>different</b> Job Grade Groups. Auto-assignment was skipped for these — pick the correct group manually.</p>` : ''}
  <table class="simple"><thead><tr><th>Position</th><th>Job Grade Group</th><th>Observed on Master List</th></tr></thead>
    <tbody>${positions.map(p=>{
      const current = positionJobGradeOf(company, status, p);
      const observed = positionJobGradeGroupsObserved(company, status, p);
      const conflict = observed.length>1;
      return `<tr${conflict?' style="background:rgba(194,59,65,.08);"':''}><td>${p}${conflict?' <span style="color:var(--red);font-size:11px;" title="Different employees under this position have Job Grades that map to different groups — resolve manually.">⚠ needs review</span>':''}</td><td>
        <select onchange="setPositionJobGrade('${company.replace(/'/g,"\\'")}','${status.replace(/'/g,"\\'")}','${p.replace(/'/g,"\\'")}', this.value)">
          <option value="" ${!current?'selected':''}>Unclassified</option>
          ${groups.map(g=>`<option value="${g.label}" ${g.label===current?'selected':''}>${g.label}</option>`).join('')}
        </select>
      </td><td style="font-size:11.5px;color:var(--dim);">${observed.join(', ') || '—'}</td></tr>`;
    }).join('')}</tbody>
  </table>`;
}

  if(v<MIN_YEAR){ toast(`Years before ${MIN_YEAR} aren't supported.`); return; }
  CONFIG.extraUploadYears = CONFIG.extraUploadYears || [];
  if(!CONFIG.extraUploadYears.includes(v)) CONFIG.extraUploadYears.push(v);
  CONFIG.extraUploadYears.sort((a,b)=>a-b);

}

async function addDepartment(){
  const company = ui.ccDeptCompany;
  const v = document.getElementById('newDept').value.trim();
  if(!v || !company) return;
  CONFIG.departments = CONFIG.departments || {};
  CONFIG.departments[company] = CONFIG.departments[company] || [];
  if(!CONFIG.departments[company].includes(v)){ CONFIG.departments[company].push(v); CONFIG.departments[company].sort(); }
  await saveConfig(); render();
}
async function removeDepartment(company, i){
  CONFIG.departments = CONFIG.departments || {};
  const list = CONFIG.departments[company] || [];
  const removed = list[i];
  if(removed===undefined) return;
  list.splice(i,1);
  Object.keys(CONFIG.costCenterDepartment).forEach(key=>{
    if(key.indexOf(company+'|')===0 && CONFIG.costCenterDepartment[key]===removed) delete CONFIG.costCenterDepartment[key];
  });
  EMP.forEach(e=>{ if(e.company===company && e.departmentOverride===removed) delete e.departmentOverride; });
  await saveConfig(); await saveEmp(); render();
}
async function setCostCenterDept(company, cc, dept){
  const key = ccdKey(company, cc);
  if(dept) CONFIG.costCenterDepartment[key] = dept; else delete CONFIG.costCenterDepartment[key];
  await saveConfig();
  toast(`${company} · ${cc} → ${dept || 'Unassigned'}`);
  render();
}

function openModal(type, arg){ ui.modal = {type, arg}; render(); }
function closeModal(){
  // A Master List review step (New Hire / Promotion / Separation) has no plain "Cancel" — only
  // explicit resolution buttons — because the whole staged upload (see MASTERLIST_PENDING) is
  // still unsaved at this point. If it's dismissed some other way (backdrop click), treat that
  // as abandoning the upload rather than silently closing the modal on top of a saved partial
  // upload: throw the whole staged change-set away instead.
  if(ui.modal && MASTERLIST_PENDING && ['confirmMasterlistNewHires','confirmMasterlistPromotions','confirmMasterlistSeparations'].includes(ui.modal.type)){
    cancelMasterlistUpload();
    return;
  }
  ui.modal = null; render();
}

    <div class="archive-table-wrap" style="max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;">
      <table class="simple">
        <tbody>${list.map(e=>`<tr><td class="ctr" style="width:20%;">${e.employeeId||''}</td><td>${e.lastName||''}, ${e.firstName||''}</td><td>${e.company||''}</td></tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="field" style="margin-top:12px;"><label>TYPE "DELETE" TO CONFIRM</label><input type="text" id="delListConfirm" placeholder="DELETE"></div>
    <div style="margin-top:16px;"><button class="btn danger" onclick="confirmDeleteArchiveList()">Delete ${kindLabel} List</button> <button class="btn" onclick="closeModal()">Cancel</button></div>`;
  } else if(ui.modal.type==='editEmployee'){
    const emp = EMP.find(e=> String(e.employeeId)===String(ui.modal.arg));
    if(!emp){
      body = `<h3>Edit Record</h3><p class="hint">Record not found — it may have already been deleted.</p><div style="margin-top:14px;"><button class="btn" onclick="closeModal()">Close</button></div>`;
    } else {
      const companies = allCompanies().map(c=>c.company);
      const ccs = costCentersForCompany(emp.company);
      body = `<h3>Edit Employee Record</h3>
      <p class="hint">ID ${emp.employeeId} — fixed here since it's this record's key.</p>
      <div class="field-row">
        <div class="field"><label>LAST NAME</label><input type="text" id="em_last" value="${emp.lastName||''}"></div>
        <div class="field"><label>FIRST NAME</label><input type="text" id="em_first" value="${emp.firstName||''}"></div>
        <div class="field"><label>MIDDLE NAME</label><input type="text" id="em_middle" value="${emp.middleName||''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>COMPANY</label><select id="em_company">${companies.map(c=>`<option ${c===emp.company?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label>COST CENTER</label>
          <select id="em_cc" onchange="toggleCCNewGeneric('em_cc','em_cc_new')">
            <option value="" ${!emp.costCenter?'selected':''}>Unassigned</option>
            ${ccs.map(cc=>`<option ${cc===emp.costCenter?'selected':''}>${cc}</option>`).join('')}
            <option value="__new__">+ New cost center…</option>
          </select>
          <input type="text" id="em_cc_new" placeholder="New cost center code" style="display:none;margin-top:6px;">
        </div>
        <div class="field"><label>POSITION</label><input type="text" id="em_pos" value="${emp.position||''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>JOB GRADE</label><input type="text" id="em_grade" value="${emp.jobGrade||''}"></div>
        <div class="field"><label>BIRTHDATE${emp.birthdate && ageYears(emp,new Date())!==null ? ` <span style="font-weight:400;text-transform:none;color:var(--dim2);">(age ${ageYears(emp,new Date())})</span>` : ''}</label><input type="date" id="em_birthdate" value="${emp.birthdate||''}"></div>
        <div class="field"><label>GENDER</label><select id="em_gender">
          <option value="" ${!emp.gender?'selected':''}>Unspecified</option>
          <option ${emp.gender==='Male'?'selected':''}>Male</option>
          <option ${emp.gender==='Female'?'selected':''}>Female</option>
          <option ${emp.gender==='Other'?'selected':''}>Other</option>
        </select></div>
        <div class="field"><label>STATUS</label><select id="em_status">${CONFIG.statuses.map(s=>`<option ${s===emp.employmentStatus?'selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>DATE HIRED</label><input type="date" id="em_hired" value="${emp.dateHired||''}"></div>
        <div class="field"><label>HIRE REPORTING MONTH</label><input type="month" id="em_hireTagMonth" value="${hireTagMonthOf(emp)||''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>DATE SEPARATED</label><input type="date" id="em_sepDate" value="${emp.dateSeparated||''}"></div>
        <div class="field"><label>SEPARATION REPORTING MONTH</label><input type="month" id="em_tagMonth" value="${separationTagMonthOf(emp)||''}"></div>
      </div>
      <div class="field-row">
        <div class="field" style="flex:1;"><label>SEPARATION REASON</label><select id="em_sepReason"><option value="">None</option>${CONFIG.separationReasons.map(r=>`<option ${r===emp.separationReason?'selected':''}>${r}</option>`).join('')}</select></div>
        <div class="field" style="flex:2;"><label>REMARKS</label><input type="text" id="em_sepRemarks" value="${emp.separationRemarks||''}" style="width:100%;"></div>
      </div>
      <p class="hint">Clear Date Separated to move this person back onto the Active Roster. Reporting Months control which month each event is counted under (Overview, Company Detail, Archive) — independent of the actual dates above.</p>
      <div style="margin-top:16px;"><button class="btn primary" onclick="confirmEditEmployee()">Save Changes</button> <button class="btn" onclick="closeModal()">Cancel</button></div>`;
    }
  } else if(ui.modal.type==='addArchiveRecord'){
    const companies = allCompanies().map(c=>c.company);
    const defaultCompany = companies[0] || '';
    const ccs = costCentersForCompany(defaultCompany);
    body = `<h3>Hire &amp; Separation Quick Add</h3>
    <p class="hint">Add a new hire, or add a historical/corrected record — including one that's already separated — directly.</p>
    <div class="field-row">
      <div class="field"><label>EMPLOYEE ID</label><input type="text" id="ar_id"></div>
      <div class="field"><label>LAST NAME</label><input type="text" id="ar_last"></div>
      <div class="field"><label>FIRST NAME</label><input type="text" id="ar_first"></div>
      <div class="field"><label>MIDDLE NAME</label><input type="text" id="ar_middle"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>COMPANY</label><select id="ar_company" onchange="updateArchiveAddCC()">${companies.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="field"><label>COST CENTER</label>
        <select id="ar_cc" onchange="toggleCCNewGeneric('ar_cc','ar_cc_new')">
          <option value="">Unassigned</option>
          ${ccs.map(cc=>`<option>${cc}</option>`).join('')}
          <option value="__new__">+ New cost center…</option>
        </select>
        <input type="text" id="ar_cc_new" placeholder="New cost center code" style="display:none;margin-top:6px;">
      </div>
      <div class="field"><label>POSITION</label><input type="text" id="ar_pos"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>JOB GRADE</label><input type="text" id="ar_grade" placeholder="e.g. Grade 7"></div>
      <div class="field"><label>BIRTHDATE</label><input type="date" id="ar_birthdate"></div>
      <div class="field"><label>GENDER</label><select id="ar_gender"><option value="">Unspecified</option><option>Male</option><option>Female</option><option>Other</option></select></div>
      <div class="field"><label>STATUS</label><select id="ar_status">${CONFIG.statuses.map(s=>`<option>${s}</option>`).join('')}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>DATE HIRED</label><input type="date" id="ar_hired" value="${fmtDate(new Date())}"></div>
      <div class="field"><label>HIRE REPORTING MONTH</label><input type="month" id="ar_hireTagMonth" value="${monthStr(new Date())}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>DATE SEPARATED <span style="font-weight:400;text-transform:none;font-family:var(--sans);color:var(--dim2);">(leave blank for an active hire)</span></label><input type="date" id="ar_sepDate"></div>
      <div class="field"><label>SEPARATION REPORTING MONTH</label><input type="month" id="ar_tagMonth" value="${monthStr(new Date())}"></div>
    </div>
    <div class="field-row">
      <div class="field" style="flex:1;"><label>SEPARATION REASON</label><select id="ar_sepReason"><option value="">None</option>${CONFIG.separationReasons.map(r=>`<option>${r}</option>`).join('')}</select></div>
      <div class="field" style="flex:2;"><label>REMARKS</label><input type="text" id="ar_sepRemarks" style="width:100%;"></div>
    </div>
    <div id="arAddMsg" class="hint"></div>
    <div style="margin-top:16px;"><button class="btn primary" onclick="confirmAddArchiveRecord()">Add Record</button> <button class="btn" onclick="closeModal()">Cancel</button></div>`;
  }
  const wide = (ui.modal.type==='editEmployee' || ui.modal.type==='addArchiveRecord' || ui.modal.type==='confirmMasterlistNewHires' || ui.modal.type==='confirmMasterlistPromotions' || ui.modal.type==='deleteArchiveList') ? 'width:640px;' : '';
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal" style="${wide}">${body}</div></div>`;
  document.getElementById('app').appendChild(wrap.firstElementChild);
}
async function confirmAddIndustry(){
  const v = document.getElementById('m_name').value.trim();
  if(v){ CONFIG.industries.push({name:v, companies:[]}); await saveConfig(); }
  closeModal();
}
async function confirmAddCompany(i){
  const v = document.getElementById('m_name').value.trim();
  if(v){ CONFIG.industries[i].companies.push(v); await saveConfig(); }
  closeModal();
}

/* ============ INIT ============ */
loadAll();
</script>
</body>
</html>
