<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employee Demographics — PGB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#F3F5FA;
    --surface:#FFFFFF;
    --surface2:#EEF1F7;
    --surface3:#E3E8F1;
    --border:#D9DFEA;
    --text:#1A2036;
    --dim:#565F76;
    --dim2:#838BA0;
    --gold:#9C6B14;
    --gold-dim:#C9A24B;
    --blue:#2F5FAE;
    --teal:#1A8A7D;
    --violet:#6B4FAE;
    --green:#22884F;
    --red:#C23B41;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  ::selection{background:var(--gold-dim);color:#1A2036;}
  a{color:var(--gold);}
  html,body{height:100%;}
  .shell{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:222px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
    padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
  .sidebar .brand{padding:4px 10px 20px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .sidebar .brand .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;}
  .sidebar .brand h1{font-family:var(--serif);font-weight:400;font-size:19px;margin:4px 0 0;letter-spacing:.2px;}
  .sidebar nav{display:flex;flex-direction:column;gap:2px;}
  .sidebar .navitem{padding:10px 12px;border-radius:7px;font-size:13.5px;color:var(--dim);cursor:pointer;
    display:flex;align-items:center;gap:10px;border-left:2px solid transparent;user-select:none;}
  .sidebar .navitem .dot{width:6px;height:6px;border-radius:50%;background:var(--dim2);flex-shrink:0;}
  .sidebar .navitem:hover{color:var(--text);background:var(--surface2);}
  .sidebar .navitem.active{color:var(--gold);background:var(--surface2);border-left-color:var(--gold);}
  .sidebar .navitem.active .dot{background:var(--gold);}
  .sidebar .foot{margin-top:auto;padding:14px 10px 4px;font-size:10.5px;color:var(--dim2);border-top:1px solid var(--border);}

  /* Main */
  .main{flex:1;min-width:0;padding:26px 40px 90px;max-width:1180px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
  .topbar h2.page-title{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;}
  .topbar .sub{color:var(--dim);font-size:12.5px;margin-top:4px;}
  .head-controls{display:flex;gap:10px;align-items:center;}
  select, input[type=text], input[type=number], input[type=date], input[type=password]{
    background:var(--surface2);border:1px solid var(--border);color:var(--text);
    padding:9px 12px;border-radius:6px;font-family:var(--sans);font-size:13px;
  }
  select:focus, input:focus{outline:1px solid var(--gold);}

  /* Cards */
  .grid{display:grid;gap:16px;}
  .cards5{grid-template-columns:repeat(5,1fr);}
  .cards4{grid-template-columns:repeat(4,1fr);}
  .cards3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:1100px){.cards5{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:900px){.cards4,.cards3{grid-template-columns:repeat(2,1fr);}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .card .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
  .card .value{font-family:var(--mono);font-size:28px;color:var(--text);}
  .card .value.green{color:var(--green);}
  .card .value.red{color:var(--red);}
  .card .foot{font-size:11.5px;color:var(--dim2);margin-top:4px;}

  h2.section{font-family:var(--serif);font-weight:400;font-size:19px;margin:30px 0 14px;color:var(--text);}
  h2.section .n{color:var(--dim);font-family:var(--mono);font-size:12px;margin-left:8px;}

  /* Ribbons (signature element) */
  .ribbon-group{margin-bottom:18px;}
  .ribbon-group .ind-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--gold-dim);text-transform:uppercase;margin:14px 0 8px;}
  .ribbon-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;}
  .ribbon-row:hover .ribbon-name{color:var(--gold);}
  .ribbon-name{width:130px;flex-shrink:0;font-size:13.5px;}
  .ribbon-bar{flex:1;height:20px;border-radius:4px;overflow:hidden;display:flex;background:var(--surface2);}
  .ribbon-seg{height:100%;transition:width .4s;}
  .ribbon-total{width:60px;text-align:right;font-family:var(--mono);font-size:14px;flex-shrink:0;}
  .ribbon-rates{width:150px;flex-shrink:0;font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;}

  .legend{display:flex;gap:18px;margin:6px 0 4px;font-size:11.5px;color:var(--dim);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}

  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  table.demo th, table.demo td{border:1px solid var(--border);padding:8px 10px;text-align:center;}
  table.demo th{background:var(--surface2);font-weight:600;font-size:12px;color:var(--dim);}
  table.demo td.rowlabel, table.demo th.rowlabel{text-align:left;font-weight:600;}
  table.demo tr.total td{font-weight:700;background:var(--surface2);}
  table.demo tr.stathead td{background:var(--surface3);color:var(--text);font-weight:600;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;}
  table.simple{font-size:13px;}
  table.simple th, table.simple td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;}
  table.simple th{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);font-weight:500;}
  table.simple tr:hover td{background:var(--surface2);}
  /* Hire & Separation Archive — monthly tables: alternating row shading so a row is easy to
     track across many columns, plus per-column alignment (short/categorical values centered,
     free-text columns left) so values line up in a clean grid instead of all hugging the left
     edge regardless of content type. */
  table.archive-table{table-layout:fixed;}
  table.archive-table tbody tr:nth-child(even){background:var(--bg);}
  table.archive-table tbody tr:hover td{background:var(--surface2);}
  /* Every header stays single-line and ellipsizes instead of overflowing into the next column —
     with table-layout:fixed, a header label that can't wrap (e.g. "DEPARTMENT") would otherwise
     spill visually past its own column and overlap the next header. */
  table.archive-table th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  table.archive-table th.ctr, table.archive-table td.ctr{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  table.archive-table td.wrap{white-space:normal;}
  /* Name is the one column people actually need to read in full — never truncate it, and give
     it room to wrap onto a second line cleanly (rows grow taller, nothing overlaps) rather than
     clipping a name short. */
  table.archive-table td.namecell{white-space:normal;word-break:break-word;}
  .archive-table-wrap{overflow-x:auto;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-family:var(--mono);}
  .pill.staff{background:rgba(47,95,174,.14);color:var(--blue);}
  .pill.rankfile{background:rgba(26,138,125,.14);color:var(--teal);}
  .pill.intern{background:rgba(107,79,174,.14);color:var(--violet);}

  /* Buttons */
  .btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:6px;font-size:13px;cursor:pointer;}
  .btn:hover{border-color:var(--gold-dim);}
  .btn.primary{background:var(--gold);color:#FFFFFF;border-color:var(--gold);font-weight:600;}
  .btn.primary:hover{background:#82590E;}
  .btn.danger{border-color:var(--red);color:var(--red);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .row-actions button{margin-right:6px;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px;}

  /* AI Assistant — compact widget, lives in the topbar next to Year/Month */
  .panel .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .panel .panel-head h3{font-family:var(--serif);font-weight:400;font-size:17px;margin:0;}
  .field-row{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;color:var(--dim);font-family:var(--mono);letter-spacing:.05em;}

  /* Company subnav */
  .subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .subnav .item{padding:8px 14px;font-size:12.5px;border:1px solid var(--border);border-radius:20px;color:var(--dim);cursor:pointer;}
  .subnav .item:hover{color:var(--text);}
  .subnav .item.active{background:var(--gold);color:#FFFFFF;border-color:var(--gold);font-weight:600;}

  .empty{color:var(--dim2);text-align:center;padding:40px 0;font-size:13.5px;}
  .modal-bg{position:fixed;inset:0;background:rgba(6,9,16,.7);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px;width:480px;max-width:92vw;max-height:86vh;overflow:auto;}
  .modal h3{font-family:var(--serif);font-weight:400;margin-top:0;}
  .close-x{float:right;cursor:pointer;color:var(--dim);font-size:18px;}
  .hint{font-size:12px;color:var(--dim2);line-height:1.5;margin-top:6px;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--surface3);border:1px solid var(--gold);color:var(--text);padding:12px 18px;border-radius:8px;font-size:13px;z-index:60;}
  .bar-mini{display:flex;align-items:flex-end;gap:4px;height:60px;}
  .bar-mini .b{flex:1;background:var(--surface2);border-radius:2px 2px 0 0;position:relative;}
  .bar-mini .b .fill{position:absolute;bottom:0;left:0;right:0;background:var(--gold-dim);border-radius:2px 2px 0 0;}
  .bar-mini .lbl{flex:1;min-width:0;font-size:9px;color:var(--dim2);text-align:center;margin-top:3px;font-family:var(--mono);}

  /* At-a-glance charts */
  .glance-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;margin-bottom:8px;}
  @media(max-width:820px){.glance-grid{grid-template-columns:1fr;}}
  /* New Hires and Separations stack one above the other, each getting the page's full width —
     side-by-side halves left too little room for a 9-10 column table and caused headers/names
     to overlap. */
  .archive-grid{display:grid;grid-template-columns:1fr;gap:24px;align-items:start;}
  .donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .donut{position:relative;width:140px;height:140px;border-radius:50%;flex-shrink:0;}
  .donut .hole{position:absolute;inset:17px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut .hole .n{font-family:var(--mono);font-size:24px;color:var(--text);}
  .donut .hole .l{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;}
  .donut-legend{display:flex;flex-direction:column;gap:9px;font-size:12.5px;}
  .donut-legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;flex-shrink:0;}
  .mini-label{font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px;}

  /* ============ EXECUTIVE REPORT ============ */
  .exec-print-head{display:none;}
  .exec-block{page-break-inside:avoid;break-inside:avoid;margin-bottom:26px;}
  .exec-section-break{page-break-before:always;break-before:page;}
  .exec-flag{border-left:3px solid var(--red);background:var(--surface2);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:8px;font-size:13px;}
  .exec-flag.opp{border-left-color:var(--green);}
  .exec-flag.watch{border-left-color:var(--gold);}
  .exec-corr-table td, .exec-corr-table th{white-space:nowrap;}
  table.demo.compact th, table.demo.compact td{padding:6px 10px;font-size:12px;}
  @media print{
    body{background:#fff;}
    .sidebar, .topbar .head-controls, .exec-noprint, .toast{display:none !important;}
    .main{padding:0 !important;max-width:100% !important;}
    .shell{display:block;}
    .exec-print-head{display:block;border-bottom:2px solid #1A2036;padding-bottom:10px;margin-bottom:18px;}
    .exec-print-head h1{font-family:var(--serif);font-size:22px;margin:0 0 4px;}
    .exec-print-head .meta{font-size:11.5px;color:#444;}
    .card{border:1px solid #ccc;}
    h2.section{page-break-after:avoid;break-after:avoid;}
    a{color:inherit;text-decoration:none;}
    .exec-section-break{page-break-before:always;}
  }
  /* ============ CERTIFICATE OF EMPLOYMENT ============ */
  .coe-page{background:#fff;color:#161a2b;width:8.5in;min-height:11in;margin:0 auto;padding:0.9in 1in;
    font-family:Georgia,'Times New Roman',Times,serif;font-size:12.5pt;line-height:1.9;font-style:italic;
    display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--border), 0 4px 18px rgba(0,0,0,.06);}
  /* Blank reserved space at the top for the physical letterhead this prints onto — left empty on
     purpose, since the letterhead itself is pre-printed on the paper, not part of this markup. */
  .coe-letterhead-space{flex:0 0 auto;height:1.6in;}
  /* Title, body, and signature start right below the letterhead reservation rather than being
     vertically centered in the remaining page space. */
  .coe-content{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-start;}
  .coe-title{text-align:center;font-weight:700;letter-spacing:.12em;font-size:16pt;margin-bottom:56px;}
  .coe-body p{text-align:justify;margin:0 0 20px;text-indent:2.5em;white-space:pre-wrap;}
  .coe-body p:last-child{text-indent:0;}
  .coe-sign{margin-top:64px;text-align:right;}
  .coe-sign .coe-sign-name{font-weight:700;text-transform:uppercase;}
  .coe-sign .coe-sign-title{font-size:11pt;color:#3a4258;}
  @media print{
    .coe-topbar{display:none !important;}
    .coe-layout{display:block !important;}
    .coe-page{box-shadow:none;margin:0 auto;padding:0;width:auto;min-height:0;height:9.2in;}
    @page{size:8.5in 11in;margin:0.9in 1in;}
  }
  #syncBadge{
    position:fixed; right:12px; bottom:12px; z-index:9999;
    background:rgba(26,32,54,0.92); color:#c3cbe0; font-family:var(--sans);
    font-size:11.5px; padding:6px 10px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,.25);
    pointer-events:none; letter-spacing:.2px;
  }
  #syncFailBanner{
    display:none; position:fixed; top:0; left:0; right:0; z-index:9999;
    background:#7a3b1e; color:#fff; font-family:var(--sans); font-size:12.5px;
    text-align:center; padding:6px 10px;
  }
  @media print{ #syncBadge, #syncFailBanner{ display:none !important; } }
</style>
</head>
<body>
<div id="syncFailBanner">⚠ Your last change could not be saved to the cloud (check your internet connection or Firebase database rules). It's kept safely in this browser only — reopening this site elsewhere may not show it yet.</div>
<div class="shell" id="app"></div>
<div id="syncBadge">☁ Sync not set up</div>

<script>
/* ============ STATE ============ */
let EMP = [];
let CONFIG = null;
let RECRUIT = {}; // key: "Company|YYYY-MM" -> cost number
let ready = false;

const DEFAULT_CONFIG = {
  industries: [
    {name:'Industry I', companies:['Company A','Company B']},
    {name:'Industry II', companies:['Company C','Company D','Company E']}
  ],
  statuses: ['Staff','Rank & File','Intern/OJT'],
  ageGroups: [
    {label:'Under 25', min:0, max:24},
    {label:'25–34', min:25, max:34},
    {label:'35–44', min:35, max:44},
    {label:'45–54', min:45, max:54},
    {label:'55 and up', min:55, max:200}
  ],
  tenureGroups: [
    {label:'Under 1 year', min:0, max:0.9},
    {label:'1–3 years', min:1, max:2.9},
    {label:'3–5 years', min:3, max:4.9},
    {label:'5–10 years', min:5, max:9.9},
    {label:'10+ years', min:10, max:999}
  ],
  departments:{}, // key: company -> [department names] (segregated per company, same pattern as cost centers)
  costCenterDepartment:{}, // key: `${company}|${costCenter}` -> department (segregated per company)
  manualCostCenters:{}, // key: company -> [costCenter codes] added manually in the Control Panel
  jobGradeGroups:{}, // key: company -> { employmentStatus -> [{label,min,max}] } — ranges can differ by company & status
  positionJobGrades:{}, // key: company -> { employmentStatus -> { positionName -> jobGradeGroupLabel } } — Job Position categorized by Job Grade Group
  extraUploadYears:[], // additional years added from Control Panel → Additional Years — extend every year picker app-wide (topbar Year, Recruitment Year, Archive, Master List "as of month"), floored at 2026
  lockedUploadMonth:'', // Task A: when set (YYYY-MM), HR can't pick any other month for Master List uploads
  companyBaselineMonth:{}, // key: company -> YYYY-MM of that company's first-ever Master List (baseline) upload
  uploadLog:{}, // key: `${company}|${status}` -> { 'YYYY-MM': {rows, at} } — which months already had a Master List uploaded
  separationReasons:['Resignation','End of Contract','Termination','Retirement','Redundancy/Retrenchment','Other'],
  // Certificate of Employment — per-company defaults (address, signatory, boilerplate purpose
  // line) so HR doesn't have to retype them every time; the actual certificate per employee is
  // never stored here, it's generated fresh each time from the Active Roster / Archive plus
  // these defaults, and is always further editable before printing.
  coeSettings: {},
  // A general starting point for "how long is too long without a Job Grade change" — not pulled
  // from any external source, just a common HR rule-of-thumb order of magnitude. Meant to be
  // adjusted by HR to match PGB's actual promotion cadence/policy, not treated as a benchmark.
  promotionBenchmarkYears: 4,
  users:[{name:'HR Admin', role:'HR'}],
  // One shared password per role, stored only as a SHA-256 hash (never the password itself) so
  // nothing readable sits in this file once it's public on GitHub. These are just the day-one
  // defaults (see the chat where this file was generated for what they are) — change every one
  // of them from Control Panel → Role Passwords right after deploying.
  authHashes: {
    Admin: '9b61f990ea138dbf7652e13d8381b01b0105fe29973db6afd199cdbb2bf7dbfe',
    HR: '0589b9cee46f0a7384c44cae4f72328c4611d9cb87540e8618236218b0bff468',
    Executive: '8b6e9d7203480078f71a48e040e0c8e4d5a7d19bb8a12b48ec0e1aebdf7e79fe'
  }
};

const STATUS_KEY = s => s==='Staff' ? 'staff' : (s==='Intern/OJT' ? 'intern' : 'rankfile');
const STATUS_COLOR = {staff:'var(--blue)', rankfile:'var(--teal)', intern:'var(--violet)'};

let ui = {
  tab:'overview',
  month: monthStr(new Date()),
  // Task: the Master List "As Of Month" picker used to default to the shared reporting-period
  // month above (ui.month) — that's also driven by the Year/Month picker in the topbar on every
  // page, so if HR had browsed a different report period (e.g. a future year) elsewhere in the
  // app, the upload month would silently carry that over instead of today's real date. This is
  // a separate, dedicated field that always starts at the real current month.
  uploadMonth: monthStr(new Date()),
  company:null,
  companySub:'headcount',
  companyPeriod:'monthly',
  archiveCompany:'',
  archiveStatus:'',
  recruitView:'monthly',
  recruitYear: new Date().getFullYear(),
  modal:null,
  role:'HR',
  authRole:null, // null = not signed in; set to 'Admin'/'HR'/'Executive' once the password checks out
  loginError:'',
  rosterFilterCompany:'',
  rosterFilterStatus:'',
  ccDeptCompany:null,
  // Certificate of Employment — the working draft for whichever certificate is currently open.
  // bodyText is the freely-editable certificate paragraph(s); regenerateCOEBody() rebuilds it
  // from the structured fields below on demand, but never overwrites a manual edit on its own.
  coe:{
    company:null, employeeId:'', companyLabel:'', name:'', position:'', department:'',
    pronoun:'Their', dateHired:'', present:true, dateSeparated:'',
    issuedDate:'', address:'', purpose:'This certification is being issued for whatever legal purpose this may serve.',
    signatoryName:'', signatoryTitle:'', bodyText:''
  },
  jobGradeCompany:null,
  jobGradeStatus:null,
  overviewCompany:'',
  positionView:'breakdown',
  deptSearch:'',
  costcenterSearch:'',
  positionSearch:'',
  appraisalCompany:'',
  appraisalSearch:'',
  forecastScope:'',
  forecastHorizon:12,
  reportScope:'', // '' = All Companies, else a company name
  reportPeriod:'monthly', // 'monthly' | 'annual'
  reportCompare:true, // show vs-previous-period comparison throughout the report
  forecastReportSub:'forecast' // 'forecast' | 'execreport' — sub-tab within the merged nav item
};
const ROLE_OPTIONS = ['Admin','HR','Executive'];
function isAdmin(){ return ui.role==='Admin'; }
// Task B: Hire & Separation Quick Add is open to both Admin and HR (Executive still can't reach
// the Data Management tab at all — see EXEC_ALLOWED_TABS).
function canQuickAdd(){ return ui.role==='Admin' || ui.role==='HR'; }
function setRole(v){ ui.role = v; render(); }

function monthStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthBounds(ms){
  const [y,m] = ms.split('-').map(Number);
  const start = new Date(y, m-1, 1);
  const end = new Date(y, m, 0, 23,59,59);
  return {start,end};
}
function parseDate(s){
  if(!s) return null;
  s = String(s).trim();
  if(!s) return null;
  // Raw Excel serial date (e.g. a date cell that wasn't formatted as text on export)
  if(/^\d{4,6}$/.test(s)){
    const n = Number(s);
    if(n > 20000 && n < 60000){
      const base = new Date(1899,11,30);
      return new Date(base.getFullYear(), base.getMonth(), base.getDate()+n);
    }
  }
  // accept YYYY-MM-DD, MM/DD/YYYY
  let d;
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) d = new Date(s);
  else d = new Date(s);
  if(isNaN(d.getTime())) return null;
  return d;
}
function fmtDate(d){
  if(!d) return '';
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function normalizeDateInput(raw){
  if(!raw) return '';
  const d = parseDate(raw);
  return d ? fmtDate(d) : String(raw).trim();
}
function normalizeMonthInput(raw){
  if(!raw) return '';
  const s = String(raw).trim();
  if(/^\d{4}-\d{2}$/.test(s)) return s;
  const d = parseDate(s);
  return d ? monthStr(d) : '';
}
// Displays a stored date (kept internally as YYYY-MM-DD, the format HTML date inputs require) as
// month/day/year for anywhere it's shown as plain text to the user — tables and Excel exports.
function fmtDateMDY(dateStr){
  const d = parseDate(dateStr);
  if(!d) return dateStr || '';
  const mo = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${mo}/${day}/${d.getFullYear()}`;
}
// Used by the Certificate of Employment — "July 23, 2011" style, and "4th day of May 2026" for
// the issued line.
function fmtDateLong(dateStr){
  const d = parseDate(dateStr);
  if(!d) return dateStr || '';
  return d.toLocaleString('en-US',{month:'long', day:'numeric', year:'numeric'});
}
function ordinalSuffix(n){
  const j = n%10, k = n%100;
  if(j===1 && k!==11) return 'st';
  if(j===2 && k!==12) return 'nd';
  if(j===3 && k!==13) return 'rd';
  return 'th';
}
function fmtOrdinalLongDate(dateStr){
  const d = parseDate(dateStr);
  if(!d) return '';
  const day = d.getDate();
  const month = d.toLocaleString('en-US',{month:'long'});
  return `${day}${ordinalSuffix(day)} day of ${month} ${d.getFullYear()}`;
}
function peso(n){ return '₱'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0}); }

/* ============ STORAGE ============ */
const LS_PREFIX = 'pgb_emp_demographics_v1__';
function hasCloudStorage(){
  return (typeof window !== 'undefined') && !!window.storage
    && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';
}
// Reads from the platform's shared storage first (works when this runs as a live Claude.ai
// artifact); falls back to this browser's localStorage (works when the .html file itself is
// downloaded and opened directly, where window.storage doesn't exist at all).
async function storageGet(key, shared){
  if(hasCloudStorage()){
    try{
      const r = await window.storage.get(key, shared);
      if(r) return r;
    }catch(e){ /* fall through to local */ }
  }
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw!==null ? {key, value:raw, shared:!!shared} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  let cloudOk = false;
  if(hasCloudStorage()){
    try{ const r = await window.storage.set(key, value, shared); cloudOk = !!r; }catch(e){ cloudOk = false; }
  }
  let localOk = false;
  try{ localStorage.setItem(LS_PREFIX+key, value); localOk = true; }catch(e){ localOk = false; }
  return (cloudOk || localOk) ? {key, value, shared:!!shared} : null;
}

// ---- Local-edit guard --------------------------------------------------
// Same reasoning as the KPI tool: edits update CONFIG/EMP/RECRUIT locally first
// and only reach the cloud ~900ms later (see schedulePush). Meanwhile the
// initial pullFromCloud() and the live listener can resolve with an OLDER
// snapshot. Without a guard, that older snapshot would silently overwrite
// whatever was just changed. _localChangeSeq/_syncedChangeSeq track whether
// there's an edit that hasn't finished being pushed yet; while there is,
// incoming remote snapshots are skipped rather than applied.
let _localChangeSeq = 0;
let _syncedChangeSeq = 0;
function markLocalChange(){ _localChangeSeq++; }
function hasUnsyncedLocalChanges(){ return _localChangeSeq !== _syncedChangeSeq; }
let _pushTimer = null;

function firebaseReady(){
  if (_fbRef) return true;
  try{
    if (!window.firebase || !FIREBASE_CONFIG.apiKey) return false;
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    _fbRef = firebase.database().ref(FIREBASE_SYNC_PATH);
    return true;
  }catch(err){
    console.warn('Firebase init failed:', err);
    return false;
  }
}

// ---- Firebase key sanitization ------------------------------------------
// Realtime Database keys can't contain '.', '#', '$', '/', '[', or ']' — but
// real cost center codes (e.g. "ABC-QA/C") do contain '/', and several CONFIG
// objects (costCenterDepartment, manualCostCenters, etc.) use free-text values
// like that AS object keys. Without this, one such code makes the ENTIRE
// payload's set() call fail — not just that one field — silently losing every
// other edit in the same save along with it. These walk the whole payload
// recursively and swap unsafe characters in KEYS ONLY (never touching values)
// for a reversible placeholder before every push, and reverse it on every pull.
const FB_KEY_ESCAPES = {'.':'~dot~', '#':'~hash~', '$':'~dollar~', '/':'~slash~', '[':'~lb~', ']':'~rb~'};
const FB_KEY_UNSAFE_RE = /[.#$/[\]]/g;
const FB_KEY_UNESCAPES = {dot:'.', hash:'#', dollar:'$', slash:'/', lb:'[', rb:']'};
const FB_KEY_ESCAPED_RE = /~(dot|hash|dollar|slash|lb|rb)~/g;
function fbSanitizeKeys(node){
  if (Array.isArray(node)) return node.map(fbSanitizeKeys);
  if (node && typeof node === 'object'){
    const out = {};
    Object.keys(node).forEach(k=>{
      const safeKey = k.replace(FB_KEY_UNSAFE_RE, c => FB_KEY_ESCAPES[c]);
      out[safeKey] = fbSanitizeKeys(node[k]);
    });
    return out;
  }
  return node;
}
function fbRestoreKeys(node){
  if (Array.isArray(node)) return node.map(fbRestoreKeys);
  if (node && typeof node === 'object'){
    const out = {};
    Object.keys(node).forEach(k=>{
      const realKey = k.replace(FB_KEY_ESCAPED_RE, (m, tag) => FB_KEY_UNESCAPES[tag]);
      out[realKey] = fbRestoreKeys(node[k]);
    });
    return out;
  }
  return node;
}

// Shared by the one-time pull and the live listener below.
function applyRemoteData(data){
  if (hasUnsyncedLocalChanges()) return false; // don't clobber an edit that's still on its way up
  data = fbRestoreKeys(data);
  let changed = false;
  if (data && data.config){
    CONFIG = sanitizeConfig(data.config);
    try{ localStorage.setItem(LS_PREFIX+'config', JSON.stringify(CONFIG)); }catch(e){}
    changed = true;
  }
  if (data && Array.isArray(data.employees)){
    EMP = data.employees;
    try{ localStorage.setItem(LS_PREFIX+'employees', JSON.stringify(EMP)); }catch(e){}
    changed = true;
  }
  if (data && data.recruitment){
    RECRUIT = data.recruitment;
    try{ localStorage.setItem(LS_PREFIX+'recruitment', JSON.stringify(RECRUIT)); }catch(e){}
    changed = true;
  }
  if (data && data.updatedAt){ _lastKnownUpdatedAt = data.updatedAt; }
  if (changed && ready) render();
  return changed;
}

async function pullFromCloud(){
  if (!firebaseReady()){ updateSyncBadge('unconfigured'); return; }
  updateSyncBadge('syncing');
  try{
    const snap = await _fbRef.once('value');
    if (hasUnsyncedLocalChanges()) return; // a local edit landed while this pull was in flight
    const data = snap.val();
    if (data){
      applyRemoteData(data);
      const stamp = _lastKnownUpdatedAt ? new Date(_lastKnownUpdatedAt).toLocaleTimeString() : '';
      updateSyncBadge('synced', stamp);
    }else{
      // Nothing in the cloud yet (first-ever run) — seed it from whatever's local/default.
      updateSyncBadge('synced');
      pushToCloud();
    }
  }catch(err){
    console.warn('Cloud sync (pull) failed — using local copy:', err);
    updateSyncBadge('offline');
  }
}

async function pushToCloud(){
  if (!firebaseReady()) return;
  updateSyncBadge('syncing');
  try{
    const payload = {
      config: CONFIG,
      employees: EMP,
      recruitment: RECRUIT,
      updatedAt: Date.now()
    };
    const seqAtPush = _localChangeSeq;
    _lastKnownUpdatedAt = payload.updatedAt; // set before the write so our own echo is recognized and skipped
    await _fbRef.set(fbSanitizeKeys(payload));
    _syncedChangeSeq = seqAtPush;
    updateSyncBadge('synced', new Date(payload.updatedAt).toLocaleTimeString());
  }catch(err){
    console.warn('Cloud sync (push) failed:', err);
    updateSyncBadge('offline');
  }
}

// Live cross-device sync: any other device's write shows up here within moments.
function startRealtimeSync(){
  if (!firebaseReady()) return;
  _fbRef.on('value', snap => {
    const data = snap.val();
    if (!data || data.updatedAt === _lastKnownUpdatedAt) return; // ignore our own echo / empty node
    applyRemoteData(data);
    updateSyncBadge('synced', new Date(data.updatedAt).toLocaleTimeString());
  });
}

// Repairs a CONFIG object so every field the rest of the app depends on is present and the
// right shape, regardless of where the object came from — a fresh local load, a partial/older
// snapshot restored from localStorage, or a Firebase pull/live-update. Every code path that sets
// CONFIG must run it through here; earlier this only ran once at startup (in loadAll), so a
// Firebase pull moments later could silently overwrite a freshly-repaired CONFIG with the same
// incomplete data and reintroduce the exact bug this just fixed.
function sanitizeConfig(cfg){
  cfg = cfg || {};
  // Self-heal a corrupted/partial industries list — every render path (via allCompanies) walks
  // this array, so one malformed entry here used to crash the entire app before it could even
  // show the login screen. Any entry missing a proper `companies` array gets one instead of
  // being left to throw later.
  if(!Array.isArray(cfg.industries)) cfg.industries = JSON.parse(JSON.stringify(DEFAULT_CONFIG.industries));
  cfg.industries.forEach(ind=>{ if(!Array.isArray(ind.companies)) ind.companies = []; });
  if(!cfg.separationReasons) cfg.separationReasons = DEFAULT_CONFIG.separationReasons.slice();
  // Departments used to be one flat list shared across every company; now they're segregated
  // per company, the same way cost centers already were. Migrate an old flat array by seeding
  // every existing company with the same list of names, so cost centers already mapped to one
  // of those names (via costCenterDepartment, which was always keyed per company) keep resolving
  // to a valid option in the per-company dropdown instead of silently going blank.
  if(!cfg.departments || Array.isArray(cfg.departments)){
    const legacy = Array.isArray(cfg.departments) ? cfg.departments : [];
    cfg.departments = {};
    if(legacy.length){
      cfg.industries.forEach(ind=> (ind.companies||[]).forEach(c=>{ cfg.departments[c] = legacy.slice(); }));
    }
  }
  if(!cfg.costCenterDepartment) cfg.costCenterDepartment = {};
  if(!cfg.manualCostCenters) cfg.manualCostCenters = {};
  if(!cfg.coeSettings) cfg.coeSettings = {};
  if(!cfg.jobGradeGroups) cfg.jobGradeGroups = {};
  if(!cfg.positionJobGrades) cfg.positionJobGrades = {};
  if(!cfg.extraUploadYears) cfg.extraUploadYears = [];
  // Floor at 2026 (PGB's records in this tool don't go back further) and keep sorted/deduped so
  // the Control Panel list and every year picker that reads it stay consistent.
  cfg.extraUploadYears = Array.from(new Set(cfg.extraUploadYears.map(Number))).filter(y=> y>=MIN_YEAR).sort((a,b)=>a-b);
  if(cfg.lockedUploadMonth===undefined) cfg.lockedUploadMonth = '';
  if(!cfg.companyBaselineMonth) cfg.companyBaselineMonth = {};
  if(!cfg.uploadLog) cfg.uploadLog = {};
  if(cfg.promotionBenchmarkYears==null) cfg.promotionBenchmarkYears = DEFAULT_CONFIG.promotionBenchmarkYears;
  if(!cfg.authHashes) cfg.authHashes = JSON.parse(JSON.stringify(DEFAULT_CONFIG.authHashes));
  // Same self-heal as industries above — these fields are relied on throughout the Control
  // Panel and every dropdown that lists Employment Status/Age/Tenure. A config that arrived
  // missing or with an empty array here (e.g. an older snapshot merged in from the cloud) used
  // to leave those sections silently blank rather than falling back to sensible defaults.
  if(!Array.isArray(cfg.statuses) || !cfg.statuses.length) cfg.statuses = DEFAULT_CONFIG.statuses.slice();
  if(!Array.isArray(cfg.ageGroups) || !cfg.ageGroups.length) cfg.ageGroups = JSON.parse(JSON.stringify(DEFAULT_CONFIG.ageGroups));
  if(!Array.isArray(cfg.tenureGroups) || !cfg.tenureGroups.length) cfg.tenureGroups = JSON.parse(JSON.stringify(DEFAULT_CONFIG.tenureGroups));
  if(!Array.isArray(cfg.users) || !cfg.users.length) cfg.users = JSON.parse(JSON.stringify(DEFAULT_CONFIG.users));
  return cfg;
}

async function loadAll(){
  let hadLocalCache = false;
  try{
    const c = await storageGet('config', true);
    CONFIG = c ? JSON.parse(c.value) : JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    if (c) hadLocalCache = true;
  }catch(e){ CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }
  CONFIG = sanitizeConfig(CONFIG);
  // Restore a previously-signed-in role on this device, if any, so people aren't logged out on
  // every page refresh. This only reads a role name back — the actual password is never stored.
  try{
    const savedSession = localStorage.getItem(LS_PREFIX+'session');
    if(savedSession){
      const s = JSON.parse(savedSession);
      if(s && ['Admin','HR','Executive'].includes(s.role)){ ui.authRole = s.role; ui.role = s.role; }
    }
  }catch(e){ /* ignore */ }
  // Migration: the promotion-readiness flag used to be one global "years before flagging" number
  // applied to Staff & Rank and File alike. It's now a Max Tenure Stay set per Staff Job Grade
  // Group (Staff only). Seed each existing Staff group from the old global value so nothing that
  // was already being flagged silently goes unflagged just because the setting moved; HR can then
  // tune each grade's own value in the Control Panel.
  Object.keys(CONFIG.jobGradeGroups).forEach(company=>{
    const staffGroups = CONFIG.jobGradeGroups[company] && CONFIG.jobGradeGroups[company]['Staff'];
    if(Array.isArray(staffGroups)) staffGroups.forEach(g=>{ if(g.maxTenureYears==null) g.maxTenureYears = CONFIG.promotionBenchmarkYears; });
  });
  try{
    const e = await storageGet('employees', true);
    EMP = e ? JSON.parse(e.value) : [];
    if (e) hadLocalCache = true;
  }catch(e){ EMP = []; }
  try{
    const r = await storageGet('recruitment', true);
    RECRUIT = r ? JSON.parse(r.value) : {};
    if (r) hadLocalCache = true;
  }catch(e){ RECRUIT = {}; }

  // If this device has never cached anything locally (a new phone/PC, or a
  // cleared browser) and cloud sync is configured, don't render yet with
  // empty employees / default config — that's what made opening the site on
  // another device look like the admin's saved data had "reset". Instead,
  // keep showing the loading screen (render() already handles !ready) until
  // the cloud pull resolves one way or another, then render with whatever
  // that pull actually found.
  const shouldWaitForCloud = !hadLocalCache && firebaseReady();
  if (!shouldWaitForCloud){
    ready = true;
    render();
  }

  // Cloud sync: pull the latest shared data from Firebase (may override the local/
  // window.storage snapshot above if another device has newer data), then keep
  // listening for live updates from other devices.
  updateSyncBadge(firebaseReady() ? 'syncing' : 'unconfigured');
  await pullFromCloud();
  if (shouldWaitForCloud){
    ready = true;
    render();
  }
  startRealtimeSync();
}
/* ============ AUTH (per-role password, SHA-256 hashed) ============ */
async function sha256Hex(str){
  if(!(window.crypto && window.crypto.subtle)) throw new Error('no-subtle-crypto');
  const bytes = new TextEncoder().encode(str);
  const digest = await window.crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function attemptLogin(){
  const role = document.getElementById('loginRole').value;
  const pwdEl = document.getElementById('loginPassword');
  const pwd = pwdEl ? pwdEl.value : '';
  if(!pwd){ ui.loginError = 'Enter a password.'; render(); return; }
  let hash;
  try{ hash = await sha256Hex(pwd); }
  catch(e){ ui.loginError = "This browser can't verify passwords securely. Try a modern browser (Chrome, Edge, Firefox) or open this file over HTTPS."; render(); return; }
  if(CONFIG.authHashes && CONFIG.authHashes[role] === hash){
    ui.authRole = role; ui.role = role; ui.loginError = '';
    try{ localStorage.setItem(LS_PREFIX+'session', JSON.stringify({role, at:Date.now()})); }catch(e){}
    render();
  }else{
    ui.loginError = 'Incorrect password for '+role+'.';
    render();
  }
}
function doLogout(){
  ui.authRole = null; ui.loginError = '';
  try{ localStorage.removeItem(LS_PREFIX+'session'); }catch(e){}
  render();
}
async function updateRolePassword(){
  if(!isAdmin()) return;
  const role = document.getElementById('pwRole').value;
  const pwd = document.getElementById('pwNew').value;
  const confirm = document.getElementById('pwConfirm').value;
  if(!pwd || pwd.length<6){ toast('New password should be at least 6 characters.'); return; }
  if(pwd!==confirm){ toast("Passwords don't match."); return; }
  let hash;
  try{ hash = await sha256Hex(pwd); }
  catch(e){ toast("This browser can't hash passwords securely."); return; }
  if(!CONFIG.authHashes) CONFIG.authHashes = {};
  CONFIG.authHashes[role] = hash;
  await saveConfig();
  document.getElementById('pwNew').value=''; document.getElementById('pwConfirm').value='';
  toast(role+' password updated.');
}
