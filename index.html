const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
// The single floor year for this tool — PGB's records here don't go back further than 2026, so
// every year picker across the app (topbar Year, Recruitment Year, Archive, Master List "as of
// month") stays clamped to 2026 and up.
const MIN_YEAR = 2026;
// Years added in Control Panel → Additional Years. These feed every year picker in the app, not
// just the Master List upload picker — once HR adds a year here it's immediately selectable in
// the topbar Year selector, Recruitment Year, and Archive, each of which then segments its own
// data (headcount, hires/separations, recruitment cost) by that year like any other.
function configExtraYears(){
  return ((CONFIG && CONFIG.extraUploadYears) || []).filter(y=> Number(y)>=MIN_YEAR);
}
function yearOptions(){
  const now = new Date().getFullYear();
  let ys = new Set();
  for(let y=Math.max(MIN_YEAR, now-3); y<=now+3; y++) ys.add(y);
  EMP.forEach(e=>{
    const h = hireTagDate(e); if(h && h.getFullYear()>=MIN_YEAR) ys.add(h.getFullYear());
    const s = separationTagDate(e); if(s && s.getFullYear()>=MIN_YEAR) ys.add(s.getFullYear());
  });
  configExtraYears().forEach(y=> ys.add(y));
  const uiYear = Number(ui.month.split('-')[0]);
  if(uiYear>=MIN_YEAR) ys.add(uiYear);
  return Array.from(ys).sort((a,b)=>a-b);
}
function setReportingYear(v){
  const m = ui.month.split('-')[1];
  ui.month = v+'-'+m;
  // Keep the whole app's period pickers in sync by default — drill-down pages can still be changed independently after this.
  ui.recruitYear = Number(v);
  render();
}
function setReportingMonthNum(v){
  const y = ui.month.split('-')[0];
  ui.month = y+'-'+String(v).padStart(2,'0');
  render();
}
function monthLabel(ms){
  const [y,m]=ms.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleString('en-US',{month:'long', year:'numeric'});
}
function monthOptions(){
  let set = new Set([monthStr(new Date())]);
  EMP.forEach(e=>{
    const h = hireTagDate(e); if(h && h.getFullYear()>=MIN_YEAR) set.add(monthStr(h));
    const s = separationTagDate(e); if(s && s.getFullYear()>=MIN_YEAR) set.add(monthStr(s));
  });
  return Array.from(set).sort().reverse();
}
/* ---- Master List upload history: which months already have a file on record ---- */
function uploadLogKey(company, status){ return `${company}|${status}`; }

// Months explicitly logged when a Master List was merged through this app.
function loggedUploadMonths(company, status){
  const rec = (CONFIG.uploadLog || {})[uploadLogKey(company, status)] || {};
  return Object.keys(rec).sort();
}

// Months inferred from the records themselves, for history that pre-dates the upload log.
// Every Master List merge leaves a reporting-month fingerprint on the people it touched: the
// month a roster span opened (someone brought onto the reported roster), the month one closed
// (a confirmed separation), and the hire/separation tag months. Scanning those per company +
// employment status recovers which months already had a file, even for uploads made before this
// log existed. A pure refresh month that added and separated nobody leaves no fingerprint, and
// Quick Add / New Hire Import months can appear here too — which is why these are shown as
// "on record" rather than as a confirmed Master List upload.
function derivedUploadMonths(company, status){
  const out = new Set();
  const floor = companyBaselineMonth(company) || '';
  const ceiling = monthStr(new Date());
  EMP.forEach(e=>{
    if(e.company !== company || e.employmentStatus !== status) return;
    // Only explicitly recorded reporting months count. The fallbacks in rosterSpansOf /
    // hireTagMonthOf derive a month from a raw Date Hired, which would drag decades-old hire
    // dates in as if a file had been uploaded back then.
    if(Array.isArray(e.rosterSpans)) e.rosterSpans.forEach(sp=>{
      if(sp.start) out.add(sp.start);
      if(sp.end) out.add(sp.end);
    });
    if(e.hireTagMonth) out.add(e.hireTagMonth);
    if(e.separationTagMonth) out.add(e.separationTagMonth);
  });
  return Array.from(out).filter(m=> m && m <= ceiling && (!floor || m >= floor)).sort();
}

// Everything known for this company + status, split so the UI can distinguish a confirmed
// logged upload from one inferred off the records.
function uploadHistoryFor(company, status){
  const logged = new Set(loggedUploadMonths(company, status));
  const derived = new Set(derivedUploadMonths(company, status).filter(m=> !logged.has(m)));
  return {logged, derived};
}
function uploadedMonthsFor(company, status){
  const {logged, derived} = uploadHistoryFor(company, status);
  return Array.from(new Set([...logged, ...derived])).sort();
}
function isMonthUploaded(company, status, month){
  return uploadedMonthsFor(company, status).includes(month);
}
// Whether ANY employment status for this company had data fed (a Master List upload, or a
// Quick Add / New Hire Import touching that reporting month) for a specific month — used to
// gate Company Detail's Monthly view so it never renders a report built from data that was
// never actually reported for the month picked at the top of the page.
function companyMonthHasData(company, month){
  return (CONFIG.statuses||[]).some(status=> isMonthUploaded(company, status, month));
}
// Same idea as companyMonthHasData, but for the Executive Report's Scope selector — org-wide
// scope (no company picked) counts as having data if ANY company was fed that month.
function execReportMonthHasData(scope, month){
  const companies = scope ? [scope] : allCompanies().map(c=>c.company);
  return companies.some(c=> companyMonthHasData(c, month));
}
async function recordUpload(company, status, month, rows){
  if(!CONFIG.uploadLog) CONFIG.uploadLog = {};
  const k = uploadLogKey(company, status);
  if(!CONFIG.uploadLog[k]) CONFIG.uploadLog[k] = {};
  const prev = CONFIG.uploadLog[k][month];
  // `count` is what separates a first upload from an overwrite: the second and any later file
  // merged into the same month means that month's data has been written over.
  CONFIG.uploadLog[k][month] = {
    rows: (prev && prev.rows || 0) + rows,
    at: new Date().toISOString(),
    count: ((prev && prev.count) || 0) + 1
  };
  await saveConfig();
}

/* Upload state of one month for one company + employment status:
     'none'      — nothing on file for that month                    (red)
     'uploaded'  — a file has been uploaded for that month           (green)
     'overwrite' — a second or later file was merged over that month (blue)
   Months recovered from the records rather than the upload log count as 'uploaded'. */
// Whether a given employment status actually had data fed (Master List upload, Quick Add, or
// New Hire/Separated Import) for the month currently selected in Company Detail. Used throughout
// Company Detail's Monthly breakdowns to blank out a status's numbers instead of silently showing
// a stale or zero count for a status nobody actually reported on this month. Annual isn't gated —
// same reasoning as companyMonthHasData above — so this always reads as "has data" there.
function subStatusHasData(statusLabel){
  if(ui.companyPeriod!=='monthly') return true;
  return isMonthUploaded(ui.company, statusLabel, ui.month);
}
// Small "no data" placeholder used in place of a number when subStatusHasData is false, with a
// title tooltip explaining why.
function noDataCell(statusLabel){
  return `<span style="color:var(--dim);" title="No ${statusLabel} data has been fed for ${monthLabel(ui.month)} yet.">— no data</span>`;
}
function uploadMonthState(company, status, month){
  const rec = ((CONFIG.uploadLog || {})[uploadLogKey(company, status)] || {})[month];
  if(rec) return (rec.count || 1) > 1 ? 'overwrite' : 'uploaded';
  return derivedUploadMonths(company, status).includes(month) ? 'uploaded' : 'none';
}
// Colour alone carries "no data" (red) and "uploaded" (green) — only the overwrite state keeps
// a written label, since a month written over twice is worth naming rather than just tinting.
const UPLOAD_STATE_STYLE = {
  none:      {color:'var(--red)',   text:''},
  uploaded:  {color:'var(--green)', text:''},
  overwrite: {color:'var(--blue)',  text:'overwritten'}
};

// Colour-codes every AS OF MONTH option for whichever company + status is currently selected.
function refreshUploadMonthMarks(){
  const cSel = document.getElementById('cu_company');
  const sSel = document.getElementById('cu_status');
  const mSel = document.getElementById('cu_month');
  if(!cSel || !sSel || !mSel) return;
  const company = cSel.value, status = sSel.value;
  const derived = new Set(derivedUploadMonths(company, status));
  const log = (CONFIG.uploadLog || {})[uploadLogKey(company, status)] || {};
  Array.from(mSel.options).forEach(o=>{
    const rec = log[o.value];
    const state = rec ? ((rec.count || 1) > 1 ? 'overwrite' : 'uploaded') : (derived.has(o.value) ? 'uploaded' : 'none');
    const sty = UPLOAD_STATE_STYLE[state];
    const lock = CONFIG.lockedUploadMonth ? (o.value===CONFIG.lockedUploadMonth ? ' — open' : ' — locked') : '';
    o.textContent = `${monthLabel(o.value)}${lock}${sty.text ? ' — '+sty.text : ''}`;
    o.style.color = sty.color;
  });
  const sel = mSel.value || ui.uploadMonth;
  const badge = document.getElementById('cuState');
  if(badge){
    const sty = UPLOAD_STATE_STYLE[uploadMonthState(company, status, sel)];
    badge.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${sty.color};margin-right:6px;vertical-align:middle;"></span><span style="color:${sty.color};font-family:var(--mono);font-size:11.5px;">${monthLabel(sel)}${sty.text ? ' — '+sty.text : ''}</span>`;
  }
}

function uploadMonthOptions(){
  let set = new Set(monthOptions());
  const now = new Date();
  for(let i=0;i<18;i++){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); if(d.getFullYear()>=MIN_YEAR) set.add(monthStr(d)); }
  // Forward-fill every month through December 2030 by default, extended further by any
  // extra years added in Control Panel → Additional Years (task F).
  const maxYear = Math.max(2030, now.getFullYear(), ...configExtraYears());
  for(let y=Math.max(MIN_YEAR, now.getFullYear()); y<=maxYear; y++){
    for(let m=1;m<=12;m++){ set.add(`${y}-${String(m).padStart(2,'0')}`); }
  }
  return Array.from(set).sort().reverse();
}

/* ============ OVERVIEW ============ */
function renderOverview(){
  const {start,end} = monthBounds(ui.month);
  const prevEnd = new Date(start.getTime()-1);
  const companies = allCompanies().map(c=>c.company);
  const scopeCompany = (ui.overviewCompany && companies.includes(ui.overviewCompany)) ? ui.overviewCompany : '';
  const scopeLabel = scopeCompany ? scopeCompany : 'All Companies';
  const scopePicker = `
  <div class="field"><label>COMPANY SCOPE</label>
    <select onchange="ui.overviewCompany=this.value; render();">
      <option value="">All Companies</option>
      ${companies.map(c=>`<option value="${c}" ${c===scopeCompany?'selected':''}>${c}</option>`).join('')}
    </select>
  </div>`;

  // Same gate as Company Detail's Monthly view and the Executive Report's Monthly period: never
  // populate the Trend & Insight snapshot with figures for a month no one actually reported on.
  // Without real uploads/imports touching this month, rosterSpans simply carry the last real
  // report forward, which would otherwise silently read as if this month itself had been fed.
  // For "All Companies" scope this only holds the page back if NOT ONE company has data for the
  // month picked at the top of the page; for a specific company, only that company's own data
  // for this month counts.
  if(!execReportMonthHasData(scopeCompany, ui.month)){
    return `
    <div class="field-row" style="align-items:center;justify-content:space-between;">
      ${scopePicker}
    </div>
    <div class="empty">No data has been fed for ${scopeLabel} in ${monthLabel(ui.month)} yet — no Master List, Quick Add, or New Hire &amp; Separated Import has touched this month${scopeCompany?'':' for any company'}. Upload or import data for ${monthLabel(ui.month)}, or pick a different month.</div>
    `;
  }

  const inScope = e=> !scopeCompany || e.company===scopeCompany;
  const RATE_STATUSES = ['staff','rankfile'];
  // Task: the Workforce Snapshot (Total Headcount, Composition, Gender/Age/Tenure) must reflect
  // this month's own reported data, per employment status — not just "this company had SOMETHING
  // fed this month" (that coarser check only gates the whole page above). If Staff was uploaded
  // for this month but Rank & File wasn't (or vice versa), the status with no report shouldn't
  // silently keep counting its last-reported headcount here — it should drop out of the snapshot
  // entirely until its own Master List/Quick Add/Import actually touches this month.
  const statusReported = e => isMonthUploaded(e.company, e.employmentStatus, ui.month);

  // Headcount = reported roster membership for this month (frozen once the month has passed),
  // restricted to statuses that actually have a report on file for this month.
  const activeAll = EMP.filter(e=> inScope(e) && isOnRosterAsOf(e,end) && statusReported(e));
  // Rate denominator only — stays real-date based so it lines up with isSeparatedInReal.
  const activeStartAll = EMP.filter(e=> inScope(e) && isActiveAsOf(e,prevEnd) && statusReported(e));
  const hiredAll = EMP.filter(e=> inScope(e) && isHiredIn(e,start,end) && statusReported(e));
  const sepAll = EMP.filter(e=> inScope(e) && isSeparatedIn(e,start,end) && statusReported(e));
  // Task D fix: attrition needs the same (real-date) basis as its own denominator, and task E
  // excludes Intern/OJT — same rules as companyStatsCore, applied at whatever scope is selected.
  const activeStartRateEligible = activeStartAll.filter(e=> RATE_STATUSES.includes(STATUS_KEY(e.employmentStatus)));
  const sepAllForRates = EMP.filter(e=> inScope(e) && RATE_STATUSES.includes(STATUS_KEY(e.employmentStatus)) && isSeparatedInReal(e,start,end) && statusReported(e));
  const rateBase = activeStartRateEligible.length || 1;
  const attr = (sepAllForRates.length/rateBase*100);
  const trend = orgTrend(scopeCompany);

  const genderOrder = ['Male','Female','Other','Unspecified'];
  const ageOrder = CONFIG.ageGroups.map(g=>g.label);
  const tenureOrder = CONFIG.tenureGroups.map(g=>g.label);

  return `
  <div class="field-row" style="align-items:center;justify-content:space-between;">
    ${scopePicker}
    <p class="hint" style="margin:0;max-width:420px;text-align:right;">Everything below reflects <b>${scopeLabel}</b> as of ${monthLabel(ui.month)}.</p>
  </div>

  <h2 class="section">Workforce Snapshot <span class="n">${scopeLabel} · ${monthLabel(ui.month)}</span></h2>
  <p class="hint" style="margin-top:-4px;">Only employment statuses (Staff, Rank &amp; File, etc.) with a report on file for ${monthLabel(ui.month)} are counted below — a status with nothing uploaded yet for this month doesn't carry forward its last reported headcount.</p>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;">
    <div class="card" style="max-width:280px;padding:18px 22px;">
      <div class="label">Total Headcount</div>
      <div class="value" style="font-size:34px;">${activeAll.length}</div>
      <div class="foot">${scopeLabel} · as of ${monthLabel(ui.month)}</div>
    </div>
    <div class="panel" style="flex:1;min-width:280px;max-width:420px;">
      <div class="panel-head"><h3>Workforce Composition</h3></div>
      ${compositionDonut({staff: activeAll.filter(e=>STATUS_KEY(e.employmentStatus)==='staff').length, rankfile: activeAll.filter(e=>STATUS_KEY(e.employmentStatus)==='rankfile').length, intern: activeAll.filter(e=>STATUS_KEY(e.employmentStatus)==='intern').length}, activeAll.length)}
    </div>
  </div>

  <div class="grid cards3" style="margin-top:16px;">
    <div class="panel">
      <div class="panel-head"><h3>Gender</h3></div>
      ${breakdownBarChart(activeAll, e=> e.gender || 'Unspecified', genderOrder)}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Age</h3></div>
      ${breakdownBarChart(activeAll, e=> ageGroupOf(ageYears(e, end)), ageOrder)}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Tenure</h3></div>
      ${breakdownBarChart(activeAll, e=> tenureGroupOf(tenureYears(e, end)), tenureOrder)}
    </div>
  </div>

  <div class="panel" style="margin-top:16px;">

    <div class="card"><div class="label">Overall Attrition</div><div class="value ${attr>3?'red':''}">${activeStartRateEligible.length? attr.toFixed(1):'0.0'}%</div><div class="foot">retention ${activeStartRateEligible.length? (100-attr).toFixed(1):'100.0'}% · Staff &amp; Rank &amp; File</div></div>

function overviewTable(){
  const companies = allCompanies();
  if(!companies.length) return '<div class="empty">No companies configured yet.</div>';
  const byInd = {};
  companies.forEach(c=>{ (byInd[c.industry] = byInd[c.industry]||[]).push(c.company); });
  const statuses = CONFIG.statuses || [];

  // Per-company, per-EXACT-employment-status stats for the selected month — kept separate per
  // real status name (Staff, Rank & File, Intern/OJT, or any custom status added in Control
  // Panel) rather than folding everything that isn't Staff/Intern into one blended "Rank & File"
  // row, so Staff, Rank & File, and any other configured status each get their own line.
  const stats = {};
  companies.forEach(c=>{
    stats[c.company] = {};
    statuses.forEach(s=> stats[c.company][s] = companyStatusStats(c.company, s, ui.month));
  });
  // Per-company, per-status gate: a status's cell only populates if THAT status actually had a
  // Master List, Quick Add, or New Hire & Separated Import touch the selected month at that
  // company — otherwise it would silently carry forward a prior month's report for that status.
  const hasData = {};
  companies.forEach(c=>{
    hasData[c.company] = {};
    statuses.forEach(s=> hasData[c.company][s] = isMonthUploaded(c.company, s, ui.month));
  });
  const cell = (c, s, val) => hasData[c.company][s] ? val : '<span style="color:var(--dim2);">—</span>';
  const naCell = '<span style="color:var(--dim2);" title="Attrition/Retention isn\'t tracked for this status">n/a</span>';

  let head1 = '<tr><th class="rowlabel"></th>' + Object.keys(byInd).map(ind=>`<th colspan="${byInd[ind].length}">${ind}</th>`).join('') + '</tr>';
  let head2 = '<tr><th class="rowlabel">Headcount</th>' + companies.map(c=>`<th>${c.company}</th>`).join('') + '</tr>';

  const headcountRows = statuses.map(s=>
    `<tr><td class="rowlabel">${s}</td>${companies.map(c=>`<td>${cell(c, s, stats[c.company][s].active)}</td>`).join('')}</tr>`
  ).join('');
  const totalRow = `<tr class="total"><td class="rowlabel">Total</td>${companies.map(c=>{
    const anyData = statuses.some(s=> hasData[c.company][s]);
    const total = statuses.reduce((sum,s)=> sum + (hasData[c.company][s] ? stats[c.company][s].active : 0), 0);
    return `<td>${anyData ? total : '<span style="color:var(--dim2);">—</span>'}</td>`;
  }).join('')}</tr>`;

  const hiredRows = statuses.map(s=>
    `<tr><td class="rowlabel">Hired — ${s}</td>${companies.map(c=>`<td>${cell(c, s, stats[c.company][s].hired)}</td>`).join('')}</tr>`
  ).join('');
  const sepRows = statuses.map(s=>
    `<tr><td class="rowlabel">Separated — ${s}</td>${companies.map(c=>`<td>${cell(c, s, stats[c.company][s].separated)}</td>`).join('')}</tr>`
  ).join('');
  // Task E: Attrition/Retention isn't a meaningful concept for Intern/OJT — shown as n/a rather
  // than a fabricated 0%/100%, same rule this app already applies everywhere else.
  const attrRows = statuses.map(s=>{
    const eligible = STATUS_KEY(s) !== 'intern';
    return `<tr><td class="rowlabel">Attrition Rate — ${s}</td>${companies.map(c=> eligible
      ? `<td>${cell(c, s, (stats[c.company][s].baseCount ? stats[c.company][s].attritionRate.toFixed(1) : '0.0')+'%')}</td>`
      : `<td>${naCell}</td>`
    ).join('')}</tr>`;
  }).join('');
  const retRows = statuses.map(s=>{
    const eligible = STATUS_KEY(s) !== 'intern';
    return `<tr><td class="rowlabel">Retention Rate — ${s}</td>${companies.map(c=> eligible
      ? `<td>${cell(c, s, (stats[c.company][s].baseCount ? stats[c.company][s].retentionRate.toFixed(1) : '100.0')+'%')}</td>`
      : `<td>${naCell}</td>`
    ).join('')}</tr>`;
  }).join('');

  // Annual Cohort Split — New Hire vs. Existing Employee, one sub-block per rate-eligible status
  // (same Task E exclusion as above — Intern/OJT isn't part of this split). This section
  // aggregates a whole year, so — same as Company Detail's Annual view and the Executive
  // Report's Annual period — it isn't gated the same way as the month-specific rows above.
  const nhYear = Number(ui.month.split('-')[0]) || new Date().getFullYear();
  const cohortBlocks = statuses.filter(s=> STATUS_KEY(s)!=='intern').map(s=>{
    const nh = {}, ex = {};
    companies.forEach(c=>{
      nh[c.company] = newHireStatsAnnual(c.company, nhYear, s, true);
      ex[c.company] = existingEmployeeStatsAnnual(c.company, nhYear, s, true);
    });
    const nhCohortRow = `<tr><td class="rowlabel">New Hires (${nhYear})</td>${companies.map(c=>`<td>${nh[c.company].cohortCount}</td>`).join('')}</tr>`;
    const nhAttrRow = `<tr><td class="rowlabel">— Attrition / Retention</td>${companies.map(c=>`<td>${nh[c.company].cohortCount? nh[c.company].attritionRate.toFixed(1):'0.0'}% / ${nh[c.company].cohortCount? nh[c.company].retentionRate.toFixed(1):'100.0'}%</td>`).join('')}</tr>`;
    const exBaseRow = `<tr><td class="rowlabel">Existing Employees</td>${companies.map(c=>`<td>${ex[c.company].baseCount}</td>`).join('')}</tr>`;
    const exAttrRow = `<tr><td class="rowlabel">— Attrition / Retention</td>${companies.map(c=>`<td>${ex[c.company].baseCount? ex[c.company].attritionRate.toFixed(1):'0.0'}% / ${ex[c.company].baseCount? ex[c.company].retentionRate.toFixed(1):'100.0'}%</td>`).join('')}</tr>`;
    return `<tr class="stathead"><td colspan="${companies.length+1}">${s}</td></tr>${nhCohortRow}${nhAttrRow}${exBaseRow}${exAttrRow}`;
  }).join('');

  return `<table class="demo">
    <thead>${head1}${head2}</thead>
    <tbody>
      ${headcountRows}
      ${totalRow}
      <tr class="stathead"><td colspan="${companies.length+1}">Movement — Hired</td></tr>
      ${hiredRows}
      <tr class="stathead"><td colspan="${companies.length+1}">Movement — Separated</td></tr>
      ${sepRows}
      <tr class="stathead"><td colspan="${companies.length+1}">Movement — Attrition Rate</td></tr>
      ${attrRows}
      <tr class="stathead"><td colspan="${companies.length+1}">Movement — Retention Rate</td></tr>
      ${retRows}
      <tr class="stathead"><td colspan="${companies.length+1}">Annual Cohort Split, ${nhYear} <span style="font-weight:400;text-transform:none;letter-spacing:0;">— New Hire vs. Existing Employee, per status</span></td></tr>
      ${cohortBlocks}
    </tbody>
  </table>
  <p class="hint">Headcount and Movement rows are broken out per employment status — each row shows <b>—</b> if that specific status hasn't had a Master List, Quick Add, or New Hire &amp; Separated Import touch ${monthLabel(ui.month)} yet at that company. Attrition/Retention shows <b>n/a</b> for Intern/OJT, since it isn't a meaningful figure for that status. <b>Annual Cohort Split</b> takes ${nhYear} and divides everyone active that year, per status, into two mutually-exclusive groups — people hired <b>in ${nhYear}</b> (New Hires) versus people already on the roster <b>before ${nhYear}</b> (Existing Employees) — so you can see whether that year's departures skewed toward new joiners or tenured staff. Change the Year picker up top to view a different year.</p>`;
}

/* ============ COMPANY DETAIL ============ */
function companyPeriodBounds(){
  const selectedYear = Number(ui.month.split('-')[0]) || new Date().getFullYear();
  if(ui.companyPeriod==='annual' || ui.companyPeriod==='todate'){
    const year = selectedYear;
    const yearStart = new Date(year,0,1);
    return {
      start: yearStart, end: new Date(year,11,31,23,59,59),
      opts: {baselineDate: new Date(yearStart.getTime()-1)},
      label: `${year} — Full Year`,
      trendAnchor: `${year}-12`
    };
  }
  const {start,end} = monthBounds(ui.month);
  return {
    start, end,
    opts: {baselineDate: new Date(start.getTime()-1)},
    label: monthLabel(ui.month),
    trendAnchor: ui.month
  };
}

// Recomputes the current Company Detail stats + period from ui state — shared by renderCompany
// and by the search/export helpers below, which need to recompute this outside of a full render.
function companyDetailContext(){
  const period = companyPeriodBounds();
  const st = companyStatsCore(ui.company, period.start, period.end, period.opts);
  return {st, period};
}
function renderCompany(){
  const companies = allCompanies().map(c=>c.company);
  if(!ui.company) ui.company = companies[0] || null;

  const {st, period} = companyDetailContext();
  const subs = [['headcount','Headcount'],['department','Department'],['costcenter','Cost Center'],['position','Position'],['age','Age'],['tenure','Tenure'],['gender','Gender'],['jobgrade','Job Grade'],['promotions','Promotions'],['newhire','New Hire'],['separated','Separated']];
  const periodTabs = [['monthly','Monthly'],['annual','Annual']];
  const companySelect = `
  <div class="field"><label>COMPANY</label>
    <select onchange="ui.company=this.value; render();">
      ${companies.map(c=>`<option value="${c}" ${c===ui.company?'selected':''}>${c} — ${industryOf(c)}</option>`).join('')}
    </select>
  </div>`;
  const periodNav = `
  <div class="subnav" style="margin-bottom:8px;">
    ${periodTabs.map(([k,l])=>`<div class="item ${ui.companyPeriod===k?'active':''}" onclick="ui.companyPeriod='${k}'; render();">${l}</div>`).join('')}
  </div>`;

  // No report is generated for a Monthly view when nothing was actually fed (uploaded/imported)
  // for the selected month at this company — showing figures for a month no one reported on
  // would just be silently carrying forward whatever was last on file, which reads as if that
  // month itself had been reported. Annual isn't gated the same way since it aggregates a whole
  // year, which will normally include at least one reported month.
  if(ui.companyPeriod==='monthly' && !companyMonthHasData(ui.company, ui.month)){
    return `
    <div class="field-row" style="align-items:center;justify-content:space-between;">${companySelect}</div>
    ${periodNav}
    <div class="empty">No data has been fed for ${ui.company} in ${monthLabel(ui.month)} yet — no Master List, Quick Add, or New Hire &amp; Separated Import has touched this month. Upload or import data for ${monthLabel(ui.month)}, pick a different month, or switch to Annual.</div>
    `;
  }

  return `
  <div class="field-row" style="align-items:center;justify-content:space-between;">
    ${companySelect}
    <div class="grid cards3" style="grid-template-columns:repeat(3,140px);gap:12px;">
      <div class="card" style="padding:10px 14px;"><div class="label">Headcount</div><div class="value" style="font-size:20px;">${st.total}</div></div>
      <div class="card" style="padding:10px 14px;"><div class="label">Hired</div><div class="value green" style="font-size:20px;">${st.hired.length}</div></div>
      <div class="card" style="padding:10px 14px;"><div class="label">Separated</div><div class="value red" style="font-size:20px;">${st.separated.length}</div></div>
    </div>
  </div>
  ${periodNav}
  <p class="hint" style="margin:-2px 0 14px;">Showing <b>${period.label}</b> — ${ui.companyPeriod==='monthly' ? 'using the Year and Month picked above.' : 'using the Year picked above (Month isn\'t used for Annual).'}</p>

  <div class="subnav">
    ${subs.map(([k,l])=>`<div class="item ${ui.companySub===k?'active':''}" onclick="ui.companySub='${k}'; render();">${l}</div>`).join('')}
  </div>
  <div>${companySubview(ui.companySub, st, period)}</div>
  `;
}

function companySubview(sub, st, period){
  if(sub==='headcount') return subHeadcount(st, period);
  if(sub==='department') return subDepartmentWithSearch(st, period);
  if(sub==='costcenter') return subCostCenterWithSearch(st, period);
  if(sub==='age'){
    const keyFn = e=> ageGroupOf(ageYears(e, period.end));
    const order = CONFIG.ageGroups.map(g=>g.label);
    return subGroupBy(st, keyFn, 'Age Group', order, period, '', true) + deptCrossTab(st, keyFn, 'Age Group', order, period);
  }
  if(sub==='tenure'){
    const keyFn = e=> tenureGroupOf(tenureYears(e, period.end));
    const order = CONFIG.tenureGroups.map(g=>g.label);
    return subGroupBy(st, keyFn, 'Tenure Group', order, period, '', true) + deptCrossTab(st, keyFn, 'Tenure Group', order, period);
  }
  if(sub==='gender'){
    const keyFn = e=> e.gender || 'Unspecified';
    const order = ['Male','Female','Other','Unspecified'];
    return subGroupBy(st, keyFn, 'Gender', order, period, '', true) + deptCrossTab(st, keyFn, 'Gender', order, period);
  }
  if(sub==='position') return subPosition(st, period);
  if(sub==='jobgrade') return subJobGradeByStatus(st, period);
  if(sub==='promotions') return subPromotions(st, period);
  if(sub==='newhire') return subMovement(st.hired, 'Date Hired', 'dateHired', period);
  if(sub==='separated') return subMovement(st.separated, 'Date Separated', 'dateSeparated', period);
  return '';
}

function subHeadcount(st, period){
  // Annual Cohort Split is shown alongside the month-by-month table as one merged block —
  // both are calendar-year cuts of the same population, just sliced differently. Independent
  // of the Monthly/Annual period selector, which only drives the Overall block above.
  const nhYear = Number(ui.month.split('-')[0]) || new Date().getFullYear();
  const nh = newHireStatsAnnual(ui.company, nhYear);
  const ex = existingEmployeeStatsAnnual(ui.company, nhYear);
  const nhS = newHireStatsAnnual(ui.company, nhYear, 'staff');
  const nhR = newHireStatsAnnual(ui.company, nhYear, 'rankfile');
  const exS = existingEmployeeStatsAnnual(ui.company, nhYear, 'staff');
  const exR = existingEmployeeStatsAnnual(ui.company, nhYear, 'rankfile');
  // Each cohort row is followed by its Staff and Rank & File components; the two sub-rows sum
  // back to the cohort total on counts, but their rates are each against their own base.
  const cohortRow = (label, s, sub)=>{
    const base = s.cohortCount!==undefined ? s.cohortCount : s.baseCount;
    return `<tr class="${sub?'':'total'}"><td class="rowlabel" style="${sub?'padding-left:26px;font-weight:400;color:var(--dim);':''}">${label}</td><td>${base}</td><td>${s.separatedCount}</td><td>${s.retentionRate.toFixed(1)}%</td><td>${s.attritionRate.toFixed(1)}%</td></tr>`;
  };
  return `
  <div class="grid cards3">
    <div class="card"><div class="label">Staff</div><div class="value" style="color:var(--blue)">${subStatusHasData('Staff') ? st.byStatus.staff : noDataCell('Staff')}</div></div>
    <div class="card"><div class="label">Rank &amp; File</div><div class="value" style="color:var(--teal)">${subStatusHasData('Rank & File') ? st.byStatus.rankfile : noDataCell('Rank & File')}</div></div>
    <div class="card"><div class="label">Intern / OJT</div><div class="value" style="color:var(--violet)">${subStatusHasData('Intern/OJT') ? st.byStatus.intern : noDataCell('Intern/OJT')}</div></div>
  </div>
  <h2 class="section">Retention &amp; Attrition <span class="n">${period.label} · Staff &amp; Rank &amp; File only</span></h2>
  <div class="grid cards3" style="grid-template-columns:repeat(2,1fr);margin-bottom:14px;">
    <div class="card"><div class="label">Overall Retention Rate</div><div class="value green" style="font-size:20px;">${st.retentionRate.toFixed(1)}%</div></div>
    <div class="card"><div class="label">Overall Attrition Rate</div><div class="value red" style="font-size:20px;">${st.attritionRate.toFixed(1)}%</div></div>
  </div>
  <h2 class="section">Retention/Attrition Breakdown <span class="n">${nhYear} · Staff &amp; Rank &amp; File only</span></h2>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start;">
    <div>${monthlyRetentionAttritionTable(ui.company, nhYear, false)}</div>
    <div>
      <table class="demo" style="margin-top:0;">
        <thead><tr><th class="rowlabel">Cohort</th><th>Base Count</th><th>Separated</th><th>Retention Rate</th><th>Attrition Rate</th></tr></thead>
        <tbody>
          ${cohortRow(`New Hires in ${nhYear}`, nh)}
          ${cohortRow('Staff', nhS, true)}
          ${cohortRow('Rank &amp; File', nhR, true)}
          ${cohortRow(`Already Employed before ${nhYear}`, ex)}
          ${cohortRow('Staff', exS, true)}
          ${cohortRow('Rank &amp; File', exR, true)}
        </tbody>
      </table>
    </div>
  </div>
  <p class="hint">Left: each month uses that month alone as its own period, with the <b>Annual</b> row as the blended full-year figure. Right: everyone active in ${nhYear} split into exactly two groups — hired <b>in ${nhYear}</b> vs. already on the roster <b>before ${nhYear}</b>. Both are always by calendar year; change the Year picker up top to view a different year.</p>

  <h2 class="section">Roster <span class="n">${st.active.length} active as of ${period.label}</span></h2>
  ${employeeTable(st.active)}
  `;
}

function subGroupBy(st, keyFn, label, forcedOrder, period, searchTerm, showPct){
  const groups = {};
  st.active.forEach(e=>{
    const k = keyFn(e) || 'Unassigned';
    groups[k] = groups[k] || {staff:0, rankfile:0, intern:0, total:0};
    groups[k][STATUS_KEY(e.employmentStatus)]++;
    groups[k].total++;
  });
  let keys = forcedOrder ? forcedOrder.filter(k=>groups[k]) : Object.keys(groups).sort();
  Object.keys(groups).forEach(k=>{ if(!keys.includes(k)) keys.push(k); });
  const q = (searchTerm||'').trim().toLowerCase();
  if(q) keys = keys.filter(k=> k.toLowerCase().includes(q));
  if(!keys.length) return `<div class="empty">${q ? `No ${label.toLowerCase()} matches "${searchTerm}".` : 'No active employees to group for this view.'}</div>`;
  // Each percentage is that cell's share of its own column — i.e. within the Staff set, within
  // the Rank & File set, within the Intern/OJT set — not of the company-wide headcount, so the
  // mix inside every employment-status group reads on its own terms. Each column sums to 100%.
  const colTotals = {staff:0, rankfile:0, intern:0, total:0};
  keys.forEach(k=>{ ['staff','rankfile','intern','total'].forEach(c=> colTotals[c] += groups[k][c]); });
  const pct = (n, d) => d ? (n/d*100).toFixed(1)+'%' : '—';
  const cell = (n, d, bold) => showPct
    ? `<td>${bold?`<b>${n}</b>`:n}<span style="color:var(--dim);font-family:var(--mono);font-size:11px;margin-left:6px;">${pct(n,d)}</span></td>`
    : `<td>${bold?`<b>${n}</b>`:n}</td>`;
  // Only show a status column's numbers if that status actually had data fed for the selected
  // month — otherwise a status nobody reported on this month would silently read as zero.
  const statusCell = (statusLabel, n, d, bold) => subStatusHasData(statusLabel)
    ? cell(n, d, bold)
    : `<td style="color:var(--dim);" title="No ${statusLabel} data has been fed for ${monthLabel(ui.month)} yet.">— no data</td>`;
  const rows = keys.map(k=>`
    <tr><td class="rowlabel">${k}</td>${statusCell('Staff', groups[k].staff, colTotals.staff)}${statusCell('Rank & File', groups[k].rankfile, colTotals.rankfile)}${statusCell('Intern/OJT', groups[k].intern, colTotals.intern)}${cell(groups[k].total, colTotals.total, true)}</tr>
  `).join('');
  const totalRow = showPct ? `
    <tr class="total"><td class="rowlabel">Total</td>${statusCell('Staff', colTotals.staff, colTotals.staff, true)}${statusCell('Rank & File', colTotals.rankfile, colTotals.rankfile, true)}${statusCell('Intern/OJT', colTotals.intern, colTotals.intern, true)}${cell(colTotals.total, colTotals.total, true)}</tr>` : '';
  return `
  <h2 class="section">${label} Breakdown <span class="n">${keys.length} group(s) · ${period.label}</span></h2>
  <table class="demo">
    <thead><tr><th class="rowlabel">${label}</th><th>Staff</th><th>Rank &amp; File</th><th>Intern/OJT</th><th>Total</th></tr></thead>
    <tbody>${rows}${totalRow}</tbody>
  </table>`;
}

/* Task B: Department search — wraps subGroupBy with a search box that filters the department
   list without re-rendering the whole page (so the input never loses focus while typing). */
function subDepartmentWithSearch(st, period){
  const keyFn = e=> deptOfEmployee(e, true);
  return `
  <div class="field-row" style="margin-bottom:2px;">
    <input type="text" id="deptSearchBox" placeholder="Search department…" value="${ui.deptSearch||''}" oninput="filterDeptBreakdown()" style="width:260px;">
  </div>
  <div id="deptBreakdownBody">${subGroupBy(st, keyFn, 'Department', null, period, ui.deptSearch)}</div>`;
}
function filterDeptBreakdown(){
  ui.deptSearch = document.getElementById('deptSearchBox').value;
  const {st, period} = companyDetailContext();
  document.getElementById('deptBreakdownBody').innerHTML = subGroupBy(st, e=> deptOfEmployee(e, true), 'Department', null, period, ui.deptSearch);
}

/* Cost Center breakdown, grouped under each Department, with a subtotal row per department
   (vertical subtotal) and a Total column per cost center row (horizontal subtotal) — task B. */
function subCostCenterByDept(st, period, searchTerm){
  const groups = {};
  st.active.forEach(e=>{
    const dept = deptOfEmployee(e, true);
    const cc = (e.costCenter||'').trim() || 'Unassigned';
    groups[dept] = groups[dept] || {};
    groups[dept][cc] = groups[dept][cc] || {staff:0, rankfile:0, intern:0, total:0};
    groups[dept][cc][STATUS_KEY(e.employmentStatus)]++;
    groups[dept][cc].total++;
  });
  const q = (searchTerm||'').trim().toLowerCase();
  let deptKeys = Object.keys(groups).sort();
  if(q){
    // Keep a department if its own name matches, or if any of its cost centers match — either
    // way there's something in it worth showing for this search.
    deptKeys = deptKeys.filter(dept=> dept.toLowerCase().includes(q) || Object.keys(groups[dept]).some(cc=>cc.toLowerCase().includes(q)));
  }
  if(!deptKeys.length) return `<div class="empty">${q ? `No department or cost center matches "${searchTerm}".` : 'No active employees to group for this view.'}</div>`;
  const grand = {staff:0, rankfile:0, intern:0, total:0};
  const statusTd = (statusLabel, n, bold) => subStatusHasData(statusLabel)
    ? `<td>${bold?`<b>${n}</b>`:n}</td>`
    : `<td style="color:var(--dim);" title="No ${statusLabel} data has been fed for ${monthLabel(ui.month)} yet.">— no data</td>`;
  let body = '';
  deptKeys.forEach(dept=>{
    // If the department name itself didn't match, only show the cost centers within it that did.
    let ccKeys = Object.keys(groups[dept]).sort();
    if(q && !dept.toLowerCase().includes(q)) ccKeys = ccKeys.filter(cc=> cc.toLowerCase().includes(q));
    const subtotal = {staff:0, rankfile:0, intern:0, total:0};
    body += `<tr class="stathead"><td colspan="5">${dept}</td></tr>`;
    ccKeys.forEach(cc=>{
      const g = groups[dept][cc];
      subtotal.staff+=g.staff; subtotal.rankfile+=g.rankfile; subtotal.intern+=g.intern; subtotal.total+=g.total;
      body += `<tr><td class="rowlabel">${cc}</td>${statusTd('Staff', g.staff)}${statusTd('Rank & File', g.rankfile)}${statusTd('Intern/OJT', g.intern)}<td><b>${g.total}</b></td></tr>`;
    });
    body += `<tr class="total"><td class="rowlabel">Subtotal — ${dept}</td>${statusTd('Staff', subtotal.staff, true)}${statusTd('Rank & File', subtotal.rankfile, true)}${statusTd('Intern/OJT', subtotal.intern, true)}<td><b>${subtotal.total}</b></td></tr>`;
    grand.staff+=subtotal.staff; grand.rankfile+=subtotal.rankfile; grand.intern+=subtotal.intern; grand.total+=subtotal.total;
  });
  body += `<tr class="total"><td class="rowlabel">Grand Total</td>${statusTd('Staff', grand.staff, true)}${statusTd('Rank & File', grand.rankfile, true)}${statusTd('Intern/OJT', grand.intern, true)}<td><b>${grand.total}</b></td></tr>`;
  return `
  <h2 class="section">Cost Center Breakdown <span class="n">grouped by department · ${period.label}</span></h2>
  <table class="demo">
    <thead><tr><th class="rowlabel">Cost Center</th><th>Staff</th><th>Rank &amp; File</th><th>Intern/OJT</th><th>Total</th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

/* Generic cross-tab: group (rows, e.g. age/tenure/gender/job-grade/position groups) × an
   arbitrary column dimension (department, cost center, etc.), with a Total column per row and a
   Total row per column. Takes a plain employee list rather than a full stats object so it can be
   reused for status-filtered lists (Task D) as well as the full active roster.
   totalFirst: when true, the Total column is placed right after the row label (e.g. Position)
   instead of at the far end — used by the Position by Cost Center / Department views. */
function crossTabGeneric(list, rowKeyFn, colKeyFn, rowLabel, colLabel, forcedOrder, period, titleOverride, totalFirst, searchTerm){
  const rowGroups = {};
  const cols = new Set();
  list.forEach(e=>{
    const rk = rowKeyFn(e) || 'Unassigned';
    const ck = colKeyFn(e) || 'Unassigned';
    cols.add(ck);
    rowGroups[rk] = rowGroups[rk] || {};
    rowGroups[rk][ck] = (rowGroups[rk][ck]||0) + 1;
  });
  let rowKeys = forcedOrder ? forcedOrder.filter(k=>rowGroups[k]) : Object.keys(rowGroups).sort();
  Object.keys(rowGroups).forEach(k=>{ if(!rowKeys.includes(k)) rowKeys.push(k); });
  const colKeys = Array.from(cols).sort();
  if(!colKeys.length) return '';
  const q = (searchTerm||'').trim().toLowerCase();
  if(q) rowKeys = rowKeys.filter(k=> k.toLowerCase().includes(q));
  if(!rowKeys.length) return q ? `<div class="empty">No ${rowLabel.toLowerCase()} matches "${searchTerm}".</div>` : '';
  const colTotals = {}; colKeys.forEach(c=> colTotals[c]=0);
  let grandTotal = 0;
  const rowData = rowKeys.map(rk=>{
    let rowTotal = 0;
    const cellVals = colKeys.map(c=>{
      const v = (rowGroups[rk] && rowGroups[rk][c]) || 0;
      rowTotal += v; colTotals[c] += v;
      return v;
    });
    grandTotal += rowTotal;
    return {rk, cellVals, rowTotal};
  });
  const rows = rowData.map(({rk,cellVals,rowTotal})=>{
    const cellsHtml = cellVals.map(v=>`<td>${v||''}</td>`).join('');
    return totalFirst
      ? `<tr><td class="rowlabel">${rk}</td><td><b>${rowTotal}</b></td>${cellsHtml}</tr>`
      : `<tr><td class="rowlabel">${rk}</td>${cellsHtml}<td><b>${rowTotal}</b></td></tr>`;
  }).join('');
  const colTotalCellsHtml = colKeys.map(c=>`<td>${colTotals[c]}</td>`).join('');
  const totalRow = totalFirst
    ? `<tr class="total"><td class="rowlabel">Total</td><td><b>${grandTotal}</b></td>${colTotalCellsHtml}</tr>`
    : `<tr class="total"><td class="rowlabel">Total</td>${colTotalCellsHtml}<td><b>${grandTotal}</b></td></tr>`;
  const headCells = colKeys.map(c=>`<th>${c}</th>`).join('');
  const thead = totalFirst
    ? `<tr><th class="rowlabel">${rowLabel}</th><th>Total</th>${headCells}</tr>`
    : `<tr><th class="rowlabel">${rowLabel}</th>${headCells}<th>Total</th></tr>`;
  return `
  <h2 class="section">${titleOverride || (rowLabel+' by '+colLabel)} <span class="n">${period.label} · additional detail</span></h2>
  <table class="demo">
    <thead>${thead}</thead>
    <tbody>${rows}${totalRow}</tbody>
  </table>`;
}

// Task C: exports all three Position views (Breakdown, by Department, by Cost Center) as one
// workbook — one sheet each — reflecting whichever Month/Year and period mode (Monthly/Annual) is currently selected at the top of the page.
function exportPositionExcel(){
  if(typeof XLSX === 'undefined'){ toast('Excel export isn\'t available right now — try refreshing the page.'); return; }
  const {st, period} = companyDetailContext();
  const keyFn = e=> (e.position||'').trim() || 'Unspecified';
  const ccKeyFn = e=> (e.costCenter||'').trim() || 'Unassigned';
  const deptKeyFn = e=> deptOfEmployee(e, true);

  const breakdownRows = [['Position','Job Grade Group','Employment Status','Headcount','% of Status']];
  [['staff','Staff'],['rankfile','Rank & File'],['intern','Intern/OJT']].forEach(([key,label])=>{
    const list = st.active.filter(e=> STATUS_KEY(e.employmentStatus)===key);
    if(!list.length) return;
    const groups = {};
    list.forEach(e=>{ const k = keyFn(e); groups[k] = (groups[k]||0)+1; });
    const total = list.length;
    Object.keys(groups).sort().forEach(k=> breakdownRows.push([k, key==='intern' ? '' : (positionJobGradeOf(ui.company, label, k)||''), label, groups[k], (groups[k]/total*100).toFixed(1)+'%']));
  });

  function matrixSheet(colKeyFn){
    const rowGroups = {}; const cols = new Set();
    st.active.forEach(e=>{
      const rk = keyFn(e) || 'Unassigned';
      const ck = colKeyFn(e) || 'Unassigned';
      cols.add(ck);
      rowGroups[rk] = rowGroups[rk] || {};
      rowGroups[rk][ck] = (rowGroups[rk][ck]||0) + 1;
    });
    const rowKeys = Object.keys(rowGroups).sort();
    const colKeys = Array.from(cols).sort();
    const rows = [['Position','Total', ...colKeys]];
    const colTotals = colKeys.map(()=>0);
    let grand = 0;
    rowKeys.forEach(rk=>{
      let rowTotal = 0;
      const cells = colKeys.map((c,i)=>{ const v=(rowGroups[rk]&&rowGroups[rk][c])||0; rowTotal+=v; colTotals[i]+=v; return v; });
      grand += rowTotal;
      rows.push([rk, rowTotal, ...cells]);
    });
    rows.push(['Total', grand, ...colTotals]);
    return rows;
  }
  function jobGradeGroupSheet(){
    const rows = [['Employment Status','Job Grade Group','Position','Headcount','% of Status']];
    [['staff','Staff'],['rankfile','Rank & File']].forEach(([key,label])=>{
      const list = st.active.filter(e=> STATUS_KEY(e.employmentStatus)===key);
      if(!list.length) return;
      const posCounts = {};
      list.forEach(e=>{ const p=keyFn(e); posCounts[p]=(posCounts[p]||0)+1; });
      const total = list.length;
      Object.keys(posCounts).sort().forEach(p=>{
        const g = positionJobGradeOf(ui.company, label, p) || 'Unclassified';
        rows.push([label, g, p, posCounts[p], (posCounts[p]/total*100).toFixed(1)+'%']);
      });
    });
    return rows;
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(breakdownRows), 'Position Breakdown');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(matrixSheet(deptKeyFn)), 'Position by Department');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(matrixSheet(ccKeyFn)), 'Position by Cost Center');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(jobGradeGroupSheet()), 'Position by Job Grade Group');
  const scope = [ui.company||'Company', period.label].join('_').replace(/\s+/g,'-').replace(/[^\w\-]/g,'');
  XLSX.writeFile(wb, `position_breakdown_${scope}.xlsx`);
}

// Task A: Staff and Rank & File (and Intern/OJT) each get their own Position Breakdown table —
// they're no longer counted together in shared columns of a single table.
function subPositionBreakdownByStatus(st, period, keyFn, searchTerm){
  const statusDefs = [['staff','Staff'],['rankfile','Rank & File'],['intern','Intern/OJT']];
  const q = (searchTerm||'').trim().toLowerCase();
  let out = '';
  statusDefs.forEach(([key,label])=>{
    if(!subStatusHasData(label)){
      out += `<h2 class="section">Position Breakdown — ${label} <span class="n">${period.label}</span></h2><div class="empty">No ${label} data has been fed for ${monthLabel(ui.month)} yet.</div>`;
      return;
    }
    const list = st.active.filter(e=> STATUS_KEY(e.employmentStatus)===key);
    if(!list.length){
      out += `<h2 class="section">Position Breakdown — ${label} <span class="n">${period.label}</span></h2><div class="empty">No active ${label} employees to group for this view.</div>`;
      return;
    }
    const groups = {};
    list.forEach(e=>{
      const k = keyFn(e) || 'Unspecified';
      groups[k] = (groups[k]||0) + 1;
    });
    let keys = Object.keys(groups).sort();
    if(q) keys = keys.filter(k=> k.toLowerCase().includes(q));
    const total = list.length;
    if(!keys.length){
      out += `<h2 class="section">Position Breakdown — ${label} <span class="n">${period.label}</span></h2><div class="empty">No position matches "${searchTerm}".</div>`;
      return;
    }
    // Task: once a Job Position is categorized by Job Grade Group in the Control Panel, show it
    // here too — split by Staff / Rank & File (Intern/OJT has no Job Grade structure, so its
    // column is left blank rather than hidden, keeping all three tables the same shape).
    const showGrade = key!=='intern';
    const rows = keys.map(k=>`<tr><td class="rowlabel">${k}</td>${showGrade?`<td>${positionJobGradeOf(ui.company, label, k) || '—'}</td>`:''}<td>${groups[k]}</td><td>${(groups[k]/total*100).toFixed(1)}%</td></tr>`).join('');
    out += `
    <h2 class="section">Position Breakdown — ${label} <span class="n">${keys.length} position(s) · ${period.label}</span></h2>
    <table class="demo">
      <thead><tr><th class="rowlabel">Position</th>${showGrade?'<th>Job Grade Group</th>':''}<th>Headcount</th><th>% of ${label}</th></tr></thead>
      <tbody>${rows}<tr class="total"><td class="rowlabel">Total</td>${showGrade?'<td></td>':''}<td>${total}</td><td>100.0%</td></tr></tbody>
    </table>`;
  });
  return out;
}

// Groups the same Position Breakdown data by Job Grade Group instead of listing positions flat —
// Staff and Rank & File each get their own table, since job grade ranges/groups can differ per
// status (same reasoning as subJobGradeByStatus below). Groups are ordered the same way they're
// listed in the Control Panel; "Unclassified" (no group assigned, or a discrepancy still pending
// manual resolution — see positionJobGradeGroupsObserved) always sorts last so it reads as an
// open item rather than just another group.
function subPositionByJobGradeGroup(st, period, searchTerm){
  const statusDefs = [['staff','Staff'],['rankfile','Rank & File']];
  const q = (searchTerm||'').trim().toLowerCase();
  let out = '';
  statusDefs.forEach(([key,label])=>{
    if(!subStatusHasData(label)){
      out += `<h2 class="section">Position by Job Grade Group — ${label} <span class="n">${period.label}</span></h2><div class="empty">No ${label} data has been fed for ${monthLabel(ui.month)} yet.</div>`;
      return;
    }
    const list = st.active.filter(e=> STATUS_KEY(e.employmentStatus)===key);
    if(!list.length){
      out += `<h2 class="section">Position by Job Grade Group — ${label} <span class="n">${period.label}</span></h2><div class="empty">No active ${label} employees to group for this view.</div>`;
      return;
    }
    const posCounts = {};
    list.forEach(e=>{ const p=(e.position||'').trim()||'Unspecified'; posCounts[p]=(posCounts[p]||0)+1; });
    let positions = Object.keys(posCounts);
    if(q) positions = positions.filter(p=> p.toLowerCase().includes(q));
    if(!positions.length){
      out += `<h2 class="section">Position by Job Grade Group — ${label} <span class="n">${period.label}</span></h2><div class="empty">No position matches "${searchTerm}".</div>`;
      return;
    }
    const configuredOrder = jobGradeGroupsFor(ui.company, label).map(g=>g.label);
    const byGroup = {};
    positions.forEach(p=>{
      const g = positionJobGradeOf(ui.company, label, p) || 'Unclassified';
      (byGroup[g] = byGroup[g] || []).push(p);
    });
    let groupOrder = configuredOrder.filter(g=> byGroup[g]);
    Object.keys(byGroup).forEach(g=>{ if(!groupOrder.includes(g) && g!=='Unclassified') groupOrder.push(g); });
    if(byGroup['Unclassified']) groupOrder.push('Unclassified');

    const total = list.length;
    const body = groupOrder.map(g=>{
      const poss = byGroup[g].sort();
      const groupTotal = poss.reduce((sum,p)=> sum+posCounts[p], 0);
      const rows = poss.map(p=>{
        const conflict = positionJobGradeGroupsObserved(ui.company, label, p).length>1;
        return `<tr><td class="rowlabel">${p}${conflict?' <span style="color:var(--red);font-size:11px;" title="Employees under this position have Job Grades mapping to different groups — resolve in Control Panel.">⚠</span>':''}</td><td>${posCounts[p]}</td><td>${(posCounts[p]/total*100).toFixed(1)}%</td></tr>`;
      }).join('');
      return `<tr class="stathead"><td colspan="3">${g==='Unclassified'?'Unclassified':g} <span style="font-weight:400;text-transform:none;letter-spacing:0;">— ${poss.length} position(s) · ${groupTotal} employee(s) · ${(groupTotal/total*100).toFixed(1)}%</span></td></tr>${rows}`;
    }).join('');
    out += `
    <h2 class="section">Position by Job Grade Group — ${label} <span class="n">${positions.length} position(s) across ${groupOrder.length} group(s) · ${period.label}</span></h2>
    <table class="demo">
      <thead><tr><th class="rowlabel">Position</th><th>Headcount</th><th>% of ${label}</th></tr></thead>
      <tbody>${body}<tr class="total"><td class="rowlabel">Total</td><td>${total}</td><td>100.0%</td></tr></tbody>
    </table>`;
  });
  return out || '<div class="empty">No Staff or Rank &amp; File employees active in this scope.</div>';
}

/* Task D: Job Grade groups can differ per company & employment status (see Control Panel), so a
   single merged table mixing Staff and Rank & File under the same row labels would be misleading
   — the same group label can mean different grade ranges for each status. This categorizes the
   breakdown into two separate tables instead. */
function subJobGradeByStatus(st, period){
  const statusDefs = [['staff','Staff'],['rankfile','Rank & File']];
  let out = '';
  statusDefs.forEach(([key,label])=>{
    if(!subStatusHasData(label)){
      out += `<h2 class="section">Job Grade Breakdown — ${label} <span class="n">${period.label}</span></h2><div class="empty">No ${label} data has been fed for ${monthLabel(ui.month)} yet.</div>`;
      return;
    }
    const list = st.active.filter(e=> STATUS_KEY(e.employmentStatus)===key);
    const keyFn = e=> jobGradeGroupOf(e.company, e.employmentStatus, e.jobGrade);
    if(!list.length){
      out += `<h2 class="section">Job Grade Breakdown — ${label} <span class="n">${period.label}</span></h2><div class="empty">No active ${label} employees to group for this view.</div>`;
      return;
    }
    const groups = {};
    list.forEach(e=>{
      const k = keyFn(e) || 'Unclassified';
      groups[k] = (groups[k]||0) + 1;
    });
    // Task: order by the sequence the groups are listed in the Control Panel (their configured
    // low-to-high grade sequence) rather than alphabetically — alphabetical order scrambles
    // labels like "Grade 10" ahead of "Grade 2". Unclassified always trails at the end.
    const sequence = jobGradeGroupsFor(ui.company, label).map(g=>g.label);
    const keys = sequence.filter(k=> groups[k]!==undefined);
    Object.keys(groups).forEach(k=>{ if(!keys.includes(k)) keys.push(k); });
    const total = list.length;
    const rows = keys.map(k=>`<tr><td class="rowlabel">${k}</td><td>${groups[k]}</td><td>${(groups[k]/total*100).toFixed(1)}%</td></tr>`).join('');
    out += `
    <h2 class="section">Job Grade Breakdown — ${label} <span class="n">${keys.length} group(s) · ${period.label}</span></h2>
    <table class="demo">
      <thead><tr><th class="rowlabel">Job Grade Group</th><th>Headcount</th><th>% of ${label}</th></tr></thead>
      <tbody>${rows}<tr class="total"><td class="rowlabel">Total</td><td>${total}</td><td>100.0%</td></tr></tbody>
    </table>
    ${crossTabGeneric(list, keyFn, e=>deptOfEmployee(e,true), 'Job Grade Group', 'Department', keys, period, `Job Grade — ${label} by Department`)}`;
  });
  out += `<p class="hint">Job Grade groups are configured per company &amp; employment status in the Control Panel — see the Job Grade Groups panel there. Intern/OJT isn't shown here since job grade structures apply to Staff and Rank &amp; File only.</p>`;
  return out;
}

// Employees at this company whose Job Grade rose at some point within the selected calendar
// year, using the snapshot history recorded on every Master List upload/manual edit (see
// recordJobGradeSnapshot/jobGradeAsOf) — this app only keeps a live "current" Job Grade
// otherwise, so this is the same tracked-history approach used by the Executive Report's
// Promotions section, just anchored to calendar-year boundaries instead of period-to-period.
// Baseline is each employee's grade as of the END of the prior year if they were already on
// file then, or their earliest recorded grade this year if they were hired during the year
// (so a mid-year hire who's since moved up still counts). Requires at least two dated
// snapshots on their own record — with only one, there's nothing to compare against yet.
function companyAnnualPromotions(company, year, asOfEnd){
  const asOfMs = monthStr(asOfEnd);
  const priorYearEndMs = `${year-1}-12`;
  const rows = [];
  EMP.filter(e=> e.company===company && !e.dateSeparated && isOnRosterAsOf(e, asOfEnd)).forEach(e=>{
    const hist = Array.isArray(e.jobGradeHistory) ? e.jobGradeHistory.filter(h=> h.ms<=asOfMs) : [];
    if(hist.length<2) return;
    const priorEligible = hist.filter(h=> h.ms<=priorYearEndMs);
    const baseline = priorEligible.length ? priorEligible[priorEligible.length-1] : hist[0];
    const current = hist[hist.length-1];
    const startNum = jobGradeNumeric(baseline.jobGrade), curNum = jobGradeNumeric(current.jobGrade);
    if(startNum===null || curNum===null || curNum<=startNum) return;
    rows.push({
      emp:e, startGrade:baseline.jobGrade, curGrade:current.jobGrade, startNum, curNum,
      startGroup: jobGradeGroupOf(company, e.employmentStatus, baseline.jobGrade),
      curGroup: jobGradeGroupOf(company, e.employmentStatus, current.jobGrade)
    });
  });
  return rows.sort((a,b)=> (b.curNum-b.startNum)-(a.curNum-a.startNum));
}
// Same-shape table renderer for a set of promotion rows, but split into Staff and Rank & File
// sub-tables (task: keep promotion records separate per employment status rather than one
// mixed list — Staff and Rank & File typically follow different grade ladders and cadences).
function promotionsTableByStatus(rows, cols, emptyNoun){
  const staffRows = rows.filter(r=> STATUS_KEY(r.emp.employmentStatus)==='staff');

// The previous-month-vs-most-recent-month comparison requested alongside the year-to-date total
// below — always anchored to the Year/Month picked at the top of Company Detail (independent of
// the Monthly/Annual sub-tab), since "previous upload vs. most recent upload" only makes sense in
// calendar-month terms. Same on-file-snapshot approach as companyAnnualPromotions/
// execJobGradeMovement — see recordJobGradeSnapshot/jobGradeAsOf.
function companyMonthOverMonthPromotions(company){
  const {start} = monthBounds(ui.month);
  const curMs = ui.month, prevMs = monthStr(new Date(start.getFullYear(), start.getMonth()-1, 1));
  const {end: curEnd} = monthBounds(curMs), {end: prevEnd} = monthBounds(prevMs);
  const rows = [];
  EMP.filter(e=> e.company===company && !e.dateSeparated && isOnRosterAsOf(e, curEnd) && isOnRosterAsOf(e, prevEnd)).forEach(e=>{
    if(!Array.isArray(e.jobGradeHistory) || e.jobGradeHistory.length<2) return; // need at least two dated snapshots to compare
    const prevGrade = jobGradeAsOf(e, prevMs), curGrade = jobGradeAsOf(e, curMs);
    const prevNum = jobGradeNumeric(prevGrade), curNum = jobGradeNumeric(curGrade);
    if(prevNum===null || curNum===null || curNum<=prevNum) return;
    rows.push({
      emp:e, startGrade:prevGrade, curGrade, startNum:prevNum, curNum,
      startGroup: jobGradeGroupOf(company, e.employmentStatus, prevGrade),
      curGroup: jobGradeGroupOf(company, e.employmentStatus, curGrade)
    });
  });
  return { rows: rows.sort((a,b)=> (b.curNum-b.startNum)-(a.curNum-a.startNum)), curLabel: monthLabel(curMs), prevLabel: monthLabel(prevMs) };
}

function trendData(dateField, anchorMs){
  const ms = anchorMs || ui.month;
  const [y,m] = ms.split('-').map(Number);
  let out=[];
  for(let i=5;i>=0;i--){
    const d = new Date(y, m-1-i, 1);
    const dms = monthStr(d);
    const {start,end} = monthBounds(dms);
    const count = EMP.filter(e=> e.company===ui.company && (dateField==='dateHired'? isHiredIn(e,start,end) : isSeparatedIn(e,start,end))).length;
    out.push({label:d.toLocaleString('en-US',{month:'short'}), count, ms:dms});
  }
  const max = Math.max(1, ...out.map(o=>o.count));
  out.forEach(o=> o.pct = o.count/max*100);
  return out;
}

function handleRecruitUpload(){
  const input = document.getElementById('recruitFile');
  const msg = document.getElementById('recruitMsg');
  if(!input.files.length){ msg.textContent = 'Choose a CSV file first.'; return; }
  const reader = new FileReader();
  reader.onload = async ()=>{
    const rows = parseCSV(reader.result);
    if(rows.length<2){ msg.textContent = 'File appears empty.'; return; }
    const headers = rows[0].map(h=>h.trim().toLowerCase());
    const idx = name => headers.findIndex(h=> h.includes(name));
    const cCompany = idx('company'), cMonth = idx('month');
    const fieldIdx = {
      avgSalary: idx('ave salary'), interviewerTime: idx('interviewer'), loadAllocation: idx('load'),
      adPosting: idx('ad posting'), travelExpense: idx('travel'), collaterals: idx('collateral')
    };
    let count = 0;
    for(let r=1;r<rows.length;r++){
      const row = rows[r];
      const company = (row[cCompany]||'').trim();
      const month = (row[cMonth]||'').trim();
      if(!company || !month) continue;
      const rec = {};
      RECRUIT_FIELDS.forEach(([k])=>{ rec[k] = fieldIdx[k]>=0 ? (Number(row[fieldIdx[k]])||0) : 0; });
      RECRUIT[recruitKey(company, month)] = rec;
      count++;
    }
    await saveRecruit();
    msg.textContent = `Upload complete: ${count} record(s) applied.`;
    toast('Recruitment cost data merged.');
    render();
  };
  reader.readAsText(input.files[0]);
}

/* ============ HIRE & SEPARATION ARCHIVE ============ */
function archiveYears(){
  let ys = new Set([Math.max(MIN_YEAR, new Date().getFullYear())]);
  EMP.forEach(e=>{
    const dh = hireTagDate(e); if(dh && dh.getFullYear()>=MIN_YEAR) ys.add(dh.getFullYear());
    const ds = separationTagDate(e); if(ds && ds.getFullYear()>=MIN_YEAR) ys.add(ds.getFullYear());
  });
  configExtraYears().forEach(y=> ys.add(y));
  return Array.from(ys).sort((a,b)=> b-a);
}
// Intern/OJT is tracked separately from directly-employed Hires/Separations everywhere in the
// Archive — it only shows up here if the Employment Status filter is explicitly set to
// Intern/OJT, otherwise it's excluded from the totals and monthly lists just like everywhere else.
function archiveMatchesFilter(e){
  if(ui.archiveCompany && e.company!==ui.archiveCompany) return false;
  if(ui.archiveStatus && e.employmentStatus!==ui.archiveStatus) return false;
  if(ui.archiveStatus!=='Intern/OJT' && STATUS_KEY(e.employmentStatus)==='intern') return false;
  return true;
}

/* ============ BOUND FOR PERFORMANCE APPRAISAL ============
   Staff new hires are evaluated at their 3rd, 6th and 9th month. HR is notified two weeks
   before each due date, so a milestone enters this list once the lead window opens and stays
   there — turning "Due" then "Overdue" — until HR marks it done. Completion is stored on the
   employee record itself (appraisalsDone: [3,6,9] plus appraisalDoneAt timestamps), so it
   persists with everything else through saveEmp().

   Scope rules:
   - Staff only (Rank & File and Intern/OJT are not covered by this cycle).
   - Active employees only — someone who has separated drops off automatically.
   - Only staff still inside their first year: a milestone more than 12 months past due is
     treated as no longer part of the new-hire cycle, so a long-tenured roster loaded from a
     baseline Master List doesn't flood the list with years-old milestones.
   - The Completed evaluations archive (and the ability to Undo a completed evaluation) is
     Admin-only; HR can see and work the pending/due list but not the completed history. */
const APPRAISAL_MILESTONES = [3,6,9];
const APPRAISAL_LEAD_DAYS = 14;      // notify this many days before the due date
const APPRAISAL_STALE_DAYS = 365;    // beyond this the milestone is no longer new-hire tracking
const DAY_MS = 24*3600*1000;

// Adds whole months while clamping the day to the target month's length, so a hire dated
// Nov 30 doesn't roll a 3-month milestone into March 2nd.
function addMonthsClamped(d, n){
  const t = new Date(d.getFullYear(), d.getMonth()+n, 1);
  const lastDay = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  t.setDate(Math.min(d.getDate(), lastDay));
  return t;
}
const APPRAISAL_LABELS = {3:'3rd Month', 6:'6th Month', 9:'9th Month'};
function appraisalLabel(m){ return APPRAISAL_LABELS[m] || (m+' Month'); }
function appraisalDoneList(emp){ return Array.isArray(emp.appraisalsDone) ? emp.appraisalsDone : []; }
function isAppraisalDone(emp, m){ return appraisalDoneList(emp).includes(m); }
function isAppraisalTracked(emp){
  return STATUS_KEY(emp.employmentStatus)==='staff' && !emp.dateSeparated && !!parseDate(emp.dateHired);
}
// Every milestone currently inside its notification window and not yet marked done, oldest due
// date first. Each entry is one row of the list — an employee can appear more than once if two
// milestones are outstanding.
function pendingAppraisals(refDate){
  const now = refDate || new Date();
  const out = [];
  EMP.forEach(e=>{
    if(!isAppraisalTracked(e)) return;
    const hired = parseDate(e.dateHired);
    APPRAISAL_MILESTONES.forEach(m=>{
      if(isAppraisalDone(e,m)) return;
      const due = addMonthsClamped(hired, m);
      const daysLeft = Math.round((due - now)/DAY_MS);
      if(daysLeft > APPRAISAL_LEAD_DAYS) return;              // notification window hasn't opened
      if(daysLeft < -APPRAISAL_STALE_DAYS) return;            // outside the new-hire cycle entirely
      out.push({emp:e, milestone:m, due, daysLeft,
        state: daysLeft < 0 ? 'overdue' : (daysLeft === 0 ? 'due' : 'upcoming')});
    });
  });
  return out.sort((a,b)=> a.due - b.due);
}
function completedAppraisals(){
  const out = [];
  EMP.forEach(e=>{
    if(STATUS_KEY(e.employmentStatus)!=='staff') return;
    const hired = parseDate(e.dateHired); if(!hired) return;
    appraisalDoneList(e).forEach(m=>{
      out.push({emp:e, milestone:m, due: addMonthsClamped(hired,m), doneAt:(e.appraisalDoneAt||{})[m]||''});
    });
  });
  return out.sort((a,b)=> (b.doneAt||'').localeCompare(a.doneAt||''));
}
async function markAppraisalDone(id, milestone){
  const emp = EMP.find(e=> String(e.employeeId)===String(id));
  if(!emp) return;
  const m = Number(milestone);
  if(!Array.isArray(emp.appraisalsDone)) emp.appraisalsDone = [];
  if(!emp.appraisalsDone.includes(m)) emp.appraisalsDone.push(m);
  emp.appraisalsDone.sort((a,b)=>a-b);
  emp.appraisalDoneAt = emp.appraisalDoneAt || {};
  emp.appraisalDoneAt[m] = fmtDate(new Date());
  await saveEmp();
  toast(`${appraisalLabel(m)} evaluation marked done for ${emp.firstName||''} ${emp.lastName||''}`.trim());
  render();
}
async function undoAppraisalDone(id, milestone){
  if(!isAdmin()){ toast('Only Admin can access the completed evaluations archive.'); return; }
  const emp = EMP.find(e=> String(e.employeeId)===String(id));
  if(!emp) return;
  const m = Number(milestone);
  emp.appraisalsDone = appraisalDoneList(emp).filter(x=> x!==m);
  if(emp.appraisalDoneAt) delete emp.appraisalDoneAt[m];
  await saveEmp();
  render();
}
function appraisalMatchesFilter(row){
  if(ui.appraisalCompany && row.emp.company!==ui.appraisalCompany) return false;
  const q = (ui.appraisalSearch||'').trim().toLowerCase();
  if(!q) return true;
  const hay = [row.emp.employeeId, row.emp.firstName, row.emp.lastName, row.emp.position, deptOfEmployee(row.emp,false)]
    .map(v=> String(v||'').toLowerCase()).join(' ');
  return hay.includes(q);
}
function appraisalStatePill(row){
  if(row.state==='overdue') return `<span class="pill" style="background:rgba(178,58,58,.14);color:var(--red);">Overdue ${Math.abs(row.daysLeft)}d</span>`;
  if(row.state==='due') return `<span class="pill" style="background:rgba(154,106,20,.16);color:var(--gold);">Due today</span>`;
  return `<span class="pill" style="background:rgba(154,106,20,.12);color:var(--gold-dim);">In ${row.daysLeft}d</span>`;
}
function renderAppraisal(){
  const all = pendingAppraisals();
  const rows = all.filter(appraisalMatchesFilter);
  const companies = allCompanies().map(c=>c.company);
  const overdue = rows.filter(r=> r.state==='overdue').length;
  const dueSoon = rows.filter(r=> r.state!=='overdue').length;
  const done = completedAppraisals().filter(appraisalMatchesFilter);

  const table = rows.length ? `<table class="simple">
    <thead><tr><th>ID</th><th>Name</th><th>Company</th><th>Department</th><th>Position</th><th>Date Hired</th><th>Evaluation</th><th>Due Date</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td>${r.emp.employeeId||''}</td>

  const doneBlock = (isAdmin() && done.length) ? `
  <details style="margin-top:22px;">
    <summary style="cursor:pointer;color:var(--gold);font-size:12.5px;">Completed evaluations (${done.length})</summary>
    <table class="simple" style="margin-top:10px;">
      <thead><tr><th>ID</th><th>Name</th><th>Company</th><th>Evaluation</th><th>Due Date</th><th>Marked Done</th><th></th></tr></thead>
      <tbody>${done.map(r=>`<tr>
        <td>${r.emp.employeeId||''}</td>
        <td>${r.emp.lastName||''}, ${r.emp.firstName||''}</td>
        <td>${r.emp.company||''}</td>
        <td>${appraisalLabel(r.milestone)}</td>
        <td>${fmtDateMDY(fmtDate(r.due))}</td>
        <td>${r.doneAt ? fmtDateMDY(r.doneAt) : ''}</td>
        <td class="row-actions"><button class="btn small" onclick="undoAppraisalDone('${r.emp.employeeId}', ${r.milestone})">Undo</button></td>
      </tr>`).join('')}</tbody>
    </table>
  </details>` : '';

  return `
  <div class="field-row" style="align-items:center;justify-content:space-between;">
    <div style="display:flex;gap:12px;">
      <div class="card" style="padding:10px 16px;"><div class="label">Overdue</div><div class="value red" style="font-size:20px;">${overdue}</div></div>
      <div class="card" style="padding:10px 16px;"><div class="label">Due Within 2 Weeks</div><div class="value" style="font-size:20px;">${dueSoon}</div></div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
      <div class="field"><label>COMPANY</label>
        <select onchange="ui.appraisalCompany=this.value; render();">
          <option value="">All Companies</option>
          ${companies.map(c=>`<option value="${c}" ${ui.appraisalCompany===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>SEARCH</label>
        <input type="text" value="${(ui.appraisalSearch||'').replace(/"/g,'&quot;')}" placeholder="Name, ID, position" oninput="ui.appraisalSearch=this.value; clearTimeout(window.__apprT); window.__apprT=setTimeout(render,250);">
      </div>
      <button class="btn" onclick="exportAppraisalExcel()">Export to Excel</button>
    </div>
  </div>
  <p class="hint" style="margin:8px 0 16px;">Staff new hires appear here two weeks before each 3rd, 6th and 9th month evaluation and stay until marked done.</p>
  ${table}
  ${doneBlock}
  `;
}

  if(typeof XLSX === 'undefined'){ toast('Excel export isn\'t available right now — try refreshing the page.'); return; }
  const rows = pendingAppraisals().filter(appraisalMatchesFilter);
  const aoa = [['ID','Name','Company','Department','Position','Date Hired','Evaluation','Due Date','Status']]
    .concat(rows.map(r=> [r.emp.employeeId||'', `${r.emp.lastName||''}, ${r.emp.firstName||''}`, r.emp.company||'',
      deptOfEmployee(r.emp,false), r.emp.position||'', fmtDateMDY(r.emp.dateHired), appraisalLabel(r.milestone),
      fmtDateMDY(fmtDate(r.due)), r.state==='overdue' ? `Overdue by ${Math.abs(r.daysLeft)} days` : (r.state==='due' ? 'Due today' : `Due in ${r.daysLeft} days`)]));

  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'For Appraisal');
  XLSX.writeFile(wb, `bound_for_performance_appraisal_${(ui.appraisalCompany||'All-Companies').replace(/\s+/g,'-')}.xlsx`);
}
